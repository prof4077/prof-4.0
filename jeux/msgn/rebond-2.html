<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONTENU DU JEU — Rebond 2 : La chaîne (MSGN Terminale, thème 1, chapitres 3 à 6)
   L'atelier est simulé mois par mois (12 mois).
     Chaîne à 4 postes : la production d'un mois = capacité du poste le plus lent.
     Livraisons = commande de Domus, dans la limite de la production et du stock.
     Résultat = ventes − coûts variables − stock − pénalités − retours − charges fixes.
   Jauges : tre (€), qual (% sans retour), delai (% livré à l'heure), equipe (0-100).
   ===================================================================== */
const N = ' ';
const eur = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + N + '€';
const sg = n => (n >= 0 ? '+' : '−') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + N + '€';
const nb = n => Math.round(n).toLocaleString('fr-FR');
const pc = n => (Math.round(n * 10) / 10).toLocaleString('fr-FR') + N + '%';
const cl = (n, a, b) => Math.max(a, Math.min(b, n));
const F = s => s.flags;

/* ---- Paramètres (modifiables) ---- */
const POSTES = ['Réception et tri', 'Diagnostic', 'Réparation', 'Contrôle et emballage'];
const CAP0 = [420, 240, 330, 380];          // téléphones par mois, au départ
const ACHAT = 140, PIECES = 25;             // coût variable de base : 165 €
const SAL_PROD = 12400, INDIRECT = 3600;    // charges fixes : 16 000 € par mois
const SAL_OP = 2100;                        // un opérateur, charges comprises
const DEPREC = 5.7;                         // un téléphone en stock perd 3 % de 190 € par mois
const PEN_RETARD = 15, COUT_RETOUR = 60, COUT_ERREUR = 45;

function orgF(s, mo) {
  const o = F(s).org;
  if (!o || mo < 10) return 1;
  return o === 'taylor' ? (mo <= 11 ? 1.2 : 1.03) : o === 'lean' ? (mo === 10 ? 1.04 : 1.12) : 1.08;
}
function caps(s, mo) {
  const f = F(s);
  const c = [CAP0[0] * (f.rfid ? 1.2 : 1), CAP0[1] * (f.st2 ? 2 : 1) * (f.ia ? 1.25 : 1),
    CAP0[2] * (f.rep3 ? 1.3 : 1) * (s.ecrans === 'reco' ? .85 : 1) * (f.source && mo === 3 ? .95 : 1), CAP0[3] * (f.emb ? 1.58 : 1)];
  let g = orgF(s, mo) * (f.hs ? 1.1 : 1) * (s.equipe < 35 ? .9 : 1);
  if (mo === 2 && f.jat) g *= .75;
  if (f.erp && mo === 7) g *= f.formation ? .95 : .75;
  if (mo === 11) g *= ({ interim: 1.3, heures: 1.2, equipes: 1.25 })[f.bf] || 1;
  const r = c.map(x => x * g);
  if (mo === 12) r[2] *= ({ taylor: .6, lean: .85, auto: .95 })[f.org] || .8;
  return r.map(Math.round);
}
function taux(s, mo) {
  const f = F(s); let r = 3;
  if (mo >= 2 && !(f.lot && mo >= f.lot)) r += 1.5;
  if (f.ctrl) r -= 1;
  if (f.source && mo > 3) r -= 1.5;
  if (f.certif && mo >= 6) r -= .8;
  if (s.ecrans === 'origine') r -= .5; if (s.ecrans === 'reco') r += .5;
  if (f.ia === 'vite') r += 1;
  if (f.org === 'lean' && mo >= 11) r -= .4;
  if (f.org === 'taylor' && mo >= 12) r += .6;
  if (f.org === 'auto' && mo >= 10) r -= .3;
  if (mo === 11 && f.bf === 'interim') r += 1.5;
  if (s.equipe < 35) r += .7;
  return Math.max(.8, Math.round(r * 10) / 10);
}
function cv(s, mo) {
  const f = F(s);
  let c = ACHAT + PIECES + (f.jat ? -2 : 0) + (f.lot && mo >= f.lot ? 3 : 0) + (f.ctrl ? 4 : 0) + (f.rfid ? .4 : 0);
  if (s.ecrans === 'reco') c -= 15; if (s.ecrans === 'origine') c += 20;
  if (f.org === 'lean' && mo >= 11) c -= 4;
  return c;
}
function fixes(s, mo) {
  const f = F(s);
  return SAL_PROD + INDIRECT + (f.rep3 ? SAL_OP : 0) + (f.ctrl ? SAL_OP : 0) + (f.secu ? 600 : 0) + (f.hs ? 2000 : 0) + (f.erp ? 700 - 600 : 0) + (f.org === 'auto' ? 300 : 0);
}
function demande(s, mo) {
  let d = mo <= 4 ? 300 : (s.commit || 300);
  if (mo === 11) d = Math.round(d * 1.5);
  if (mo === 11 && F(s).bf === 'prevenir') d = Math.round(d * .75);
  if (mo === 12 && F(s).bf === 'prevenir') d += Math.round((s.commit || 300) * .5);
  return d;
}
/* Un mois. Ne modifie pas s (le stock est passé et rendu). */
function unMois(s, mo, stock) {
  const c = caps(s, mo), cap = Math.min(...c), goulot = c.indexOf(cap), dem = demande(s, mo), pol = s.flux || 'tire';
  const prod = pol === 'pousse' ? Math.min(cap, Math.round(dem * 1.15)) : pol === 'mixte' ? Math.min(cap, dem + Math.max(0, 100 - stock)) : Math.min(cap, dem);
  const liv = Math.min(dem, prod + stock), st = stock + prod - liv;
  const err = Math.round(liv * (F(s).erp && (mo > 7 || F(s).formation) ? .002 : .02));
  const r = taux(s, mo), late = dem - liv + err;
  const rev = liv * s.prix, var_ = prod * cv(s, mo), dep = st * DEPREC, pen = late * PEN_RETARD, ret = liv * r / 100 * COUT_RETOUR;
  const qpen = r > 3 ? rev * .05 : 0, perdus = prod * (F(s).rfid ? .001 : .01) * 190, fx = fixes(s, mo);
  const res = rev - var_ - dep - pen - err * COUT_ERREUR - ret - qpen - perdus - fx;
  return { mo, c, cap, goulot, dem, prod, liv, st, err, r, late, rev, var_, dep, pen, ret, qpen, perdus, fx, res, del: Math.max(0, (liv - err) / dem * 100) };
}
function periode(s, n) {
  let st = s.stock; const ms = [];
  for (let i = 1; i <= n; i++) { const m = unMois(s, s.mois + i, st); st = m.st; ms.push(m); }
  const sum = k => ms.reduce((a, m) => a + m[k], 0);
  const R = { ms, n, st, res: sum('res'), dem: sum('dem'), liv: sum('liv'), prod: sum('prod'), late: sum('late') };
  R.del = Math.max(0, (R.liv - sum('err')) / R.dem * 100); R.r = ms[n - 1].r; R.last = ms[n - 1];
  let dEq = 0;
  ms.forEach(m => { const o = F(s).org; dEq += (F(s).hs ? -5 : 0) + (F(s).source && m.mo > 3 ? 1 : 0) + (o === 'taylor' ? (m.mo >= 12 ? -14 : -2) : o === 'lean' ? 2 : o === 'auto' ? 3 : 0); });
  R.dEq = dEq;
  return R;
}
function fxPer(s) { const R = s.rep; return { tre: Math.round(R.res), qual: (100 - R.r) - s.qual, delai: Math.round(R.del) - s.delai, equipe: R.dEq }; }
function commit(s) { const R = s.rep; s.mois += R.n; s.stock = R.st; s.hist.push({ m: s.mois, res: Math.round(R.res), q: 100 - R.r, d: Math.round(R.del) }); s.months = (s.months || []).concat(R.ms); }

function tableau(s, titre) {
  const R = s.rep, L = R.last, m = R.ms;
  const row = (l, v, cls) => `<span${cls ? ` class="${cls}"` : ''}>${l}</span><b${cls ? ` class="${cls}"` : ''}>${v}</b>`;
  const avg = k => m.reduce((a, x) => a + x[k], 0) / m.length;
  return `<b>${titre}</b><span class="pay">${row('Commandé par Domus (par mois)', nb(avg('dem')))}${row(`Produit (poste le plus lent${N}: ${POSTES[L.goulot].toLowerCase()})`, nb(avg('prod')))}${row('Livré à l\'heure', pc(R.del))}${s.flux === 'pousse' || s.flux === 'mixte' ? row('Téléphones en stock', nb(R.st)) : ''}${row('Retours en panne', pc(R.r))}
    ${row(`Ventes (${eur(s.prix)} pièce)`, '+' + eur(avg('rev')))}${row(`Achats et pièces (${eur(cv(s, L.mo))} pièce)`, '−' + eur(avg('var_')))}${avg('dep') > 5 ? row('Stock qui perd de la valeur', '−' + eur(avg('dep'))) : ''}${row('Pénalités de retard', '−' + eur(avg('pen')))}${avg('qpen') > 0 ? row('Pénalité qualité (5 % des ventes)', '−' + eur(avg('qpen'))) : ''}${row('Retours et erreurs d\'expédition', '−' + eur(avg('ret') + avg('err') * COUT_ERREUR + avg('perdus')))}${row('Charges fixes', '−' + eur(avg('fx')))}
    ${row('Ce qui reste chaque mois', sg(R.res / R.n), 'tot')}${row(`Sur ${R.n} mois`, sg(R.res), 'tot')}</span>`;
}
function capsHtml(s, mo) {
  const c = caps(s, mo), mn = Math.min(...c);
  return `<span class="pay">${c.map((x, i) => `<span>${i + 1}. ${POSTES[i]}</span><b${x === mn ? ' style="color:var(--bad)"' : ''}>${nb(x)} / mois</b>`).join('')}</span>`;
}

  endings: [

    { id: 'renouvele', when: s => s.lastQ >= 97 && s.lastD >= 95 && s.tre >= 0, title: 'Contrat renouvelé', stamp: 'Trois ans', color: '#4CD97B',
      text: s => `Mme Vasseur sourit pour la première fois de l'année. «${N}Trois ans, et nous doublons les volumes.${N}» Ta chaîne livre à l'heure, ce qui en sort tient, et chaque téléphone rapporte plus qu'il ne coûte.${s.flags.certif ? ' Ta certification t\'ouvre déjà les portes d\'un opérateur téléphonique.' : ''}` },

  debrief: [
    { act: 1, needs: ['invest', 'flux'], title: 'Acte 1 — Le flux', text: (h, s) => {
        const i = h.invest !== 'st2' && h.rattrapage === 'oui' ? `Tu as d'abord investi ailleurs que sur le diagnostic, le <em>goulot d'étranglement</em> : le poste dont la capacité limite toute la chaîne. Pendant quatre mois, la production n'a pas bougé, jusqu'à ce que tu achètes enfin la deuxième station. La <em>capacité de production</em> d'une chaîne est celle de son poste le plus lent.` : h.invest === 'st2' ? 'Tu as investi sur le diagnostic, le <em>goulot d\'étranglement</em> : le poste dont la capacité limite toute la chaîne. C\'était le seul investissement qui augmentait la production.' : `Tu as investi ailleurs que sur le diagnostic, le <em>goulot d\'étranglement</em>. La <em>capacité de production</em> d\'une chaîne est celle de son poste le plus lent : améliorer un autre poste ne produit rien de plus.`;
        const f = h.flux === 'pousse' ? 'En produisant au maximum pour stocker, tu as choisi la <em>production en flux poussé</em> : on produit d\'abord, on vend ensuite. Le stock rassure, mais il immobilise de l\'argent et perd de la valeur.' : h.flux === 'tire' ? 'En produisant seulement ce que Domus commandait, tu as choisi la <em>production en flux tiré</em> : c\'est la commande qui déclenche la production. Pas de stock, mais aucune réserve face à un pic.' : 'Avec ta réserve de 100 téléphones, tu as choisi un <em>stock de sécurité</em> : un flux tiré, avec une marge pour les imprévus.';
        return `${i} ${f} Pour les pièces, ${h.appro === 'jat' ? 'tu as choisi le <em>juste-à-temps</em> : zéro stock, des coûts plus bas, mais une dépendance totale au fournisseur. Une semaine de retard, et la chaîne s\'est arrêtée.' : 'tu as gardé un stock de pièces : plus cher, mais la chaîne ne s\'est jamais arrêtée.'} Faire circuler les pièces et les téléphones, du fournisseur jusqu\'au camion de Domus, c\'est la <em>logistique</em>.`; },
      chain: () => ({ good: ['Repérer le goulot', 'Investir sur ce poste', 'La capacité de toute la chaîne augmente'], bad: ['Investir ailleurs', 'Le goulot bloque toujours', 'Production inchangée'] }) },
    { act: 2, needs: ['qualite', 'cause'], title: 'Acte 2 — La qualité', text: (h, s) => {
        const q = h.qualite === 'ctrl' ? 'Avec un contrôleur en bout de chaîne, tu as fait du <em>contrôle qualité</em> : on trie les produits ratés après coup. Utile, mais on continue de fabriquer des défauts.' : h.qualite === 'source' ? 'En faisant vérifier chaque poste par celui qui y travaille, tu as choisi l\'<em>autocontrôle</em> et la qualité à la source : on empêche le défaut de naître plutôt que de le trier à la fin.' : 'En visant la <em>certification</em> (comme la norme ISO 9001), tu as construit une <em>démarche qualité</em> : des méthodes écrites, vérifiées par un organisme extérieur, qui rassurent les clients.';
        const c = h.cause === 'matiere' ? 'Tu as trouvé la vraie cause grâce aux données.' : 'Tu as d\'abord accusé la mauvaise cause : les chiffres montraient pourtant que tous les opérateurs et toutes les stations avaient le même taux.';
        return `${q} Pour chercher une cause, on passe en revue les grandes familles : la main-d\'œuvre, la méthode, la matière, le matériel et le milieu (les <em>5 M</em> du diagramme d\'Ishikawa, ou diagramme <em>causes-effet</em>). ${c} Savoir de quel lot vient chaque batterie, c\'est la <em>traçabilité</em>. Corriger la cause pour que le problème ne revienne pas, c\'est l\'<em>amélioration continue</em>. Le <em>taux de retour</em> est l\'<em>indicateur</em> qui mesurait ta qualité.`; },
      chain: () => ({ good: ['Mesurer (taux de retour)', 'Chercher la cause (5 M)', 'Corriger à la source', 'Amélioration continue'], bad: ['Chercher un coupable', 'La cause reste', 'Les pénalités continuent'] }) },
    { act: 3, needs: ['prix'], title: 'Acte 3 — Les coûts', text: (h, s) => {
        return `Certains coûts suivent le nombre de téléphones : ce sont les <em>coûts variables</em> (achat, pièces). D\'autres restent les mêmes chaque mois : ce sont les <em>coûts fixes</em> (salaires, loyer, énergie). Les coûts qu\'on peut rattacher directement à un téléphone sont des <em>coûts directs</em> ; ceux qu\'il faut répartir (loyer, comptable) sont des <em>coûts indirects</em>. Tout additionner donne le <em>coût de revient</em>. Comme les coûts fixes se répartissent sur le volume, plus on produit, plus chaque téléphone coûte moins cher : c\'est pourquoi le volume promis à Domus comptait. Le nombre de téléphones à partir duquel on ne perd plus d\'argent s\'appelle le <em>seuil de rentabilité</em>. ${h.prix === 'accepter' ? 'En acceptant 215 €, tu as raisonné avec une partie seulement de tes coûts.' : h.prix === 'negocier' ? 'En négociant avec tes chiffres de qualité, tu as fait payer ta fiabilité.' : 'En refusant, tu as gardé ton prix mais réparti tes coûts fixes sur trop peu de téléphones.'} ${h.ecrans === 'reco' ? 'En réparant toi-même les écrans, tu as choisi de <em>faire</em> plutôt que d\'<em>acheter</em> : moins cher, mais plus de temps de travail.' : ''}`; },
      chain: () => ({ good: ['Coûts variables + coûts fixes', 'Coût de revient', 'Prix > coût de revient', 'Marge'], bad: ['Oublier les coûts indirects', 'Prix sous le coût réel', 'Vendre à perte'] }) },
    { act: 4, needs: ['num1'], title: 'Acte 4 — Le numérique', text: (h, s) => {
        const t = [s.flags.erp && 'Le logiciel de gestion unique s\'appelle un <em>ERP</em> (ou <em>PGI</em>, progiciel de gestion intégré) : une seule base de données partagée par tous les services, qui supprime les ressaisies et les erreurs.', s.flags.ia && `L\'IA qui note les écrans est une <em>intelligence artificielle</em> : elle apprend à partir d\'exemples. ${s.flags.ia === 'vite' ? 'Entraînée sur trop peu de photos, elle s\'est trompée.' : 'Bien entraînée et contrôlée par Samir, elle est devenue fiable.'}`, s.flags.rfid && 'Les étiquettes connectées sont des <em>objets connectés</em> : ils transmettent des données en temps réel (où est le téléphone, par où il est passé).'].filter(Boolean);
        return `${t.length ? t.join(' ') : 'Tu n\'as adopté aucun outil numérique : les erreurs d\'expédition et les téléphones perdus ont continué.'} Un outil numérique ne crée de la valeur que s\'il répond au vrai problème : accélérer un poste qui n\'est pas le goulot ne livre rien de plus. Et il change le travail des gens : ${h.formation === 'non' || h.iaVite === 'vite' ? 'sans formation ni explication, tu as provoqué chaos et inquiétude.' : 'accompagner l\'équipe (former, expliquer, rassurer) est ce qu\'on appelle la <em>conduite du changement</em>.'}`; },
      chain: () => ({ good: ['Identifier le problème réel', 'Choisir l\'outil adapté', 'Former et rassurer', 'Gain réel'], bad: ['Outil à la mode', 'Mauvais poste ou équipe pas formée', 'Dépense sans effet'] }) },
    { act: 5, needs: ['org'], title: 'Acte 5 — L\'organisation', text: (h, s) => {
        const o = h.org === 'taylor' ? 'Avec un geste par poste, chronométré, tu as appliqué le <em>taylorisme</em> (l\'<em>organisation scientifique du travail</em>) : on découpe le travail en tâches simples et répétitives (<em>division horizontale</em>) et ce sont les chefs qui décident (<em>division verticale</em>). Très productif au début, il use les salariés et rend l\'atelier fragile : personne ne sait remplacer personne.' : h.org === 'lean' ? 'En chassant les gaspillages avec l\'équipe, tu as appliqué le <em>lean management</em> : supprimer tout ce qui n\'apporte pas de valeur (attentes, déplacements, stocks, défauts), grâce aux idées des salariés et à de petites améliorations continues (le <em>kaizen</em>).' : 'En confiant l\'organisation à Yanis et à des équipes formées sur plusieurs postes, tu as misé sur la <em>délégation</em> (confier une décision à quelqu\'un), l\'<em>autonomie</em> et la <em>polyvalence</em>. Moins spectaculaire, mais une équipe motivée qui encaisse les imprévus.';
        return `${o} Le pic du Black Friday et l\'absence de Malik ont montré la vraie valeur de ton organisation : ce n\'est pas sa vitesse les bons jours, c\'est sa résistance les mauvais.`; },
      chain: () => ({ good: ['Polyvalence et autonomie', 'Un absent est remplacé', 'La chaîne tient'], bad: ['Un geste par poste', 'Personne ne remplace l\'absent', 'La chaîne s\'effondre'] }) }
  ],
  vocab: ['Capacité de production', 'Goulot d\'étranglement', 'Flux poussé', 'Flux tiré', 'Stock de sécurité', 'Juste-à-temps', 'Logistique', 'Contrôle qualité', 'Autocontrôle', 'Démarche qualité', 'Certification (ISO 9001)', 'Diagramme causes-effet (5 M)', 'Traçabilité', 'Amélioration continue', 'Coûts fixes / variables', 'Coûts directs / indirects', 'Coût de revient', 'Seuil de rentabilité', 'Faire ou acheter', 'ERP (PGI)', 'Intelligence artificielle', 'Objets connectés', 'Conduite du changement', 'Taylorisme', 'Lean management', 'Kaizen', 'Délégation', 'Autonomie', 'Polyvalence']
};
let H = {};

/* =====================================================================
   2. DÉCOR — la chaîne à quatre postes, la file d'attente devant le goulot.

GAME.scene = (S, act) => {
  const V1 = '#7C6FFF', mo = Math.min(12, (S.mois || 0) + 1), c = caps(S, mo), mn = Math.min(...c), g = c.indexOf(mn);
  const X = [128, 186, 244, 302];
  let posts = '';
  c.forEach((v, i) => {
    const h = Math.round(Math.min(v, 650) / 650 * 48), bad = i === g, col = bad ? '#FF5C6A' : V1;
    posts += `<rect x="${X[i] - 22}" y="46" width="44" height="28" rx="4" fill="#110e20" stroke="${col}"/>
      <text x="${X[i]}" y="65" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="11" fill="${col}">${i + 1}</text>
      <rect x="${X[i] - 16}" y="${150 - h}" width="32" height="${h}" fill="${col}" opacity=".35"/>
      <text x="${X[i]}" y="${146 - h}" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700" font-size="11" fill="#EEF3EC">${v}</text>`;
    if (i < 3) posts += `<line x1="${X[i] + 22}" y1="60" x2="${X[i + 1] - 22}" y2="60" stroke="#241f3d" stroke-width="3"/>`;
  });
  let pile = ''; const q = g > 0 ? Math.min(8, Math.round((c[g - 1] - mn) / 35)) : 0;
  for (let i = 0; i < q; i++) pile += `<rect x="${X[g] - 20 + (i % 4) * 9}" y="${34 - Math.floor(i / 4) * 11}" width="6" height="9" rx="1.5" fill="#FF5C6A" opacity=".85"/>`;
  const st = S.stock > 0 ? `<g>${Array.from({ length: Math.min(6, Math.ceil(S.stock / 40)) }, (_, i) => `<rect x="${336 + (i % 2) * 10}" y="${130 - Math.floor(i / 2) * 12}" width="8" height="10" fill="#FFC64F" opacity=".7"/>`).join('')}<text x="345" y="148" text-anchor="middle" font-family="Rajdhani,sans-serif" font-size="9" fill="#FFC64F">stock</text></g>` : '';
  return `<svg viewBox="0 0 360 200" role="img" aria-label="La chaîne de production de Rebond">
    <rect width="360" height="200" fill="#08070f"/><rect x="0" y="0" width="360" height="162" fill="#0b0918"/>
    <text x="215" y="16" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="9" fill="#8B86A8">CAPACITÉ PAR POSTE · TÉLÉPHONES / MOIS</text>
    <line x1="100" y1="150" x2="330" y2="150" stroke="#241f3d"/>
    ${posts}${pile}${st}
    <rect x="0" y="162" width="360" height="38" fill="#0a0814"/><line x1="0" y1="162" x2="360" y2="162" stroke="#241f3d" stroke-width="1.5"/>`;
};
/* =====================================================================
   3. MOTEUR — générique, lit GAME et ne contient aucun texte de scénario.
   ===================================================================== */
(function () {
  const app = document.getElementById('app');
  let S, queue, act, lastDeltas = [], maxAct = 0;
  const HUD = {}; GAME.hud.forEach(g => HUD[g.k] = g);

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(GAME.storeKey) || '[]'); } catch (e) { return []; } },
    add(id) { try { const a = store.get(); if (!a.includes(id)) { a.push(id); localStorage.setItem(GAME.storeKey, JSON.stringify(a)); } } catch (e) {} }
  };
  const val = (v, ...a) => typeof v === 'function' ? v(...a) : v;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  function character(id) {
    const c = GAME.characters[id];
    if (!c || !c.body) return '';
    const acc = {
      bun: `<circle cx="-2" cy="-88" r="7" fill="${c.hair}"/>`,
      cap: `<path d="M-15,-72 Q0,-92 15,-72 Z" fill="${c.color}"/><rect x="6" y="-74" width="16" height="4" rx="2" fill="${c.color}"/>`,
      box: `<rect x="14" y="-44" width="22" height="18" rx="3" fill="#8a5a22" stroke="${c.color}" stroke-width="1.5"/>`,
      tie: `<path d="M0,-52 L4,-44 L0,-26 L-4,-44 Z" fill="${c.color}"/>`,
      clip: `<rect x="14" y="-46" width="16" height="22" rx="2" fill="#EEF3EC"/><rect x="18" y="-49" width="8" height="5" rx="1" fill="${c.color}"/><rect x="2" y="-73" width="12" height="6" rx="3" fill="none" stroke="#EEF3EC" stroke-width="1.5"/>`
    }[c.acc] || '';
    return `<g transform="translate(76,186)">
      <ellipse cx="0" cy="2" rx="26" ry="5" fill="#000" opacity=".5"/>
      <rect x="-13" y="-22" width="11" height="24" rx="5" fill="#1b2420"/><rect x="2" y="-22" width="11" height="24" rx="5" fill="#1b2420"/>
      <rect x="-25" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(8 -20 -50)"/>
      <rect x="-18" y="-56" width="36" height="40" rx="12" fill="${c.body}"/>
      <rect x="15" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(-18 20 -50)"/>
      <circle cx="0" cy="-70" r="15" fill="#E8B58A"/>
      <path d="M-15,-72 Q-14,-88 0,-87 Q15,-88 15,-72 Q8,-80 -15,-72 Z" fill="${c.hair}"/>
      <circle cx="4" cy="-70" r="1.8" fill="#151515"/><circle cx="11" cy="-70" r="1.8" fill="#151515"/>
      <path d="M4,-63 Q8,-60 12,-63" stroke="#151515" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      ${acc}
      <path d="M12,-82 Q19,-70 12,-58 M17,-52 Q21,-36 17,-20" stroke="${c.color}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    </g>`;
  }

  function hud() {
    return `<div class="hud">${GAME.hud.map(g => `<div class="g${g.low(S) ? ' low' : ''}"><div class="g-l" title="${g.label}">${g.short}</div><div class="g-v">${g.show(S)}</div><div class="g-b"><i style="width:${clamp(g.pct(S), 0, 100)}%"></i></div></div>`).join('')}</div>
      <div class="deltas" aria-live="polite">${lastDeltas.map(d => `<span class="d ${d.v > 0 ? 'up' : 'down'}">${d.t}</span>`).join('')}</div>`;
  }
  function frame(who, inner) {
    app.innerHTML = `<div class="topbar"><div class="brand">${GAME.brand}</div><div class="act-tag">Acte ${act.num} · ${act.title}</div></div>
      ${hud()}<div class="stage">${GAME.scene(S, act)}${character(who)}</svg></div>${inner}`;
  }
  function whoTag(id) {
    const c = GAME.characters[id] || GAME.characters.narr;
    return `<span class="who" style="background:${c.color}">${c.name}</span>${c.role ? `<span class="role">${c.role}</span>` : ''}`;
  }
  function applyFx(fx) {
    lastDeltas = [];
    if (!fx) return;
    for (const k in fx) {
      const v = fx[k]; if (!v) continue;
      S[k] = Math.round((S[k] + v) * 10) / 10;
      const g = HUD[k];
      if (g && g.clamp) S[k] = clamp(S[k], 0, 100);
      if (g) lastDeltas.push({ v: g.inv ? -v : v, t: `${g.label} ${v > 0 ? '+' : '−'}${Math.abs(v).toLocaleString('fr-FR')}${g.unit || ''}` });

  function pushAfter(lines) {
    queue.unshift(...(lines || []).map(l => l.t ? Object.assign({}, l, { _after: true }) : ({ t: 'say', who: l.who, text: l.text, _after: true })));
  }

  function chainHtml(ch, anim) {
    let k = 0;
    const row = (items, tone) => items && items.length ? `<div class="ch-row ${tone}">${items.map((it, i) => `${i ? `<span class="ch-a"${anim ? ` style="animation-delay:${(k * 0.45).toFixed(2)}s"` : ''}>→</span>` : ''}<span class="ch-p"${anim ? ` style="animation-delay:${(k++ * 0.45).toFixed(2)}s"` : ''}>${it}</span>`).join('')}</div>` : '';
    return `<div class="chain${anim ? ' anim' : ''}">${row(ch.good, 'good')}${row(ch.bad, 'bad')}</div>`;
  }
  function startGame() {
    S = { flags: {} }; GAME.start(S);
    H = {}; lastDeltas = []; maxAct = 0;
    startAct(0);
  }
  function startAct(i) {
    act = GAME.acts[i]; maxAct = Math.max(maxAct, act.num); lastDeltas = [];
    queue = act.steps.slice();
    app.innerHTML = `<div class="card"><div class="kicker">Acte ${act.num}</div><h2>${act.title}</h2><p class="lead">${act.sub}</p><button class="btn" id="go">Continuer ▸</button></div>`;
    document.getElementById('go').onclick = next;
    window.scrollTo(0, 0);
  }
  function next() {
    const f = !act.final && GAME.fail(S);
    if (f && !(queue[0] && queue[0]._after)) return end(f);
    let st;
    while ((st = queue.shift())) { if (!st.if || st.if(S)) break; }
    if (!st) {
      const i = GAME.acts.indexOf(act);
      return i + 1 < GAME.acts.length ? startAct(i + 1) : end();
    }
    if (st.t === 'say' || st.t === 'event') {
      let text;
      if (st.t === 'event') { if (st.do) st.do(S); text = val(st.text, S); applyFx(val(st.fx, S)); if (st.set) Object.assign(S.flags, st.set); }
      else { if (!st._after) lastDeltas = []; text = val(st.text, S); }
      const w = val(st.who, S); frame(w, `<div class="box">${whoTag(w)}<p class="say">${text}</p><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'choice') {
      lastDeltas = [];
      const options = st.options;
      const html = options.map((o, i) => {
        let lock = o.lock ? o.lock(S) : null;
        if (!lock && o.cost) lock = GAME.lock(S, o.cost);
        return `<button class="opt" data-i="${i}" ${lock ? 'disabled' : ''}><div class="opt-t"><span>${val(o.label, S)}</span>${o.cost ? `<span class="opt-c">− ${o.cost.toLocaleString('fr-FR')}${N}€</span>` : ''}</div><div class="opt-d">${val(o.desc, S) || ''}</div>${lock ? `<div class="opt-lock">${lock}</div>` : ''}</button>`;
      }).join('');
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><div class="opts">${html}</div></div>`);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = options[+b.dataset.i];
        H[st.id] = o.id;
        if (o.set) Object.assign(S.flags, o.set);
        const fx = val(o.fx, S);
        if (o.do) o.do(S);
        const suite = (val(o.after, S) || []).slice();
        if (o.voix) suite.unshift({ t: 'voix', voix: val(o.voix, S) });
        if (o.chain) suite.unshift({ t: 'chain', chain: val(o.chain, S), fx });   // les jauges ne bougent qu'après la chaîne
        else applyFx(fx);
        pushAfter(suite); next();
      });
    } else if (st.t === 'chain') {
      lastDeltas = [];
      frame(null, `<div class="box"><div class="prompt">Ce que ta décision déclenche</div>${chainHtml(st.chain, true)}<button class="btn" id="go">${st.solo ? 'Continuer' : 'Voir les réactions'} ▸</button></div>`);
      document.getElementById('go').onclick = () => { applyFx(st.fx); next(); };
    } else if (st.t === 'voix') {
      frame(null, `<div class="box"><div class="voix">${st.voix.map(v => { const c = GAME.characters[v.who] || {}; return `<div class="vx"><span class="who" style="background:${c.color || '#EEF3EC'}">${v.nom || c.name}</span>${!v.nom && c.role ? `<span class="role">${c.role}</span>` : ''}<p>${v.text}</p></div>`; }).join('')}</div><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'qty') {
      lastDeltas = [];
      const mn = val(st.min, S), mx = val(st.max, S), pr = val(st.prompt, S);
      frame(null, `<div class="box"><div class="prompt">${pr}</div>
        <div class="price"><div class="price-v" id="pv"></div><div class="price-m" id="pm"></div></div>
        <input type="range" id="rng" min="${mn}" max="${mx}" step="${st.step || 1}" value="${val(st.def, S)}" aria-label="${pr}">
        <div class="range-l"><span>${st.show(mn)}</span><span>${st.show(mx)}</span></div>
        <div style="text-align:center"><button class="btn" id="go">Valider ▸</button></div></div>`);
      const r = document.getElementById('rng'), upd = () => {
        document.getElementById('pv').textContent = st.show(+r.value);
        document.getElementById('pm').innerHTML = st.info(S, +r.value);
      };
      r.oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        const n = +r.value, res = st.resolve(S, n);
        H[st.id] = res.band || String(n); H[st.id + 'v'] = n;
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    }
    window.scrollTo(0, 0);
  }

  function end(forced) {
    const e = forced ? GAME.endings.find(x => x.id === forced) : GAME.endings.find(x => x.when(S));
    store.add(e.id);
    const deb = GAME.debrief.filter(d => d.act <= maxAct && !(d.finalOnly && forced) && (d.needs || []).every(k => H[k] !== undefined))
      .map(d => `<div class="deb"><h3>${d.title}</h3><p>${d.text(H, S).replace(/ ([:?!;»])/g, N + '$1').replace(/« /g, '«' + N)}</p>${d.chain ? chainHtml(d.chain(H, S), false) : ''}</div>`).join('');
    const found = store.get().length;
    app.innerHTML = `<div class="end" data-ending="${e.id}">
      <div class="end-head"><div class="kicker">Fin de partie</div><h2>${val(e.title, S)}</h2>
        <div class="stamp" style="color:${e.color};border-color:${e.color}">${e.stamp}</div><p class="lead">${val(e.text, S)}</p></div>
      <div class="bilan">${GAME.bilan(S).map(b => `<div><small>${b[0]}</small><b>${b[1]}</b></div>`).join('')}</div>
      ${deb ? `<div class="deb-t">Ce que tu viens de vivre a un nom</div><p class="deb-s">${GAME.debIntro}</p>${deb}` : ''}
      ${forced ? `<p class="deb-s">${GAME.cutText}</p>` : ''}
      <div class="vocab">${GAME.vocab.map(v => `<span>${v}</span>`).join('')}</div>
      <div class="end-btns"><button class="btn" id="again">Rejouer ▸</button><a class="btn ghost" href="${GAME.backLink}">Retour au cours</a></div>
      <p class="found">Fins découvertes${N}: ${found} / ${GAME.endings.length}</p>
    </div><div class="foot">© 2026 Prof 4.0 — Romain Pineau · ${GAME.footer}</div>`;
    document.getElementById('again').onclick = startGame;
    window.scrollTo(0, 0);
  }

  function home() {
    const found = store.get().length;
    app.innerHTML = `<div class="card"><div class="kicker">${GAME.kicker}</div>
      <h1>${GAME.brand}</h1>
      <p class="lead">${GAME.pitch}</p>
      <button class="btn" id="go">Jouer ▸</button>
      <p class="found">${GAME.meta} · ${GAME.endings.length} fins possibles${found ? ` · ${found} découverte${found > 1 ? 's' : ''}` : ''}</p></div>
      <div class="foot">© 2026 Prof 4.0 — Romain Pineau</div>`;
    document.getElementById('go').onclick = startGame;
  }
  home();
})();
</script>
</body>
</html>
