<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONTENU DU JEU — Rebond 1 : Le lancement (MSGN Terminale, thème 1, questions 1.1 et 1.2)
   Tout ce qui se modifie est ici. Le moteur (partie 3) n'a pas besoin d'être touché.
   L'entreprise est simulée mois par mois, regroupés en trimestres :
     demande  = clients potentiels (selon l'offre, le prix, l'emplacement, la réputation, l'innovation, la concurrence)
     capacité = heures de travail disponibles ÷ heures nécessaires par unité
     ventes   = le plus petit des deux ; résultat = marge − retours − charges fixes
   Jauges : tre (trésorerie, €), qual (% d'unités sans retour), equipe (énergie, 0-100), repu (réputation, 0-100).
   ===================================================================== */
const N = ' ';
const eur = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + N + '€';
const sg = n => (n >= 0 ? '+' : '−') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + N + '€';
const nb = n => Math.round(n).toLocaleString('fr-FR');
const cl = (n, a, b) => Math.max(a, Math.min(b, n));

/* ---- Paramètres économiques (modifiables) ---- */
const MOD = {
  vente: { u: 'téléphone vendu', us: 'téléphones vendus', base: 70, ref: 279, el: 1.8, cost: 185, h: 1.6, ret: 70, stock: 40 },
  repar: { u: 'réparation', us: 'réparations', base: 130, ref: 69, el: 1.5, cost: 24, h: .9, ret: 30, stock: 0 },
  flotte: { u: 'téléphone loué', us: 'téléphones loués', base: 14, ref: 27, el: 2, cost: 185, h: 1.5, ret: 60, stock: 0, setup: 49 }
};
const LOYER = { centre: 1400, zone: 650, partage: 350 };
const AMENAG = { centre: 6000, zone: 2000, partage: 500 };
const VIS = { vente: { centre: 1, zone: .45, partage: .3 }, repar: { centre: 1, zone: .5, partage: .35 }, flotte: { centre: .9, zone: 1, partage: 1 } };
const SAL_TECH = 3300, SAL_LOU = 750, LOC_BANC = 380, DIVERS = 450, PRET = 230, LOGICIEL = 40;

const m = s => MOD[s.offre || 'vente'];
const F = s => s.flags;
function unitCost(s) {
  const r = s.offre === 'repar';
  return m(s).cost + (F(s).batterie ? (r ? 8 : 18) : 0) - (F(s).reseau ? (r ? 6 : 12) : 0);
}
function charges(s) {
  return LOYER[s.local] + (F(s).tech ? SAL_TECH : 0) + (F(s).lou ? SAL_LOU : 0) + (s.banc === 'louer' ? LOC_BANC : 0)
    + (F(s).fichier ? LOGICIEL : 0) + DIVERS + PRET + (s.offre === 'flotte' ? 190 : 0) + (F(s).augm ? 560 : 0);
}
function capa(s) {   // heures de travail productives par mois
  return 120 + (F(s).tech ? 150 : 0) + (F(s).lou ? (s.q < 1 ? 60 : (F(s).tech || F(s).process ? 110 : 80)) : 0);
}
function taux(s) {   // % d'unités qui reviennent en panne
  let r = 6;
  if (F(s).tech) r -= 3;
  if (F(s).lou && s.q < 1) r += 1;
  if (s.banc === 'outils') r += 4;
  if (F(s).process) r -= 2;
  if (F(s).batterie) r -= 1;
  if (F(s).appli && s.q >= 1) r -= 1;
  if (F(s).parti) r += F(s).process ? 1 : 5;
  if (F(s).sousTraite && s.q === 1) r += 2;
  return Math.max(1, r);
}
function inno(s) { return F(s).batterie ? 1.15 : F(s).appli ? (s.q < 1 ? .95 : 1.3) : 1; }
function atouts(s) {  // ce que le concurrent ne peut pas copier
  const a = [];
  if (F(s).marque && !F(s).nomPerdu) a.push('ta marque déposée');
  if (F(s).process) a.push('tes méthodes de test écrites');
  if (F(s).fichier) a.push('ton fichier de clients');
  if (F(s).reseau) a.push('ton réseau de fournisseurs');
  if (F(s).tech) a.push(`le savoir-faire de ${s.techNom}`);
  if (F(s).appli) a.push('ton appli de diagnostic');
  if (F(s).batterie) a.push('ta garantie de deux ans');
  if (s.repu >= 65) a.push('ta réputation');
  return a;
}
function comp(s) {
  if (s.q < 2) return 1;
  if (F(s).riposte === 'differencier') return Math.min(1.1, .62 + .07 * atouts(s).length);
  return .7;
}
function prixEff(s) { return s.prix * (F(s).riposte === 'baisser' && s.q >= 2 ? .8 : 1); }
function demandeFactor(s, p) {
  return VIS[s.offre][s.local] * (.5 + s.repu / 100) * inno(s) * comp(s) * Math.pow(m(s).ref / p, m(s).el) * (F(s).fichier && s.q >= 1 ? 1.08 : 1);
}

/* Un trimestre : calcule tout, ne modifie rien (le moteur applique ensuite les écarts). */
function trimestre(s) {
  const M = m(s), p = prixEff(s), uc = unitCost(s), r = taux(s), hpu = M.h * (s.banc === 'outils' ? 1.3 : 1), cap = capa(s), ch = charges(s);
  const f = demandeFactor(s, p);
  const R = { p, uc, r, ch, cap, hpu, q: s.q + 1 };
  if (s.offre !== 'flotte') {
    const dem = M.base * f, vol = Math.round(Math.min(dem, cap / hpu));
    Object.assign(R, { dem: Math.round(dem), vol, lost: Math.max(0, Math.round(dem) - vol), marge: vol * (p - uc), ret: vol * r / 100 * M.ret });
    R.mois = R.marge - R.ret - ch; R.total = 3 * R.mois; R.used = vol * hpu;
  } else {
    let parc = s.parc, cash = 0, nw = M.base * f, used = 0;
    const maxNew = Math.max(0, (cap - parc * .1) / hpu);
    const nm = Math.round(Math.min(nw, maxNew));
    let loyers = 0, achats = 0, ret = 0, frais = 0;
    for (let i = 0; i < 3; i++) { parc += nm; loyers += parc * (p - 3); achats += nm * uc; frais += nm * M.setup; ret += parc * r / 100 / 3 * M.ret; used += nm * hpu + parc * .1; }
    Object.assign(R, { dem: Math.round(nw), vol: nm, lost: Math.max(0, Math.round(nw) - nm), parc0: s.parc, parc1: parc, loyers, achats, frais, ret, used: used / 3 });
    R.total = loyers + frais - achats - ret - 3 * ch; R.mois = R.total / 3;
  }
  R.load = R.used / cap;
  const seul = !F(s).tech && !F(s).lou;
  R.dEq = seul ? (R.load > .8 ? -16 : -2) : (R.load > .95 ? -8 : 3);
  R.dRep = cl(Math.round((4 - r) * 2), -12, 6) + (F(s).appli ? (s.q < 1 ? -4 : 2) : 0) + (s.offre !== 'flotte' && R.lost > R.dem * .25 ? -3 : 0);
  return R;
}
function fxTrim(s) {
  const R = s.rep;
  return { tre: Math.round(R.total), qual: (100 - R.r) - s.qual, equipe: R.dEq, repu: R.dRep };
}
function apresTrim(s) {
  const R = s.rep; s.q = R.q; s.hist.push(Math.round(R.total));
  if (s.offre === 'flotte') s.parc = R.parc1;
  s.lostTot += R.lost;
}
const LIEU = { centre: 'rue commerçante', zone: 'zone artisanale', partage: 'atelier partagé de la pépinière' };
function rapport(s) {
  const R = s.rep, M = m(s);
  const capU = Math.floor(R.cap / R.hpu);
  if (s.offre !== 'flotte') {
    return `<span class="pay tick"><span>Clients intéressés par mois</span><b>${nb(R.dem)}</b><b></b>
      <span>Ce que tu peux traiter (${R.cap}${N}h ÷ ${String(R.hpu).replace('.', ',')}${N}h)</span><b>${nb(capU)}</b><b></b>
      <span>${M.us[0].toUpperCase() + M.us.slice(1)} par mois</span><b>${nb(R.vol)}</b><b>${R.lost ? `<small>${R.lost} perdus</small>` : ''}</b>
      <span>Marge par unité (${eur(R.p)} − ${eur(R.uc)})</span><b>${eur(R.p - R.uc)}</b><b></b>
      <span>Marge du mois</span><b>${eur(R.marge)}</b><b></b>
      <span>Retours en panne (${R.r}${N}%)</span><b>−${eur(R.ret)}</b><b></b>
      <span>Charges fixes du mois</span><b>−${eur(R.ch)}</b><b></b>
      <span class="tot">Résultat du mois</span><b class="tot">${sg(R.mois)}</b><b class="tot"></b>
      <span class="tot">Sur le trimestre</span><b class="tot">${sg(R.total)}</b><b class="tot"></b></span>`;
  }
  return `<span class="pay tick"><span>Nouveaux contrats par mois</span><b>${nb(R.vol)}</b><b>${R.lost ? `<small>${R.lost} perdus</small>` : ''}</b>

function commentaire(s) {
  const R = s.rep, M = m(s), c = [];
  if (s.offre !== 'flotte') {
    if (R.lost > R.dem * .15) c.push(`${R.lost} clients par mois repartent sans rien${N}: tu n'as pas assez d'heures de travail pour les servir.`);
    else if (R.load < .5) c.push(`Tes équipes ne sont occupées qu'à ${Math.round(R.load * 100)}${N}%${N}: tu paies des heures qui ne servent à rien.`);
    if (VIS[s.offre][s.local] < .6) c.push(`Peu de monde passe devant ta porte, en ${LIEU[s.local]}${N}: les clients ne te trouvent pas.`);
  } else {
    if (R.mois < 0) c.push(`Chaque nouveau contrat te coûte ${eur(R.uc - MOD.flotte.setup)} tout de suite (achat moins frais de mise en service) et ne te rapporte que ${eur(R.p - 3)} par mois. Plus tu signes, plus ta trésorerie baisse… pour l'instant.`);
    c.push(`Ton parc loué rapporte déjà ${eur(R.parc1 * (R.p - 3))} par mois, qui tomberont chaque mois sans que tu aies à revendre quoi que ce soit.`);
  }
  if (R.r >= 7) c.push(`${R.r}${N}% de retours en panne, c'est trop${N}: chaque retour coûte de l'argent et un client mécontent.`);
  if (R.dEq <= -14) c.push(`Tu travailles plus de soixante heures par semaine. Tu tiens, pour l'instant.`);
  return c.join(' ');
}

      chain: () => ({ good: ['Ressources tangibles', 'Matérielles, financières, humaines', 'Se voient, s\'achètent, se louent'], bad: ['Ressources intangibles', 'Savoir-faire, marque, réputation, relations', 'Se construisent, se copient mal'] }) },
    { act: 3, needs: ['mairie'], title: 'Acte 3 — Ouvrir', text: (h, s) => {
        const mr = h.mairie === 'oui' ? (s.flags.retard ? 'En acceptant la mairie sans avoir les heures, tu as dépassé ta <em>capacité de production</em> : retard, pénalité, équipe épuisée.' : 'En acceptant la mairie, tu as dû avancer l\'argent avant d\'être payé : c\'est le décalage entre dépenses et encaissements qui fragilise la trésorerie.') : h.mairie === 'sous' ? 'En confiant une partie du contrat à un grossiste, tu as choisi de <em>faire faire</em> plutôt que de faire : plus de capacité, moins de marge, moins de contrôle sur la qualité.' : 'En refusant la mairie, tu as protégé ta trésorerie et tes clients habituels, au prix d\'une belle référence.';
        return `Chaque trimestre suivait la même logique : la demande (clients intéressés) d\'un côté, ta <em>capacité de production</em> (heures disponibles ÷ heures par unité) de l\'autre. Tu ne vends que le plus petit des deux. Trop peu d\'heures : tu perds des clients. Trop d\'heures : tu paies des salaires inutiles. ${mr} Le <em>taux de retour</em> mesure la <em>qualité</em> : chaque panne coûte de l\'argent et des clients. ${h.plainte === 'corriger' ? 'Face à Mme Lemoine, tu as traité la cause et non seulement la plainte : c\'est une démarche d\'<em>amélioration continue</em>.' : ''}`; },
      chain: () => ({ good: ['Demande', 'Capacité de production', 'Ventes réelles', 'Résultat'], bad: ['Qualité insuffisante', 'Retours', 'Coûts et clients perdus'] }) },
    { act: 4, needs: ['riposte'], title: 'Acte 4 — La copie', text: (h, s) => {

    const body = S.local === 'zone' ? `<rect x="${x}" y="44" width="${w}" height="118" fill="#0d0b18" stroke="#241f3d"/><rect x="${x + 20}" y="84" width="${w - 40}" height="78" fill="#110e20" stroke="${V1}" stroke-width="1"/>${[0, 1, 2, 3, 4, 5].map(i => `<line x1="${x + 20}" y1="${92 + i * 12}" x2="${x + w - 20}" y2="${92 + i * 12}" stroke="#241f3d"/>`).join('')}`
      : S.local === 'centre' ? `<rect x="${x}" y="50" width="${w}" height="112" fill="#0d0b18" stroke="#241f3d"/><rect x="${x + 12}" y="82" width="${w - 50}" height="60" fill="#14102a" stroke="${V1}"/><rect x="${x + w - 32}" y="96" width="22" height="66" fill="#110e20" stroke="${V1}"/>`
      : `<rect x="${x - 4}" y="34" width="${w + 70}" height="128" fill="#0d0b18" stroke="#241f3d"/><text x="${x + 60}" y="50" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700" font-size="10" fill="#8B86A8">PÉPINIÈRE D'ENTREPRISES</text><rect x="${x + 6}" y="96" width="${w - 20}" height="40" fill="#14102a" stroke="${V1}"/>`;
    const sign = `<rect x="${x + 10}" y="${S.local === 'partage' ? 60 : S.local === 'zone' ? 54 : 58}" width="${w - 20}" height="20" fill="#0b0820" stroke="${S.flags.nomPerdu ? '#FFC64F' : V1}"/><text x="${x + w / 2}" y="${S.local === 'partage' ? 74 : S.local === 'zone' ? 68 : 72}" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="10" fill="${S.flags.nomPerdu ? '#FFC64F' : V1}">${nom}</text>`;
    const n = Math.min(8, Math.round(((S.rep && S.rep.vol) || 10) / (S.offre === 'repar' ? 25 : S.offre === 'flotte' ? 3 : 12)));
    let phones = ''; for (let i = 0; i < n; i++) phones += `<rect x="${x + 18 + i * 9}" y="${S.local === 'partage' ? 116 : S.local === 'zone' ? 140 : 120}" width="6" height="11" rx="1.5" fill="${V1}" opacity=".85"/>`;
    const team = [S.flags.tech && '#4CD97B', S.flags.lou && '#FF9D3D'].filter(Boolean).map((c, i) => `<g transform="translate(${x + w - 60 + i * 16},${S.local === 'partage' ? 128 : 150})"><circle r="5" cy="-14" fill="#E8B58A"/><rect x="-5" y="-9" width="10" height="13" rx="3" fill="${c}"/></g>`).join('');
    const tp = act.num >= 4 ? `<rect x="306" y="70" width="54" height="92" fill="#1a0b0f" stroke="#FF5C6A"/><rect x="306" y="78" width="54" height="16" fill="#FF5C6A"/><text x="333" y="90" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="7.5" fill="#1a0b0f">TÉLÉPRIX</text><text x="333" y="120" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="900" font-size="13" fill="#FF5C6A">−20%</text>` : '';
    shop = body + sign + phones + team + tp;
  }
  return `<svg viewBox="0 0 360 200" role="img" aria-label="L'atelier ${S.nom}">
    <rect width="360" height="200" fill="#08070f"/><rect x="0" y="0" width="360" height="162" fill="#0b0918"/>
    ${shop}
    <rect x="0" y="162" width="360" height="38" fill="#0a0814"/><line x1="0" y1="162" x2="360" y2="162" stroke="#241f3d" stroke-width="1.5"/>`;
};
/* =====================================================================
   3. MOTEUR — générique, lit GAME et ne contient aucun texte de scénario.
   ===================================================================== */
(function () {
  const app = document.getElementById('app');
  let S, queue, act, lastDeltas = [], maxAct = 0;
  const HUD = {}; GAME.hud.forEach(g => HUD[g.k] = g);

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(GAME.storeKey) || '[]'); } catch (e) { return []; } },
    add(id) { try { const a = store.get(); if (!a.includes(id)) { a.push(id); localStorage.setItem(GAME.storeKey, JSON.stringify(a)); } } catch (e) {} }
  };
  const val = (v, ...a) => typeof v === 'function' ? v(...a) : v;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  function character(id) {
    const c = GAME.characters[id];
    if (!c || !c.body) return '';
    const acc = {
      bun: `<circle cx="-2" cy="-88" r="7" fill="${c.hair}"/>`,
      cap: `<path d="M-15,-72 Q0,-92 15,-72 Z" fill="${c.color}"/><rect x="6" y="-74" width="16" height="4" rx="2" fill="${c.color}"/>`,
      box: `<rect x="14" y="-44" width="22" height="18" rx="3" fill="#8a5a22" stroke="${c.color}" stroke-width="1.5"/>`,
      tie: `<path d="M0,-52 L4,-44 L0,-26 L-4,-44 Z" fill="${c.color}"/>`,
      clip: `<rect x="14" y="-46" width="16" height="22" rx="2" fill="#EEF3EC"/><rect x="18" y="-49" width="8" height="5" rx="1" fill="${c.color}"/><rect x="2" y="-73" width="12" height="6" rx="3" fill="none" stroke="#EEF3EC" stroke-width="1.5"/>`
    }[c.acc] || '';
    return `<g transform="translate(76,186)">
      <ellipse cx="0" cy="2" rx="26" ry="5" fill="#000" opacity=".5"/>
      <rect x="-13" y="-22" width="11" height="24" rx="5" fill="#1b2420"/><rect x="2" y="-22" width="11" height="24" rx="5" fill="#1b2420"/>
      <rect x="-25" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(8 -20 -50)"/>
      <rect x="-18" y="-56" width="36" height="40" rx="12" fill="${c.body}"/>
      <rect x="15" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(-18 20 -50)"/>
      <circle cx="0" cy="-70" r="15" fill="#E8B58A"/>
      <path d="M-15,-72 Q-14,-88 0,-87 Q15,-88 15,-72 Q8,-80 -15,-72 Z" fill="${c.hair}"/>
      <circle cx="4" cy="-70" r="1.8" fill="#151515"/><circle cx="11" cy="-70" r="1.8" fill="#151515"/>
      <path d="M4,-63 Q8,-60 12,-63" stroke="#151515" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      ${acc}
      <path d="M12,-82 Q19,-70 12,-58 M17,-52 Q21,-36 17,-20" stroke="${c.color}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    </g>`;
  }

  function hud() {
    return `<div class="hud">${GAME.hud.map(g => `<div class="g${g.low(S) ? ' low' : ''}"><div class="g-l" title="${g.label}">${g.short}</div><div class="g-v">${g.show(S)}</div><div class="g-b"><i style="width:${clamp(g.pct(S), 0, 100)}%"></i></div></div>`).join('')}</div>
      <div class="deltas" aria-live="polite">${lastDeltas.map(d => `<span class="d ${d.v > 0 ? 'up' : 'down'}">${d.t}</span>`).join('')}</div>`;
  }
  function frame(who, inner) {
    app.innerHTML = `<div class="topbar"><div class="brand">${GAME.brand}</div><div class="act-tag">Acte ${act.num} · ${act.title}</div></div>
      ${hud()}<div class="stage">${GAME.scene(S, act)}${character(who)}</svg></div>${inner}`;
  }
  function whoTag(id) {
    const c = GAME.characters[id] || GAME.characters.narr;
    return `<span class="who" style="background:${c.color}">${c.name}</span>${c.role ? `<span class="role">${c.role}</span>` : ''}`;
  }
  function applyFx(fx) {
    lastDeltas = [];
    if (!fx) return;
    for (const k in fx) {
      const v = fx[k]; if (!v) continue;
      S[k] = Math.round((S[k] + v) * 10) / 10;
      const g = HUD[k];
      if (g && g.clamp) S[k] = clamp(S[k], 0, 100);
      if (g) lastDeltas.push({ v: g.inv ? -v : v, t: `${g.label} ${v > 0 ? '+' : '−'}${Math.abs(v).toLocaleString('fr-FR')}${g.unit || ''}` });
    }
    if (GAME.norm) GAME.norm(S);
  }
  function pushAfter(lines) {
    queue.unshift(...(lines || []).map(l => l.t ? Object.assign({}, l, { _after: true }) : ({ t: 'say', who: l.who, text: l.text, _after: true })));
  }

  function chainHtml(ch, anim) {
    let k = 0;
    const row = (items, tone) => items && items.length ? `<div class="ch-row ${tone}">${items.map((it, i) => `${i ? `<span class="ch-a"${anim ? ` style="animation-delay:${(k * 0.45).toFixed(2)}s"` : ''}>→</span>` : ''}<span class="ch-p"${anim ? ` style="animation-delay:${(k++ * 0.45).toFixed(2)}s"` : ''}>${it}</span>`).join('')}</div>` : '';
    return `<div class="chain${anim ? ' anim' : ''}">${row(ch.good, 'good')}${row(ch.bad, 'bad')}</div>`;
  }
  function startGame() {
    S = { flags: {} }; GAME.start(S);
    H = {}; lastDeltas = []; maxAct = 0;
    startAct(0);
  }
  function startAct(i) {
    act = GAME.acts[i]; maxAct = Math.max(maxAct, act.num); lastDeltas = [];
    queue = act.steps.slice();
    app.innerHTML = `<div class="card"><div class="kicker">Acte ${act.num}</div><h2>${act.title}</h2><p class="lead">${act.sub}</p><button class="btn" id="go">Continuer ▸</button></div>`;
    document.getElementById('go').onclick = next;
    window.scrollTo(0, 0);
  }
  function next() {
    const f = !act.final && GAME.fail(S);
    if (f && !(queue[0] && queue[0]._after)) return end(f);
    let st;
    while ((st = queue.shift())) { if (!st.if || st.if(S)) break; }
    if (!st) {
      const i = GAME.acts.indexOf(act);
      return i + 1 < GAME.acts.length ? startAct(i + 1) : end();
    }
    if (st.t === 'say' || st.t === 'event') {
      let text;
      if (st.t === 'event') { if (st.do) st.do(S); text = val(st.text, S); applyFx(val(st.fx, S)); if (st.set) Object.assign(S.flags, st.set); }
      else { if (!st._after) lastDeltas = []; text = val(st.text, S); }
      const w = val(st.who, S); frame(w, `<div class="box">${whoTag(w)}<p class="say">${text}</p><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'choice') {
      lastDeltas = [];
      const options = st.options;
      const html = options.map((o, i) => {
        let lock = o.lock ? o.lock(S) : null;
        if (!lock && o.cost) lock = GAME.lock(S, o.cost);
        return `<button class="opt" data-i="${i}" ${lock ? 'disabled' : ''}><div class="opt-t"><span>${val(o.label, S)}</span>${o.cost ? `<span class="opt-c">− ${o.cost.toLocaleString('fr-FR')}${N}€</span>` : ''}</div><div class="opt-d">${val(o.desc, S) || ''}</div>${lock ? `<div class="opt-lock">${lock}</div>` : ''}</button>`;
      }).join('');
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><div class="opts">${html}</div></div>`);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = options[+b.dataset.i];
        H[st.id] = o.id;
        if (o.set) Object.assign(S.flags, o.set);
        const fx = val(o.fx, S);
        if (o.do) o.do(S);
        const suite = (val(o.after, S) || []).slice();
        if (o.voix) suite.unshift({ t: 'voix', voix: val(o.voix, S) });
        if (o.chain) suite.unshift({ t: 'chain', chain: val(o.chain, S), fx });   // les jauges ne bougent qu'après la chaîne
        else applyFx(fx);
        pushAfter(suite); next();
      });
    } else if (st.t === 'chain') {
      lastDeltas = [];
      frame(null, `<div class="box"><div class="prompt">Ce que ta décision déclenche</div>${chainHtml(st.chain, true)}<button class="btn" id="go">${st.solo ? 'Continuer' : 'Voir les réactions'} ▸</button></div>`);
      document.getElementById('go').onclick = () => { applyFx(st.fx); next(); };
    } else if (st.t === 'voix') {
      frame(null, `<div class="box"><div class="voix">${st.voix.map(v => { const c = GAME.characters[v.who] || {}; return `<div class="vx"><span class="who" style="background:${c.color || '#EEF3EC'}">${v.nom || c.name}</span>${!v.nom && c.role ? `<span class="role">${c.role}</span>` : ''}<p>${v.text}</p></div>`; }).join('')}</div><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'qty') {
      lastDeltas = [];
      const mn = val(st.min, S), mx = val(st.max, S), pr = val(st.prompt, S);
      frame(null, `<div class="box"><div class="prompt">${pr}</div>
        <div class="price"><div class="price-v" id="pv"></div><div class="price-m" id="pm"></div></div>
        <input type="range" id="rng" min="${mn}" max="${mx}" step="${st.step || 1}" value="${val(st.def, S)}" aria-label="${pr}">
        <div class="range-l"><span>${st.show(mn)}</span><span>${st.show(mx)}</span></div>
        <div style="text-align:center"><button class="btn" id="go">Valider ▸</button></div></div>`);
      const r = document.getElementById('rng'), upd = () => {
        document.getElementById('pv').textContent = st.show(+r.value);
        document.getElementById('pm').innerHTML = st.info(S, +r.value);
      };
      r.oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        const n = +r.value, res = st.resolve(S, n);
        H[st.id] = res.band || String(n); H[st.id + 'v'] = n;
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    }
    window.scrollTo(0, 0);
  }

  function end(forced) {
    const e = forced ? GAME.endings.find(x => x.id === forced) : GAME.endings.find(x => x.when(S));
    store.add(e.id);
    const deb = GAME.debrief.filter(d => d.act <= maxAct && !(d.finalOnly && forced) && (d.needs || []).every(k => H[k] !== undefined))
      .map(d => `<div class="deb"><h3>${d.title}</h3><p>${d.text(H, S).replace(/ ([:?!;»])/g, N + '$1').replace(/« /g, '«' + N)}</p>${d.chain ? chainHtml(d.chain(H, S), false) : ''}</div>`).join('');
    const found = store.get().length;
    app.innerHTML = `<div class="end" data-ending="${e.id}">
      <div class="end-head"><div class="kicker">Fin de partie</div><h2>${val(e.title, S)}</h2>
        <div class="stamp" style="color:${e.color};border-color:${e.color}">${e.stamp}</div><p class="lead">${val(e.text, S)}</p></div>
      <div class="bilan">${GAME.bilan(S).map(b => `<div><small>${b[0]}</small><b>${b[1]}</b></div>`).join('')}</div>
      ${deb ? `<div class="deb-t">Ce que tu viens de vivre a un nom</div><p class="deb-s">${GAME.debIntro}</p>${deb}` : ''}
      ${forced ? `<p class="deb-s">${GAME.cutText}</p>` : ''}
      <div class="vocab">${GAME.vocab.map(v => `<span>${v}</span>`).join('')}</div>
      <div class="end-btns"><button class="btn" id="again">Rejouer ▸</button><a class="btn ghost" href="${GAME.backLink}">Retour au cours</a></div>
      <p class="found">Fins découvertes${N}: ${found} / ${GAME.endings.length}</p>
    </div><div class="foot">© 2026 Prof 4.0 — Romain Pineau · ${GAME.footer}</div>`;
    document.getElementById('again').onclick = startGame;
    window.scrollTo(0, 0);
  }

  function home() {
    const found = store.get().length;
    app.innerHTML = `<div class="card"><div class="kicker">${GAME.kicker}</div>
      <h1>${GAME.brand}</h1>
      <p class="lead">${GAME.pitch}</p>
      <button class="btn" id="go">Jouer ▸</button>
      <p class="found">${GAME.meta} · ${GAME.endings.length} fins possibles${found ? ` · ${found} découverte${found > 1 ? 's' : ''}` : ''}</p></div>
      <div class="foot">© 2026 Prof 4.0 — Romain Pineau</div>`;
    document.getElementById('go').onclick = startGame;
  }
  home();
})();
</script>
</body>
</html>
