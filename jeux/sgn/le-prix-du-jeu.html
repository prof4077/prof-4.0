.ch-row.good{border-left-color:var(--good);}.ch-row.good .ch-p{border-color:var(--good);background:rgba(76,217,123,.08);}.ch-row.good .ch-a{color:var(--good);}

.opt.pick[aria-pressed="true"]{border-color:var(--eco);background:rgba(91,143,255,.09);box-shadow:inset 3px 0 0 var(--eco);}
.opt.pick:disabled{opacity:.4;}.pick-c{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--eco);white-space:nowrap;margin-left:8px;}

<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONTENU DU JEU — Le prix du jeu (Sciences de gestion et numérique 1re STMG, thème 3)
   Studio Nébuleuse sort « Papier Monde ».
     ventes = 95 000 × valeur perçue × (25 / prix)^1,1 × marchés ouverts
     recette nette = ventes × prix × 70 % (la plateforme garde 30 %) × 95 % (licence du moteur)
     résultat = recette nette − coûts de développement − marketing − adaptations
   Puis la valeur ajoutée est partagée entre salariés, État, banque, actionnaires et studio.
   Jauges : tre (k€), note (avis des joueurs), equipe (0-100), invest (satisfaction de l'investisseur).
   ===================================================================== */
const N = ' ';
const ke = n => (n < 0 ? '−' : '') + (Math.abs(n) >= 1000 ? (Math.abs(n) / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + N + 'M€' : Math.abs(Math.round(n)).toLocaleString('fr-FR') + N + 'k€');
const sk = n => (n >= 0 ? '+' : '−') + ke(Math.abs(n));
const nb = n => Math.round(n).toLocaleString('fr-FR');
const F = s => s.flags;
const DEV = 1050;   // 18 mois de salaires de l'équipe, en k€

function vp(s, p) {
  let v = .72 + (F(s).demo ? .15 : 0) + (F(s).trailer ? .1 : 0) + (F(s).influ ? .08 : 0);
  if (p < 18) v *= .85;                  // trop bon marché : « ça doit être un petit jeu »
  if (p > 30 && v < 1) v *= .8;          // trop cher pour ce que les joueurs en savent
  return v;
}
function ventes(s, p) { return 95000 * vp(s, p) * Math.pow(25 / p, 1.1) * (F(s).loca ? 1.35 : 1) * (F(s).console ? 1.3 : 1); }
function compte(s, p) {
  const v = ventes(s, p), brut = v * p / 1000, plateforme = brut * .3, moteur = brut * .7 * .05, net = brut - plateforme - moteur;
  const mkt = (F(s).demo ? 10 : 0) + (F(s).trailer ? 40 : 0) + (F(s).influ ? 25 : 0), adapt = (F(s).loca ? 60 : 0) + (F(s).console ? 150 : 0);
  return { v, brut, plateforme, moteur, net, mkt, adapt, res: net - DEV - mkt - adapt, unit: p * .7 * .95 };
}
function avis(s, p) { const q = vp(s, p) * 25 / p; return Math.round(Math.max(40, Math.min(95, 55 + q * 25))); }
const ch = (good, bad) => ({ good, bad });
const V = (...a) => a;

const GAME = {
  title: 'Le prix du jeu',
  brand: 'LE PRIX <span>DU JEU</span>',
  storeKey: 'sgnPrixFins',
  backLink: '../../matieres/sciences-de-gestion-numerique-1ere.html',
  footer: 'Sciences de gestion et numérique 1re STMG, thème 3',
  kicker: 'SGN · 1re STMG · Thème 3',
  debIntro: 'Tu as fixé un prix, compté tes coûts, partagé la valeur créée et mesuré ta performance. Voici comment on appelle tout ça.',
  cutText: 'Ta partie s\'est arrêtée trop tôt. Rejoue pour aller jusqu\'au bilan.',
  pitch: `«${N}Papier Monde${N}» est terminé. Dix-huit mois de travail, quatorze personnes, 1,05${N}M€ de salaires. Il reste à décider combien il vaut, combien il rapporte, et à qui. Un investisseur détient 30${N}% du studio et attend son dû. L'équipe aussi.`,
  meta: '4 actes · 20 minutes',
  start: s => Object.assign(s, { tre: 0, note: 70, equipe: 60, invest: 55, prix: 25 }),
  hud: [
    { k: 'tre',    label: 'Résultat', short: 'Résultat', show: s => ke(s.tre), pct: s => 50 + s.tre / 30, low: s => s.tre < 0, unit: N + 'k€' },
    { k: 'note',   label: 'Avis des joueurs', short: 'Avis', show: s => Math.round(s.note) + ' %', pct: s => s.note, low: s => s.note < 60, unit: N + 'pts' },
    { k: 'equipe', label: 'Équipe', short: 'Équipe', show: s => Math.round(s.equipe), pct: s => s.equipe, low: s => s.equipe < 40, clamp: true },
    { k: 'invest', label: 'Investisseur', short: 'Investisseur', show: s => Math.round(s.invest), pct: s => s.invest, low: s => s.invest < 40, clamp: true }
  ],
  fail: () => null,
  lock: () => null,
  bilan: s => [['Prix', s.prix + N + '€'], ['Exemplaires vendus', nb(s.C ? s.C.v : 0)], ['Résultat', ke(s.tre)], ['Avis positifs', Math.round(s.note) + N + '%']],

  characters: {
    sarah: { name: 'Sarah', role: 'fondatrice du studio', color: '#5B8FFF', body: '#2b3a5a', hair: '#3a2418', acc: 'clip' },
    nina:  { name: 'Nina', role: 'community manager', color: '#4CD97B', body: '#2f7a4a', hair: '#c9a24a', acc: 'clip' },
    marc:  { name: 'M. Lefort', role: 'Fonds Pixel, investisseur (30 % du studio)', color: '#FF5C6A', body: '#1c1c22', hair: '#8a8f96', acc: 'tie' },
    karim: { name: 'Karim', role: 'graphiste, représentant du personnel', color: '#FFC64F', body: '#5a3a22', hair: '#8a8f96', acc: 'box' },
    comptable: { name: 'Mme Henry', role: 'expert-comptable', color: '#B9A6FF', body: '#2b3a5a', hair: '#8a8f96', acc: 'tie' },
    narr:  { name: 'Toi', role: '', color: '#5B8FFF' }
  },

  acts: [
  /* ------------------------------ ACTE 1 ------------------------------ */
  { num: 1, title: 'Ce que vaut le jeu', sub: 'Un jeu ne vaut pas ce qu\'il a coûté. Il vaut ce que les joueurs pensent qu\'il vaut.',
    steps: [
      { t: 'say', who: 'nina', text: `Avant de fixer un prix, il faut savoir combien les joueurs sont prêts à payer. Et ça dépend de ce qu'ils savent du jeu. Aujourd'hui, ils ne savent presque rien. On peut leur montrer, de trois façons, mais pas avec tout le budget.` },
      { t: 'pick', id: 'promo', prompt: 'Comment faire connaître le jeu ? (budget : 2 actions)', budget: 2, unit: 'actions', unitLabel: 'Budget marketing', go: 'Lancer ▸', min: 1,
        options: [
          { id: 'demo', label: 'Une démo gratuite', cost: 1, desc: '10 k€. Les joueurs essaient le premier niveau.' },
          { id: 'trailer', label: 'Une bande-annonce réalisée par des pros', cost: 1, desc: '40 k€. Diffusée lors d\'un grand salon en ligne.' },
          { id: 'influ', label: 'Des créateurs de contenu qui y jouent en direct', cost: 1, desc: '25 k€. Cinq vidéastes connus, 2 millions d\'abonnés.' } ],
        resolve: (s, ids) => { ids.forEach(i => s.flags[i] = true); return { fx: { note: ids.length * 3 } }; } },
      { t: 'say', who: 'nina', text: s => `${F(s).demo ? 'La démo a été téléchargée 80${N}000 fois. ' : ''}${F(s).trailer ? 'La bande-annonce a fait 1,2 million de vues. ' : ''}${F(s).influ ? 'Les directs ont fait 300${N}000 spectateurs. ' : ''}Les joueurs commencent à se faire une idée du jeu. Maintenant, le prix.`.replace(/\$\{N\}/g, N) },
      { t: 'qty', id: 'prix', prompt: 'Le prix de Papier Monde ?', min: 10, max: 40, step: 1, def: 25, show: n => n + N + '€',
        info: (s, n) => { const c = compte(s, n); return `Ventes estimées${N}: <b>${nb(c.v)} exemplaires</b><br>Ce que le studio touche par exemplaire${N}: <b>${(n * .7 * .95).toLocaleString('fr-FR', { maximumFractionDigits: 2 })}${N}€</b> (la plateforme garde 30${N}%, le moteur 5${N}%)<br>Avis attendus${N}: <b>${avis(s, n)}${N}% positifs</b>`; },
        resolve: (s, n) => { s.prix = n; const band = n < 18 ? 'bas' : n > 30 ? 'haut' : 'moyen'; return { band, fx: { note: avis(s, n) - s.note },
          chain: band === 'bas' ? ch(['Prix très attractif'], ['Beaucoup de joueurs pensent que c\'est un « petit jeu »', 'Chaque exemplaire rapporte peu']) : band === 'haut' ? ch(['Chaque exemplaire rapporte beaucoup'], ['Les joueurs hésitent', vp(s, n) < 1 ? 'Ils n\'en savent pas assez pour accepter ce prix' : 'Seuls les convaincus achètent']) : ch(['Un prix en rapport avec ce que les joueurs perçoivent du jeu'], []) }; } }
    ] },

  /* ------------------------------ ACTE 2 ------------------------------ */
  { num: 2, title: 'Ce que coûte le jeu', sub: 'Du prix payé par le joueur à ce qui reste au studio, il y a beaucoup d\'étapes.',
    steps: [

      S[k] = Math.round((S[k] + v) * 10) / 10;
      const g = HUD[k];
      if (g && g.clamp) S[k] = clamp(S[k], 0, 100);
      if (g) lastDeltas.push({ v: g.inv ? -v : v, t: `${g.label} ${v > 0 ? '+' : '−'}${Math.abs(v).toLocaleString('fr-FR')}${g.unit || ''}` });
    }
    if (GAME.norm) GAME.norm(S);
  }
  function pushAfter(lines) {
    queue.unshift(...(lines || []).map(l => l.t ? Object.assign({}, l, { _after: true }) : ({ t: 'say', who: l.who, text: l.text, _after: true })));
  }

  function chainHtml(ch, anim) {
    let k = 0;
    const row = (items, tone) => items && items.length ? `<div class="ch-row ${tone}">${items.map((it, i) => `${i ? `<span class="ch-a"${anim ? ` style="animation-delay:${(k * 0.45).toFixed(2)}s"` : ''}>→</span>` : ''}<span class="ch-p"${anim ? ` style="animation-delay:${(k++ * 0.45).toFixed(2)}s"` : ''}>${it}</span>`).join('')}</div>` : '';
    return `<div class="chain${anim ? ' anim' : ''}">${row(ch.good, 'good')}${row(ch.bad, 'bad')}</div>`;
  }
  function startGame() {
    S = { flags: {} }; GAME.start(S);
    H = {}; lastDeltas = []; maxAct = 0;
    startAct(0);
  }
  function startAct(i) {
    act = GAME.acts[i]; maxAct = Math.max(maxAct, act.num); lastDeltas = [];
    queue = act.steps.slice();
    app.innerHTML = `<div class="card"><div class="kicker">Acte ${act.num}</div><h2>${act.title}</h2><p class="lead">${act.sub}</p><button class="btn" id="go">Continuer ▸</button></div>`;
    document.getElementById('go').onclick = next;
    window.scrollTo(0, 0);
  }
  function next() {
    const f = !act.final && GAME.fail(S);
    if (f && !(queue[0] && queue[0]._after)) return end(f);
    let st;
    while ((st = queue.shift())) { if (!st.if || st.if(S)) break; }
    if (!st) {
      const i = GAME.acts.indexOf(act);
      return i + 1 < GAME.acts.length ? startAct(i + 1) : end();
    }
    if (st.t === 'say' || st.t === 'event') {
      let text;
      if (st.t === 'event') { if (st.do) st.do(S); text = val(st.text, S); applyFx(val(st.fx, S)); if (st.set) Object.assign(S.flags, st.set); }
      else { if (!st._after) lastDeltas = []; text = val(st.text, S); }
      const w = val(st.who, S); frame(w, `<div class="box">${whoTag(w)}<p class="say">${text}</p><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'choice') {
      lastDeltas = [];
      const options = st.options;
      const html = options.map((o, i) => {
        let lock = o.lock ? o.lock(S) : null;
        if (!lock && o.cost) lock = GAME.lock(S, o.cost);
        return `<button class="opt" data-i="${i}" ${lock ? 'disabled' : ''}><div class="opt-t"><span>${val(o.label, S)}</span>${o.cost ? `<span class="opt-c">− ${o.cost.toLocaleString('fr-FR')}${N}€</span>` : ''}</div><div class="opt-d">${val(o.desc, S) || ''}</div>${lock ? `<div class="opt-lock">${lock}</div>` : ''}</button>`;
      }).join('');
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><div class="opts">${html}</div></div>`);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = options[+b.dataset.i];
        H[st.id] = o.id;
        if (o.set) Object.assign(S.flags, o.set);
        const fx = val(o.fx, S);
        if (o.do) o.do(S);
        const suite = (val(o.after, S) || []).slice();
        if (o.voix) suite.unshift({ t: 'voix', voix: val(o.voix, S) });
        if (o.chain) suite.unshift({ t: 'chain', chain: val(o.chain, S), fx });   // les jauges ne bougent qu'après la chaîne
        else applyFx(fx);
        pushAfter(suite); next();
      });
    } else if (st.t === 'chain') {
      lastDeltas = [];
      frame(null, `<div class="box"><div class="prompt">Ce que ta décision déclenche</div>${chainHtml(st.chain, true)}<button class="btn" id="go">${st.solo ? 'Continuer' : 'Voir les réactions'} ▸</button></div>`);
      document.getElementById('go').onclick = () => { applyFx(st.fx); next(); };
    } else if (st.t === 'voix') {
      frame(null, `<div class="box"><div class="voix">${st.voix.map(v => { const c = GAME.characters[v.who] || {}; return `<div class="vx"><span class="who" style="background:${c.color || '#EEF3EC'}">${v.nom || c.name}</span>${!v.nom && c.role ? `<span class="role">${c.role}</span>` : ''}<p>${v.text}</p></div>`; }).join('')}</div><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'pick') {
      lastDeltas = [];
      const opts = val(st.options, S), budget = val(st.budget, S), sel = new Set();
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><p class="pick-h" id="pk"></p><div class="opts">${opts.map((o, i) => `<button class="opt pick" data-i="${i}" aria-pressed="false"><div class="opt-t"><span>${o.label}</span><span class="pick-c">${o.cost} ${st.unit || ''}</span></div><div class="opt-d">${val(o.desc, S) || ''}</div></button>`).join('')}</div><div style="text-align:center"><button class="btn" id="go">${st.go || 'Valider ▸'}</button></div></div>`);
      const used = () => [...sel].reduce((a, i) => a + opts[i].cost, 0);
      const upd = () => {
        const u = used();
        document.getElementById('pk').innerHTML = `${st.unitLabel || 'Budget'} : <b>${budget - u}</b> ${st.unit || ''} restant${budget - u > 1 ? 's' : ''} sur ${budget}`;
        app.querySelectorAll('.pick').forEach(b => { const i = +b.dataset.i; b.disabled = !sel.has(i) && opts[i].cost > budget - u; b.setAttribute('aria-pressed', sel.has(i)); });
        document.getElementById('go').disabled = st.min ? sel.size < st.min : false;
      };
      app.querySelectorAll('.pick').forEach(b => b.onclick = () => { const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); upd(); });
      upd();
      document.getElementById('go').onclick = () => {
        const ids = [...sel].sort((x, y) => x - y).map(i => opts[i].id);
        H[st.id] = ids.join(',') || 'aucun';
        const res = st.resolve(S, ids) || {};
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    } else if (st.t === 'qty') {
      lastDeltas = [];
      const mn = val(st.min, S), mx = val(st.max, S), pr = val(st.prompt, S);
      frame(null, `<div class="box"><div class="prompt">${pr}</div>
        <div class="price"><div class="price-v" id="pv"></div><div class="price-m" id="pm"></div></div>
        <input type="range" id="rng" min="${mn}" max="${mx}" step="${st.step || 1}" value="${val(st.def, S)}" aria-label="${pr}">
        <div class="range-l"><span>${st.show(mn)}</span><span>${st.show(mx)}</span></div>
        <div style="text-align:center"><button class="btn" id="go">Valider ▸</button></div></div>`);
      const r = document.getElementById('rng'), upd = () => {
        document.getElementById('pv').textContent = st.show(+r.value);
        document.getElementById('pm').innerHTML = st.info(S, +r.value);
      };
      r.oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        const n = +r.value, res = st.resolve(S, n);
        H[st.id] = res.band || String(n); H[st.id + 'v'] = n;
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    }
    window.scrollTo(0, 0);
  }

  function end(forced) {
    const e = forced ? GAME.endings.find(x => x.id === forced) : GAME.endings.find(x => x.when(S));
    store.add(e.id);
    const deb = GAME.debrief.filter(d => d.act <= maxAct && !(d.finalOnly && forced) && (d.needs || []).every(k => H[k] !== undefined))
      .map(d => `<div class="deb"><h3>${d.title}</h3><p>${d.text(H, S).replace(/ ([:?!;»])/g, N + '$1').replace(/« /g, '«' + N)}</p>${d.chain ? chainHtml(d.chain(H, S), false) : ''}</div>`).join('');
    const found = store.get().length;
    app.innerHTML = `<div class="end" data-ending="${e.id}">
      <div class="end-head"><div class="kicker">Fin de partie</div><h2>${val(e.title, S)}</h2>
        <div class="stamp" style="color:${e.color};border-color:${e.color}">${e.stamp}</div><p class="lead">${val(e.text, S)}</p></div>
      <div class="bilan">${GAME.bilan(S).map(b => `<div><small>${b[0]}</small><b>${b[1]}</b></div>`).join('')}</div>
      ${deb ? `<div class="deb-t">Ce que tu viens de vivre a un nom</div><p class="deb-s">${GAME.debIntro}</p>${deb}` : ''}
      ${forced ? `<p class="deb-s">${GAME.cutText}</p>` : ''}
      <div class="vocab">${GAME.vocab.map(v => `<span>${v}</span>`).join('')}</div>
      <div class="end-btns"><button class="btn" id="again">Rejouer ▸</button><a class="btn ghost" href="${GAME.backLink}">Retour au cours</a></div>
      <p class="found">Fins découvertes${N}: ${found} / ${GAME.endings.length}</p>
    </div><div class="foot">© 2026 Prof 4.0 — Romain Pineau · ${GAME.footer}</div>`;
    document.getElementById('again').onclick = startGame;
    window.scrollTo(0, 0);
  }

  function home() {
    const found = store.get().length;
    app.innerHTML = `<div class="card"><div class="kicker">${GAME.kicker}</div>
      <h1>${GAME.brand}</h1>
      <p class="lead">${GAME.pitch}</p>
      <button class="btn" id="go">Jouer ▸</button>
      <p class="found">${GAME.meta} · ${GAME.endings.length} fins possibles${found ? ` · ${found} découverte${found > 1 ? 's' : ''}` : ''}</p></div>
      <div class="foot">© 2026 Prof 4.0 — Romain Pineau</div>`;
    document.getElementById('go').onclick = startGame;
  }
  home();
})();
</script>
</body>
</html>
