<style>

.d.up{color:var(--good);border-color:rgba(76,217,123,.5);background:rgba(76,217,123,.1);}
.ch-row.good{border-left-color:var(--good);}.ch-row.good .ch-p{border-color:var(--good);background:rgba(76,217,123,.08);}.ch-row.good .ch-a{color:var(--good);}

.pay.tick span b{color:var(--eco);}
.pick-h{text-align:center;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:15px;margin:0 0 10px;}.pick-h b{color:var(--eco);font-size:18px;}
.opt.pick[aria-pressed="true"]{border-color:var(--eco);background:rgba(124,255,61,.09);box-shadow:inset 3px 0 0 var(--eco);}
.opt.pick:disabled{opacity:.4;}.pick-c{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--eco);white-space:nowrap;margin-left:8px;}
.opt-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}

<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONTENU DU JEU — Les choix stratégiques (Management 1re STMG, thème 3)
   Les Crêtes, cinq ans plus tard. Trois saisons simulées (k€) :
     hiver = 4 000 × neige utile × effets du positionnement et des alliances
     été / autres activités selon la diversification ; − charges − remboursements.
   Puis la commune choisit l'avenir de la station, et le club de ski cherche à se développer.
   Jauges : tre (k€), visiteurs (milliers), contrat (chances que la commune renouvelle), club (santé du club de ski).
   ===================================================================== */
const N = ' ';
const ke = n => (n < 0 ? '−' : '') + (Math.abs(Math.round(n)) >= 1000 ? (Math.abs(n) / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + N + 'M€' : Math.abs(Math.round(n)).toLocaleString('fr-FR') + N + 'k€');
const sk = n => (n >= 0 ? '+' : '−') + ke(Math.abs(n));
const nb = n => Math.round(n).toLocaleString('fr-FR');
const F = s => s.flags;

const NEIGE = [0, .9, .5, .8];
function saison(s, y) {
  const f = F(s);
  const utile = Math.max(NEIGE[y], Math.min(.85, NEIGE[y] + .25));
  let skieurs = 65 * utile, prix = 62;
  if (f.pos === 'couts') { prix *= .75; skieurs *= y >= 2 ? 1.02 : 1.25; }
  if (f.pos === 'diff') { prix *= 1.08; skieurs *= .97; }
  if (f.pos === 'niche') { skieurs *= .7; }
  if (f.croiss === 'alliance') skieurs *= 1.08;
  let hiver = skieurs * prix;
  const groupes = f.pos === 'niche' ? [0, 1300, 1400, 1450][y] : 0;            // classes de neige et colonies, contrats sur plusieurs années
  let ete = 400;
  if (f.act === 'liee') ete = [0, 900, 1500, 1900][y];
  let aqua = f.act === 'nonliee' ? 1200 : 0;
  let mourtis = f.croiss === 'rachat' && y >= 2 ? 1500 * Math.max(NEIGE[y], .4) / .9 : 0;
  let charges = 2300 + 1500 + (f.pos === 'couts' ? -300 : f.pos === 'diff' ? 200 : f.pos === 'niche' ? 300 : 0)
    + (f.act === 'liee' ? 250 + 180 : 0) + (f.act === 'nonliee' ? 900 + 600 + (y === 2 ? 400 : 0) : 0)
    + (f.croiss === 'rachat' ? 250 + (y === 1 ? 300 : 1100) : 0) + (f.croiss === 'alliance' ? 100 : 0);
  const ca = hiver + groupes + ete + aqua + mourtis, res = ca - charges;
  return { y, utile, skieurs, prix, hiver, groupes, ete, aqua, mourtis, charges, res, visiteurs: skieurs + groupes / 25 + ete / 20 + aqua / 15 + mourtis / 50 };
}
function tableau(s, R) {
  const row = (l, v, c) => `<span${c ? ' class="tot"' : ''}>${l}</span><b${c ? ' class="tot"' : ''}>${v}</b>`;
  return `<span class="pay">${row('Neige utile', Math.round(R.utile * 100) + N + '%')}${row(`Skieurs (${nb(R.skieurs)}${N}000 × ${Math.round(R.prix)}${N}€)`, ke(R.hiver))}${R.groupes ? row('Classes de neige et colonies', ke(R.groupes)) : ''}${row('Été', ke(R.ete))}${R.aqua ? row('Centre aquatique', ke(R.aqua)) : ''}${R.mourtis ? row('Station du Mourtis', ke(R.mourtis)) : ''}${row('Charges et remboursements', '−' + ke(R.charges))}${row('Résultat de la saison', sk(R.res), 1)}</span>`;
}
const ch = (good, bad) => ({ good, bad });
const V = (a, b, c) => [a, b, c].filter(Boolean);

const GAME = {
  title: 'Les choix stratégiques',
  brand: 'LES CHOIX <span>STRATÉGIQUES</span>',
  storeKey: 'choixStrategiquesFins',
  backLink: '../../matieres/management-1ere.html',
  footer: 'Management 1re STMG, thème 3',
  kicker: 'Management · 1re STMG · Thème 3',
  debIntro: 'Tu as choisi où te battre, comment grandir, puis tu as vu la station avec les yeux d\'une commune et d\'une association. Voici comment on appelle ces choix.',
  cutText: 'Ta partie s\'est arrêtée trop tôt. Rejoue pour aller jusqu\'à la décision de la commune.',
  pitch: `Les Crêtes appartiennent à la commune. Depuis quinze ans, c'est ta société qui l'exploite, grâce à un contrat qui se termine dans trois ans. D'ici là, tu dois choisir sur quoi miser, comment grandir, et convaincre la commune de te garder. Puis tu verras la montagne avec d'autres yeux${N}: ceux du maire, et ceux du club de ski du village.`,
  meta: '4 actes · 25 minutes',
  start: s => Object.assign(s, { tre: 1500, visiteurs: 80, contrat: 50, club: 55, hist: [] }),
  hud: [
    { k: 'tre',       label: 'Trésorerie', short: 'Trésorerie', show: s => ke(s.tre), pct: s => s.tre / 40, low: s => s.tre < 300, unit: N + 'k€' },
    { k: 'visiteurs', label: 'Visiteurs (milliers)', short: 'Visiteurs', show: s => nb(s.visiteurs) + N + 'k', pct: s => s.visiteurs / 1.6, low: s => s.visiteurs < 60, unit: N + 'k' },
    { k: 'contrat',   label: 'Confiance de la commune', short: 'Commune', show: s => Math.round(s.contrat), pct: s => s.contrat, low: s => s.contrat < 40, clamp: true },
    { k: 'club',      label: 'Santé du club de ski', short: 'Club', show: s => Math.round(s.club), pct: s => s.club, low: s => s.club < 40, clamp: true }
  ],
  fail: () => null,
  lock: () => null,
  bilan: s => [['Trésorerie de ta société', ke(s.tre)], ['Résultats des 3 saisons', s.hist.map(sk).join(' · ')], ['Décision de la commune', ({ dsp: 'contrat renouvelé', regie: 'reprise en régie', cession: 'station vendue' })[s.flags.commune] || '—'], ['Santé du club', Math.round(s.club) + ' / 100']],

  characters: {
    faure: { name: 'Mme Faure', role: 'présidente de ton conseil d\'administration', color: '#FFC64F', body: '#5a3a22', hair: '#8a8f96', acc: 'clip' },
    maire: { name: 'M. Arnaud', role: 'maire des Crêtes', color: '#5B8FFF', body: '#2b3a5a', hair: '#8a8f96', acc: 'tie' },
    grand: { name: 'Mme Royer', role: 'GrandsDomaines, groupe de 22 stations', color: '#FF5C6A', body: '#1c1c22', hair: '#3a2418', acc: 'tie' },
    club:  { name: 'Julien', role: 'président bénévole du Ski Club des Crêtes', color: '#5BC8FF', body: '#c0392b', hair: '#3a2418', acc: 'cap' },
    marc:  { name: 'Marc', role: 'chef des pistes', color: '#4CD97B', body: '#2f7a4a', hair: '#3a2418', acc: 'cap' },
    narr:  { name: 'Toi', role: '', color: '#7CFF3D' }
  },

  acts: [
  /* ------------------------------ ACTE 1 ------------------------------ */
  { num: 1, title: 'Où se battre', sub: 'Tu ne peux pas être à la fois la station la moins chère, la plus chaleureuse et la plus spécialisée. Il faut choisir.',
    steps: [
      { t: 'say', who: 'faure', text: `Val-Haut, 1${N}800${N}m, 30 stations de ski dans le groupe derrière elle, des moyens que nous n'aurons jamais. Nous ne pouvons pas faire comme elle en plus petit. Sur quoi voulons-nous être les meilleurs${N}?` },
      { t: 'choice', id: 'pos', prompt: `Comment te distinguer${N}?`, options: [
        { id: 'couts', label: 'Être la station la moins chère du massif', desc: 'Forfait −25 %, services réduits au minimum, charges allégées.', set: { pos: 'couts' },
          chain: ch(['Les prix les plus bas attirent la foule', '+25 % de skieurs la première saison'], ['Il faut des coûts plus bas que tous les concurrents', 'Val-Haut, bien plus grande, peut baisser encore plus', 'Une guerre des prix se gagne avec des volumes que tu n\'as pas']),
          voix: V({ who: 'marc', text: `Plus de monde, moins de personnel. Ça va tanguer.` }, { who: 'faure', text: `Être le moins cher face à un géant… J'espère que vous avez fait vos calculs.` }) },
        { id: 'diff', label: 'Se démarquer : la station « slow ski » des familles', desc: 'Pistes douces, accueil personnalisé, garderie, prix un peu plus élevé.', set: { pos: 'diff' },
          chain: ch(['Une offre que Val-Haut ne propose pas', 'Les familles acceptent de payer un peu plus pour ce qu\'elles ne trouvent pas ailleurs', 'Tu t\'appuies sur ta force : l\'école de ski réputée'], ['Des services en plus à payer', 'Un peu moins de skieurs']),
          voix: V({ who: 'marc', text: `Ça, c'est ce qu'on sait faire. Les gamins, on les adore.` }, { who: 'faure', text: `Être différent plutôt que moins cher. Je suis convaincue.` }) },

  debrief: [
    { act: 1, needs: ['pos', 'act'], title: 'Acte 1 — Où se battre', text: h => `Pour se développer face à la concurrence, une entreprise choisit une <em>stratégie générique</em> : la <em>domination par les coûts</em> (être le moins cher, ce qui suppose d\'être plus gros ou plus efficace que tous), la <em>différenciation</em> (proposer quelque chose de différent, pour lequel les clients acceptent de payer), ou la <em>focalisation</em> (se concentrer sur un segment précis de clientèle, une <em>niche</em>). ${h.pos === 'couts' ? 'Face à un concurrent bien plus grand, la domination par les coûts était perdue d\'avance.' : h.pos === 'diff' ? 'Tu as choisi la différenciation, en t\'appuyant sur ta compétence reconnue : les enfants.' : 'Tu as choisi la focalisation sur les groupes scolaires.'} Elle choisit aussi son <em>domaine d\'activité</em> : la <em>spécialisation</em> (un seul métier) ou la <em>diversification</em>. ${h.act === 'liee' ? 'Ta diversification était <em>liée</em> : elle utilisait tes compétences et ton matériel.' : h.act === 'nonliee' ? 'Ta diversification était <em>non liée</em> (conglomérale) : un métier sans rapport avec le tien, donc plus risqué.' : 'Tu es resté spécialisé, donc dépendant d\'un seul métier.'}`,

    { act: 3, needs: ['commune'], title: 'Acte 3 — Dans le bureau du maire', text: h => `Une <em>organisation publique</em> comme une commune n\'a pas la même stratégie qu\'une entreprise : elle poursuit l\'<em>intérêt général</em> (emplois, accès de tous, avenir du territoire), et elle rend des comptes aux électeurs et aux contribuables. Pour gérer un <em>service public</em>, elle peut le faire elle-même, en <em>régie</em>, ou le confier à une entreprise par une <em>délégation de service public</em> (DSP) : elle reste propriétaire, fixe les règles dans un <em>cahier des charges</em>, et l\'entreprise prend les risques financiers. Elle peut aussi vendre : c\'est une <em>privatisation</em>, qui lui fait perdre le contrôle. ${h.commune === 'dsp' ? 'Tu as conseillé la DSP.' : h.commune === 'regie' ? 'Tu as conseillé la régie.' : 'Tu as conseillé la vente.'}`,

    <defs><clipPath id="mt3"><polygon points="110,160 205,40 300,160"/></clipPath></defs>
    <polygon points="250,160 315,30 360,160" fill="#1c2230"/><polygon points="270,70 315,30 345,70" fill="#EEF3EC" opacity=".6"/><text x="352" y="22" text-anchor="end" font-family="Rajdhani,sans-serif" font-size="9" fill="#FF5C6A">Val-Haut</text>
    <polygon points="110,160 205,40 300,160" fill="#2a3240"/><rect x="100" y="0" width="210" height="${snowY}" fill="#EEF3EC" clip-path="url(#mt3)" opacity=".9"/>
    ${tags.map((t, i) => `<rect x="124" y="${100 + i * 0}" width="0" height="0"/><rect x="${120 + (i % 2) * 92}" y="${112 + Math.floor(i / 2) * 18}" width="88" height="15" rx="3" fill="#0f150c" stroke="#7CFF3D"/><text x="${164 + (i % 2) * 92}" y="${123 + Math.floor(i / 2) * 18}" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700" font-size="9" fill="#7CFF3D">${t}</text>`).join('')}
    <rect x="0" y="162" width="360" height="38" fill="#080b06"/><line x1="0" y1="162" x2="360" y2="162" stroke="#1d2a17" stroke-width="1.5"/>`;
};
/* =====================================================================
   3. MOTEUR — générique, lit GAME et ne contient aucun texte de scénario.
   ===================================================================== */
(function () {
  const app = document.getElementById('app');
  let S, queue, act, lastDeltas = [], maxAct = 0;
  const HUD = {}; GAME.hud.forEach(g => HUD[g.k] = g);

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(GAME.storeKey) || '[]'); } catch (e) { return []; } },
    add(id) { try { const a = store.get(); if (!a.includes(id)) { a.push(id); localStorage.setItem(GAME.storeKey, JSON.stringify(a)); } } catch (e) {} }
  };
  const val = (v, ...a) => typeof v === 'function' ? v(...a) : v;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  function character(id) {
    const c = GAME.characters[id];
    if (!c || !c.body) return '';
    const acc = {
      bun: `<circle cx="-2" cy="-88" r="7" fill="${c.hair}"/>`,
      cap: `<path d="M-15,-72 Q0,-92 15,-72 Z" fill="${c.color}"/><rect x="6" y="-74" width="16" height="4" rx="2" fill="${c.color}"/>`,
      box: `<rect x="14" y="-44" width="22" height="18" rx="3" fill="#8a5a22" stroke="${c.color}" stroke-width="1.5"/>`,
      tie: `<path d="M0,-52 L4,-44 L0,-26 L-4,-44 Z" fill="${c.color}"/>`,
      clip: `<rect x="14" y="-46" width="16" height="22" rx="2" fill="#EEF3EC"/><rect x="18" y="-49" width="8" height="5" rx="1" fill="${c.color}"/><rect x="2" y="-73" width="12" height="6" rx="3" fill="none" stroke="#EEF3EC" stroke-width="1.5"/>`
    }[c.acc] || '';
    return `<g transform="translate(76,186)">
      <ellipse cx="0" cy="2" rx="26" ry="5" fill="#000" opacity=".5"/>
      <rect x="-13" y="-22" width="11" height="24" rx="5" fill="#1b2420"/><rect x="2" y="-22" width="11" height="24" rx="5" fill="#1b2420"/>
      <rect x="-25" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(8 -20 -50)"/>
      <rect x="-18" y="-56" width="36" height="40" rx="12" fill="${c.body}"/>
      <rect x="15" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(-18 20 -50)"/>
      <circle cx="0" cy="-70" r="15" fill="#E8B58A"/>
      <path d="M-15,-72 Q-14,-88 0,-87 Q15,-88 15,-72 Q8,-80 -15,-72 Z" fill="${c.hair}"/>
      <circle cx="4" cy="-70" r="1.8" fill="#151515"/><circle cx="11" cy="-70" r="1.8" fill="#151515"/>
      <path d="M4,-63 Q8,-60 12,-63" stroke="#151515" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      ${acc}
      <path d="M12,-82 Q19,-70 12,-58 M17,-52 Q21,-36 17,-20" stroke="${c.color}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    </g>`;
  }

  function hud() {
    return `<div class="hud">${GAME.hud.map(g => `<div class="g${g.low(S) ? ' low' : ''}"><div class="g-l" title="${g.label}">${g.short}</div><div class="g-v">${g.show(S)}</div><div class="g-b"><i style="width:${clamp(g.pct(S), 0, 100)}%"></i></div></div>`).join('')}</div>
      <div class="deltas" aria-live="polite">${lastDeltas.map(d => `<span class="d ${d.v > 0 ? 'up' : 'down'}">${d.t}</span>`).join('')}</div>`;
  }
  function frame(who, inner) {
    app.innerHTML = `<div class="topbar"><div class="brand">${GAME.brand}</div><div class="act-tag">Acte ${act.num} · ${act.title}</div></div>
      ${hud()}<div class="stage">${GAME.scene(S, act)}${character(who)}</svg></div>${inner}`;
  }
  function whoTag(id) {
    const c = GAME.characters[id] || GAME.characters.narr;
    return `<span class="who" style="background:${c.color}">${c.name}</span>${c.role ? `<span class="role">${c.role}</span>` : ''}`;
  }
  function applyFx(fx) {
    lastDeltas = [];
    if (!fx) return;
    for (const k in fx) {
      const v = fx[k]; if (!v) continue;
      S[k] = Math.round((S[k] + v) * 10) / 10;
      const g = HUD[k];
      if (g && g.clamp) S[k] = clamp(S[k], 0, 100);
      if (g) lastDeltas.push({ v: g.inv ? -v : v, t: `${g.label} ${v > 0 ? '+' : '−'}${Math.abs(v).toLocaleString('fr-FR')}${g.unit || ''}` });
    }
    if (GAME.norm) GAME.norm(S);
  }
  function pushAfter(lines) {
    queue.unshift(...(lines || []).map(l => l.t ? Object.assign({}, l, { _after: true }) : ({ t: 'say', who: l.who, text: l.text, _after: true })));
  }

  function chainHtml(ch, anim) {
    let k = 0;
    const row = (items, tone) => items && items.length ? `<div class="ch-row ${tone}">${items.map((it, i) => `${i ? `<span class="ch-a"${anim ? ` style="animation-delay:${(k * 0.45).toFixed(2)}s"` : ''}>→</span>` : ''}<span class="ch-p"${anim ? ` style="animation-delay:${(k++ * 0.45).toFixed(2)}s"` : ''}>${it}</span>`).join('')}</div>` : '';
    return `<div class="chain${anim ? ' anim' : ''}">${row(ch.good, 'good')}${row(ch.bad, 'bad')}</div>`;
  }
  function startGame() {
    S = { flags: {} }; GAME.start(S);
    H = {}; lastDeltas = []; maxAct = 0;
    startAct(0);
  }
  function startAct(i) {
    act = GAME.acts[i]; maxAct = Math.max(maxAct, act.num); lastDeltas = [];
    queue = act.steps.slice();
    app.innerHTML = `<div class="card"><div class="kicker">Acte ${act.num}</div><h2>${act.title}</h2><p class="lead">${act.sub}</p><button class="btn" id="go">Continuer ▸</button></div>`;
    document.getElementById('go').onclick = next;
    window.scrollTo(0, 0);
  }
  function next() {
    const f = !act.final && GAME.fail(S);
    if (f && !(queue[0] && queue[0]._after)) return end(f);
    let st;
    while ((st = queue.shift())) { if (!st.if || st.if(S)) break; }
    if (!st) {
      const i = GAME.acts.indexOf(act);
      return i + 1 < GAME.acts.length ? startAct(i + 1) : end();
    }
    if (st.t === 'say' || st.t === 'event') {
      let text;
      if (st.t === 'event') { if (st.do) st.do(S); text = val(st.text, S); applyFx(val(st.fx, S)); if (st.set) Object.assign(S.flags, st.set); }
      else { if (!st._after) lastDeltas = []; text = val(st.text, S); }
      const w = val(st.who, S); frame(w, `<div class="box">${whoTag(w)}<p class="say">${text}</p><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'choice') {
      lastDeltas = [];
      const options = st.options;
      const html = options.map((o, i) => {
        let lock = o.lock ? o.lock(S) : null;
        if (!lock && o.cost) lock = GAME.lock(S, o.cost);
        return `<button class="opt" data-i="${i}" ${lock ? 'disabled' : ''}><div class="opt-t"><span>${val(o.label, S)}</span>${o.cost ? `<span class="opt-c">− ${o.cost.toLocaleString('fr-FR')}${N}€</span>` : ''}</div><div class="opt-d">${val(o.desc, S) || ''}</div>${lock ? `<div class="opt-lock">${lock}</div>` : ''}</button>`;
      }).join('');
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><div class="opts">${html}</div></div>`);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = options[+b.dataset.i];
        H[st.id] = o.id;
        if (o.set) Object.assign(S.flags, o.set);
        const fx = val(o.fx, S);
        if (o.do) o.do(S);
        const suite = (val(o.after, S) || []).slice();
        if (o.voix) suite.unshift({ t: 'voix', voix: val(o.voix, S) });
        if (o.chain) suite.unshift({ t: 'chain', chain: val(o.chain, S), fx });   // les jauges ne bougent qu'après la chaîne
        else applyFx(fx);
        pushAfter(suite); next();
      });
    } else if (st.t === 'chain') {
      lastDeltas = [];
      frame(null, `<div class="box"><div class="prompt">Ce que ta décision déclenche</div>${chainHtml(st.chain, true)}<button class="btn" id="go">${st.solo ? 'Continuer' : 'Voir les réactions'} ▸</button></div>`);
      document.getElementById('go').onclick = () => { applyFx(st.fx); next(); };
    } else if (st.t === 'voix') {
      frame(null, `<div class="box"><div class="voix">${st.voix.map(v => { const c = GAME.characters[v.who] || {}; return `<div class="vx"><span class="who" style="background:${c.color || '#EEF3EC'}">${v.nom || c.name}</span>${!v.nom && c.role ? `<span class="role">${c.role}</span>` : ''}<p>${v.text}</p></div>`; }).join('')}</div><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'pick') {
      lastDeltas = [];
      const opts = val(st.options, S), budget = val(st.budget, S), sel = new Set();
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><p class="pick-h" id="pk"></p><div class="opts">${opts.map((o, i) => `<button class="opt pick" data-i="${i}" aria-pressed="false"><div class="opt-t"><span>${o.label}</span><span class="pick-c">${o.cost} ${st.unit || ''}</span></div><div class="opt-d">${val(o.desc, S) || ''}</div></button>`).join('')}</div><div style="text-align:center"><button class="btn" id="go">${st.go || 'Valider ▸'}</button></div></div>`);
      const used = () => [...sel].reduce((a, i) => a + opts[i].cost, 0);
      const upd = () => {
        const u = used();
        document.getElementById('pk').innerHTML = `${st.unitLabel || 'Budget'} : <b>${budget - u}</b> ${st.unit || ''} restant${budget - u > 1 ? 's' : ''} sur ${budget}`;
        app.querySelectorAll('.pick').forEach(b => { const i = +b.dataset.i; b.disabled = !sel.has(i) && opts[i].cost > budget - u; b.setAttribute('aria-pressed', sel.has(i)); });
        document.getElementById('go').disabled = st.min ? sel.size < st.min : false;
      };
      app.querySelectorAll('.pick').forEach(b => b.onclick = () => { const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); upd(); });
      upd();
      document.getElementById('go').onclick = () => {
        const ids = [...sel].sort((x, y) => x - y).map(i => opts[i].id);
        H[st.id] = ids.join(',') || 'aucun';
        const res = st.resolve(S, ids) || {};
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    } else if (st.t === 'qty') {
      lastDeltas = [];
      const mn = val(st.min, S), mx = val(st.max, S), pr = val(st.prompt, S);
      frame(null, `<div class="box"><div class="prompt">${pr}</div>
        <div class="price"><div class="price-v" id="pv"></div><div class="price-m" id="pm"></div></div>
        <input type="range" id="rng" min="${mn}" max="${mx}" step="${st.step || 1}" value="${val(st.def, S)}" aria-label="${pr}">
        <div class="range-l"><span>${st.show(mn)}</span><span>${st.show(mx)}</span></div>
        <div style="text-align:center"><button class="btn" id="go">Valider ▸</button></div></div>`);
      const r = document.getElementById('rng'), upd = () => {
        document.getElementById('pv').textContent = st.show(+r.value);
        document.getElementById('pm').innerHTML = st.info(S, +r.value);
      };
      r.oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        const n = +r.value, res = st.resolve(S, n);
        H[st.id] = res.band || String(n); H[st.id + 'v'] = n;
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    }
    window.scrollTo(0, 0);
  }

  function end(forced) {
    const e = forced ? GAME.endings.find(x => x.id === forced) : GAME.endings.find(x => x.when(S));
    store.add(e.id);
    const deb = GAME.debrief.filter(d => d.act <= maxAct && !(d.finalOnly && forced) && (d.needs || []).every(k => H[k] !== undefined))
      .map(d => `<div class="deb"><h3>${d.title}</h3><p>${d.text(H, S).replace(/ ([:?!;»])/g, N + '$1').replace(/« /g, '«' + N)}</p>${d.chain ? chainHtml(d.chain(H, S), false) : ''}</div>`).join('');
    const found = store.get().length;
    app.innerHTML = `<div class="end" data-ending="${e.id}">
      <div class="end-head"><div class="kicker">Fin de partie</div><h2>${val(e.title, S)}</h2>
        <div class="stamp" style="color:${e.color};border-color:${e.color}">${e.stamp}</div><p class="lead">${val(e.text, S)}</p></div>
      <div class="bilan">${GAME.bilan(S).map(b => `<div><small>${b[0]}</small><b>${b[1]}</b></div>`).join('')}</div>
      ${deb ? `<div class="deb-t">Ce que tu viens de vivre a un nom</div><p class="deb-s">${GAME.debIntro}</p>${deb}` : ''}
      ${forced ? `<p class="deb-s">${GAME.cutText}</p>` : ''}
      <div class="vocab">${GAME.vocab.map(v => `<span>${v}</span>`).join('')}</div>
      <div class="end-btns"><button class="btn" id="again">Rejouer ▸</button><a class="btn ghost" href="${GAME.backLink}">Retour au cours</a></div>
      <p class="found">Fins découvertes${N}: ${found} / ${GAME.endings.length}</p>
    </div><div class="foot">© 2026 Prof 4.0 — Romain Pineau · ${GAME.footer}</div>`;
    document.getElementById('again').onclick = startGame;
    window.scrollTo(0, 0);
  }

  function home() {
    const found = store.get().length;
    app.innerHTML = `<div class="card"><div class="kicker">${GAME.kicker}</div>
      <h1>${GAME.brand}</h1>
      <p class="lead">${GAME.pitch}</p>
      <button class="btn" id="go">Jouer ▸</button>
      <p class="found">${GAME.meta} · ${GAME.endings.length} fins possibles${found ? ` · ${found} découverte${found > 1 ? 's' : ''}` : ''}</p></div>
      <div class="foot">© 2026 Prof 4.0 — Romain Pineau</div>`;
    document.getElementById('go').onclick = startGame;
  }
  home();
})();
</script>
