<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>L'Atelier — Jeu Économie 1ère STMG · PROF 4.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--eco:#4CD97B;--eco-dim:#2A8E4C;--bg:#050806;--panel:#0a120c;--panel2:#0d1710;--line:#173322;--txt:#EEF3EC;--muted:#7C9483;--bad:#FF5C6A;--warn:#FFC64F;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 700px 420px at 15% 0%, rgba(76,217,123,.16), transparent 65%),radial-gradient(ellipse 700px 500px at 90% 100%, rgba(76,217,123,.10), transparent 65%);background-attachment:fixed;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 14px 22px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.brand{font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;}
.brand span{color:var(--eco);}
.act-tag{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--eco);}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px;}
.g{background:var(--panel);border:1px solid var(--line);padding:8px 9px 9px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
.g-l{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g-v{font-family:'Orbitron',sans-serif;font-weight:800;font-size:15px;margin-top:2px;}
.g-b{height:4px;background:#12201a;margin-top:6px;overflow:hidden;}
.g-b i{display:block;height:100%;background:var(--eco);transition:width .6s ease, background .3s;}
.g.low .g-v{color:var(--bad);} .g.low .g-b i{background:var(--bad);}
.deltas{min-height:26px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.d{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:20px;border:1px solid;animation:pop .35s ease;}
.d.up{color:var(--eco);border-color:rgba(76,217,123,.5);background:rgba(76,217,123,.1);}
.d.down{color:var(--bad);border-color:rgba(255,92,106,.5);background:rgba(255,92,106,.1);}
@keyframes pop{from{transform:translateY(6px);opacity:0;}to{transform:none;opacity:1;}}
.stage{border:1px solid var(--line);background:#070c09;margin-bottom:12px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);}
.stage svg{display:block;width:100%;height:auto;}
.box{background:linear-gradient(160deg, rgba(76,217,123,.09), rgba(10,18,12,.96) 55%);border:1px solid color-mix(in srgb, var(--eco) 35%, var(--line));border-left:3px solid var(--eco);padding:16px 16px 18px;animation:pop .3s ease;}
.who{display:inline-block;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:#04160a;padding:3px 10px;margin-bottom:10px;}
.role{font-family:'Rajdhani',sans-serif;font-size:12.5px;color:var(--muted);margin-left:8px;}
.say{font-size:16px;line-height:1.55;}
.prompt{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;line-height:1.3;margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;
  background:var(--eco);color:#04160a;padding:12px 22px;margin-top:14px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .15s, filter .15s;}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
.btn{text-decoration:none;}
.btn.ghost{background:none;color:var(--eco);border:1px solid var(--eco-dim);clip-path:none;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);padding:13px 14px;transition:border-color .15s, transform .15s, background .15s;position:relative;}
.opt:hover:not(:disabled){border-color:var(--eco);transform:translateX(3px);background:#102016;}
.opt:disabled{opacity:.45;cursor:not-allowed;}
.opt-t{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.opt-c{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--warn);white-space:nowrap;}
.opt-d{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:3px;}
.opt-lock{font-size:12px;color:var(--bad);margin-top:5px;font-weight:600;}
.price{text-align:center;padding:6px 0 2px;}
.price-v{font-family:'Orbitron',sans-serif;font-weight:900;font-size:38px;color:var(--eco);line-height:1;}
.price-m{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
.price-m b{color:var(--txt);}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:#12201a;margin:20px 0 4px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;background:var(--eco);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:26px;height:26px;background:var(--eco);border:none;border-radius:4px;cursor:pointer;}
.range-l{display:flex;justify-content:space-between;font-family:'Rajdhani',sans-serif;font-size:12.5px;color:var(--muted);font-weight:600;}
.card{text-align:center;padding:34px 18px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.kicker{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--eco);}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(38px,11vw,64px);line-height:1;margin:12px 0 8px;font-style:italic;}
h1 span{color:var(--eco);}
h2{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(22px,6vw,32px);line-height:1.15;margin:10px 0;}
.lead{color:var(--muted);font-size:15.5px;line-height:1.6;max-width:480px;margin:10px auto 0;}
.found{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;color:var(--muted);margin-top:18px;}
.stamp{display:inline-block;font-family:'Orbitron',sans-serif;font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;border:2px solid;padding:7px 16px;transform:rotate(-4deg);margin:6px 0 4px;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .3s both;}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.2);opacity:0;}to{transform:rotate(-4deg) scale(1);opacity:1;}}
.end{padding:8px 0 20px;}
.end-head{text-align:center;padding:18px 6px 6px;}
.bilan{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0;}
.bilan div{background:var(--panel);border:1px solid var(--line);padding:10px 12px;}
.bilan small{display:block;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.bilan b{font-family:'Orbitron',sans-serif;font-size:18px;}
.deb-t{font-family:'Orbitron',sans-serif;font-weight:800;font-size:17px;margin:26px 0 4px;}
.deb-s{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.5;}
.deb{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--eco);padding:14px 16px;margin-bottom:10px;}
.deb h3{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--eco);margin-bottom:6px;}
.deb p{font-size:15px;line-height:1.6;}
.deb em{font-style:normal;font-weight:600;color:#04160a;background:var(--eco);padding:0 5px;white-space:nowrap;}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.vocab span{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;border:1px solid var(--eco-dim);color:var(--eco);padding:3px 10px;border-radius:20px;}
.end-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px;}
.foot{text-align:center;font-family:'Rajdhani',sans-serif;font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:22px;letter-spacing:.5px;}
@media (max-width:420px){.hud{gap:6px;}.g{padding:7px 7px 8px;}.g-v{font-size:12.5px;}.g-l{font-size:8.8px;letter-spacing:0;}.say{font-size:15px;}.act-tag{font-size:10.5px;letter-spacing:1px;}}
@media (min-width:640px){.stage svg{max-height:290px;}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
.pay{display:grid;grid-template-columns:1fr auto;gap:5px 14px;margin:12px 0 6px;padding:12px 14px;background:#07110c;border:1px solid var(--line);font-size:14.5px;}
.pay b{text-align:right;font-family:'Rajdhani',sans-serif;font-size:16px;}
.pay .tot{border-top:1px solid var(--eco-dim);padding-top:6px;color:var(--eco);font-weight:600;}
.say small{color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONTENU DU JEU — tout ce qui se modifie est ici (textes, chiffres, fins).
   Le moteur (partie 3) n'a pas besoin d'être touché.
   Jauges : treso (€), prod (kg par heure), climat (0-100), rep (0-100).
   ===================================================================== */
const N = ' ';
const eur = n => Math.round(n).toLocaleString('fr-FR') + N + '€';
const VENTES = 10000;
const income = s => 100 * (s.prod - 4);              // encaissement de fin d'acte, selon la productivité

const GAME = {
  title: 'L\'Atelier',
  brand: 'L\'<span>ATELIER</span>',
  storeKey: 'atelierFins',
  backLink: '../../matieres/economie-1ere.html',
  footer: 'Économie 1re STMG, thème 2',
  start: s => Object.assign(s, { treso: 3000, prod: 10, climat: 60, rep: 50, va: 4000, ci: 6000 }),
  hud: [
    { k: 'treso',  label: 'Trésorerie',    short: 'Trésorerie',   show: s => eur(s.treso),          pct: s => s.treso / 60, low: s => s.treso < 600, unit: N + '€' },
    { k: 'prod',   label: 'Productivité',  short: 'Productivité', show: s => s.prod + N + 'kg/h',   pct: s => s.prod * 4,   low: s => s.prod < 14,   unit: N + 'kg/h' },
    { k: 'climat', label: 'Climat social', short: 'Climat',       show: s => Math.round(s.climat),  pct: s => s.climat,     low: s => s.climat < 40, clamp: true },
    { k: 'rep',    label: 'Réputation',    short: 'Réputation',   show: s => Math.round(s.rep),     pct: s => s.rep,        low: s => s.rep < 35,    clamp: true }
  ],
  fail: s => s.treso <= 0 ? 'rideau' : null,          // vérifié à chaque étape, sauf au dernier acte
  lock: (s, cost) => cost >= s.treso ? 'Trésorerie insuffisante.' : null,
  bilan: s => [['Trésorerie', eur(s.treso)], ['Productivité', s.prod + N + 'kg par heure'], ['Climat social', Math.round(s.climat) + ' / 100'], ['Réputation', Math.round(s.rep) + ' / 100']],

  characters: {
    karim:  { name: 'Karim',       role: 'ton oncle, propriétaire', color: '#FF9D3D', body: '#B86A1F', hair: '#1c1c22', acc: 'box' },
    samira: { name: 'Samira',      role: 'ouvrière, 20 ans de maison', color: '#FF8AD1', body: '#B8508F', hair: '#3a2418', acc: 'bun' },
    leo:    { name: 'Léo',         role: 'jeune salarié',           color: '#5B8FFF', body: '#3D62B8', hair: '#5a4630', acc: 'cap' },
    brun:   { name: 'Mme Brun',    role: 'comptable',               color: '#B9A6FF', body: '#5b4c9a', hair: '#8a8f96', acc: 'clip' },
    sacha:  { name: 'Sacha Morel', role: 'acheteur chez TeaMax',    color: '#FF5C7A', body: '#3a3f4a', hair: '#5a4630', acc: 'tie' },
    roche:  { name: 'Mme Roche',   role: 'adjointe à la mairie',    color: '#FFC64F', body: '#3a3f4a', hair: '#7a2f2f', acc: 'tie' },
    faure:  { name: 'M. Faure',    role: 'contrôleur de l\'Urssaf', color: '#5FB8B0', body: '#2f5b57', hair: '#1c1c22', acc: 'clip' },
    narr:   { name: 'L\'Atelier',  role: '',                        color: '#4CD97B' }
  },

  acts: [
  /* ------------------------------ ACTE 1 ------------------------------ */
  { num: 1, title: 'Produire', sub: 'Trois salariés, une vieille marmite, et une commande géante.',
    steps: [
      { t: 'say', who: 'karim', text: `Nour, ma nièce préférée${N}! Je pars un an au pays. L'atelier, c'est toi maintenant. Samira et Léo connaissent le métier. Toi, tu décides.` },
      { t: 'say', who: 'sacha', text: `Bonjour. TeaMax ouvre trois boutiques. Il me faut le double de perles de tapioca, chaque semaine, dès le mois prochain. Vous pouvez suivre${N}? Sinon, je vais voir ailleurs.` },
      { t: 'say', who: 'samira', text: `Le double${N}? À trois, avec la marmite, on sort 10${N}kg à l'heure. Soit on est plus nombreux, soit on s'équipe, soit on y passe nos soirées. À toi de voir.` },
      { t: 'choice', id: 'moyen', prompt: `Comment produire deux fois plus${N}?`, options: [
        { id: 'interim', label: 'Embaucher deux intérimaires', cost: 1200, desc: 'Plus de bras autour de la marmite.', fx: { treso: -1200, climat: 5 },
          after: [{ who: 'samira', text: `À cinq, on tient la cadence. Mais chacun sort toujours autant qu'avant${N}: on est juste plus nombreux.` }] },
        { id: 'machine', label: 'Acheter une machine à rouler les perles', cost: 2500, desc: 'Elle roule en une heure ce qu\'une personne fait en une matinée.', fx: { treso: -2500, prod: 8, climat: -5 }, set: { machine: true },
          after: [{ who: 'leo', text: `Elle est énorme. Et rapide. Dis… elle fait mon travail, là. Tu comptes me garder${N}?` }] },
        { id: 'hsup', label: 'Demander des heures supplémentaires', cost: 600, desc: 'La même équipe, plus longtemps.', fx: { treso: -600, climat: -12, prod: -1 },
          after: [{ who: 'samira', text: `Onze heures debout. À 20${N}h, on rate une perle sur trois. On produit plus… mais chaque heure rend moins.` }] } ] },
      { t: 'say', if: s => s.flags.machine, who: 'samira', text: `Ta machine, personne ne sait la régler. Le vendeur propose une formation de trois jours. Sinon, il y a la notice. En allemand.` },
      { t: 'say', if: s => !s.flags.machine, who: 'samira', text: `Léo roule deux fois moins vite que moi. Si tu me libères trois jours, je lui apprends mes gestes. Vingt ans de métier, ça se transmet.` },
      { t: 'choice', id: 'formation', prompt: s => s.flags.machine ? `Former Samira à la machine${N}?` : `Former Léo au savoir-faire de Samira${N}?`, options: [
        { id: 'oui', label: 'Oui, on forme', cost: 400, desc: 'Trois jours sans produire, payés.', fx: { treso: -400, prod: 4, climat: 8 }, set: { forme: true },
          after: s => s.flags.machine ? [{ who: 'samira', text: `Maintenant je la règle les yeux fermés. Elle tourne à plein régime. La machine sans moi, c'était de la ferraille. Moi sans elle, c'était lent.` }]
                                      : [{ who: 'leo', text: `Elle m'a montré le coup de poignet. Je roule presque aussi vite qu'elle maintenant. Ça, aucune machine ne me l'aurait appris.` }] },
        { id: 'non', label: 'Non, on se débrouille', desc: 'Pas le temps, pas l\'argent.', fx: s => s.flags.machine ? { prod: -3, treso: -300 } : {},
          after: s => s.flags.machine ? [{ who: 'leo', text: `Elle est encore en panne. Troisième fois cette semaine. On a perdu 300${N}€ de pâte.` }]
                                      : [{ who: 'samira', text: `Comme tu veux. Mais le jour où je pars à la retraite, mon savoir-faire part avec moi.` }] } ] },
      { t: 'event', who: 'sacha', text: s => `Première livraison reçue. ${s.prod >= 18 ? 'Dans les temps, et même en avance.' : s.prod >= 13 ? 'Tout juste dans les temps.' : 'En retard, mais on fera avec.'} Voici votre paiement.`, fx: s => ({ treso: income(s) }) },
      { t: 'say', who: 'leo', text: `J'ai une idée. On perd un temps fou à se croiser et à chercher les bons de commande. Si on range les postes dans l'ordre et qu'on suit les commandes sur un logiciel, on gagne des heures. Ça coûte 200${N}€.` },
      { t: 'choice', id: 'orga', prompt: `L'idée de Léo${N}?`, options: [
        { id: 'oui', label: 'On réorganise', cost: 200, desc: 'Les postes en ligne, les commandes sur écran.', fx: { treso: -200, prod: 3 }, set: { orga: true },
          after: [{ who: 'samira', text: `Je n'y croyais pas. Mais on sait enfin qui a commandé quoi, et on ne se marche plus dessus. Mêmes bras, même matériel, et on sort plus.` }] },
        { id: 'non', label: 'On garde nos habitudes', desc: 'Ça marche depuis vingt ans.', fx: { climat: 2 },
          after: [{ who: 'leo', text: `OK… C'était juste une idée.` }] } ] }
    ] },

  /* ------------------------------ ACTE 2 ------------------------------ */
  { num: 2, title: 'Mesurer', sub: 'Qu\'est-ce que l\'atelier a vraiment créé ?',
    steps: [
      { t: 'say', who: 'karim', text: `Nour${N}! Je viens de voir le relevé${N}: 10${N}000${N}€ de ventes ce mois-ci${N}! On est riches${N}! Distribue, fais-toi plaisir, augmente tout le monde${N}!` },
      { t: 'say', who: 'brun', text: `Avant de distribuer quoi que ce soit, regardez la pile à gauche. Manioc${N}: 3${N}500${N}€. Électricité et gaz${N}: 1${N}500${N}€. Emballages${N}: 1${N}000${N}€. Tout ça, vous l'avez acheté à d'autres pour pouvoir produire.` },
      { t: 'qty', id: 'enveloppe', prompt: 'Quelle somme peux-tu partager ce mois-ci ?', min: 2000, max: 10000, step: 500, def: 7000,
        show: n => eur(n),
        info: (s, n) => `Ventes du mois${N}: <b>${eur(VENTES)}</b><br>Factures des fournisseurs à régler${N}: <b>${eur(s.ci)}</b>`,
        resolve: (s, n) => n > s.va + 500
          ? { band: 'trop', fx: { treso: -Math.round((n - s.va) * 0.3) }, after: [
              { who: 'brun', text: `Vous avez partagé ${eur(n)}. Mais ${eur(s.ci)} appartenaient déjà à vos fournisseurs. Le marchand de manioc a appelé trois fois. J'ai dû puiser dans la réserve pour le payer.` },
              { who: 'brun', text: `Ce que l'atelier a vraiment créé, c'est ${eur(VENTES)} de ventes moins ${eur(s.ci)} d'achats${N}: ${eur(s.va)}. Pas un euro de plus.` }] }
          : n < s.va - 500
          ? { band: 'peu', fx: { climat: -5 }, after: [
              { who: 'leo', text: `On a doublé la production et il n'y a presque rien à partager${N}? Sérieusement${N}?` },
              { who: 'brun', text: `Vous avez été trop prudente. Une fois les fournisseurs payés, il restait ${eur(s.va)} créés par l'atelier.` }] }
          : { band: 'juste', fx: { climat: 3 }, after: [
              { who: 'brun', text: `${eur(VENTES)} de ventes, moins ${eur(s.ci)} achetés à d'autres${N}: il reste ${eur(s.va)}. Vous avez visé juste${N}: voilà ce que l'atelier a réellement créé.` }] } },
      { t: 'say', who: 'brun', text: `Une piste pour créer davantage${N}: le manioc standard coûte 800${N}€ de moins par mois que le premium. Les perles sont un peu moins fermes.` },
      { t: 'choice', id: 'manioc', prompt: `Quel manioc${N}?`, options: [
        { id: 'premium', label: 'Garder le manioc premium', desc: 'La recette qui a fait la réputation de Karim.',
          after: [{ who: 'samira', text: `Tant mieux. Avec du bon manioc, je fais des bonnes perles.` }] },
        { id: 'standard', label: 'Passer au manioc standard', desc: '800 € d\'achats en moins chaque mois.', fx: { rep: -10 }, do: s => { s.ci -= 800; s.va += 800; },
          after: [{ who: 'sacha', text: `Vos perles ont changé, non${N}? Mes clients l'ont remarqué. Moi aussi.` }] } ] },
      /* --- scène PIB / IDH --- */
      { t: 'say', who: 'roche', text: s => `Bonjour${N}! Je prépare le bilan économique du quartier. J'additionne ce que chaque entreprise a créé cette année${N}: TeaMax 310${N}000${N}€, Boba Factory 240${N}000${N}€, les commerces de la rue 150${N}000${N}€… et votre atelier, ${eur(s.va * 12)}.` },
      { t: 'say', who: 'roche', text: s => `Total${N}: ${eur(700000 + s.va * 12)}. C'est la richesse produite par le quartier, 6${N}% de plus que l'an dernier. Et je retombe sur le même chiffre en additionnant les revenus des habitants, ou leurs dépenses. Divisé par 2${N}000 habitants${N}: ${eur((700000 + s.va * 12) / 2000)} chacun.` },

      <rect x="-25" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(8 -20 -50)"/>
      <rect x="-18" y="-56" width="36" height="40" rx="12" fill="${c.body}"/>
      <rect x="15" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(-18 20 -50)"/>
      <circle cx="0" cy="-70" r="15" fill="#E8B58A"/>
      <path d="M-15,-72 Q-14,-88 0,-87 Q15,-88 15,-72 Q8,-80 -15,-72 Z" fill="${c.hair}"/>
      <circle cx="4" cy="-70" r="1.8" fill="#151515"/><circle cx="11" cy="-70" r="1.8" fill="#151515"/>
      <path d="M4,-63 Q8,-60 12,-63" stroke="#151515" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      ${acc}
      <path d="M12,-82 Q19,-70 12,-58 M17,-52 Q21,-36 17,-20" stroke="${c.color}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    </g>`;
  }

  function hud() {
    return `<div class="hud">${GAME.hud.map(g => `<div class="g${g.low(S) ? ' low' : ''}"><div class="g-l" title="${g.label}">${g.short}</div><div class="g-v">${g.show(S)}</div><div class="g-b"><i style="width:${clamp(g.pct(S), 0, 100)}%"></i></div></div>`).join('')}</div>
      <div class="deltas" aria-live="polite">${lastDeltas.map(d => `<span class="d ${d.v > 0 ? 'up' : 'down'}">${d.t}</span>`).join('')}</div>`;
  }
  function frame(who, inner) {
    app.innerHTML = `<div class="topbar"><div class="brand">${GAME.brand}</div><div class="act-tag">Acte ${act.num} · ${act.title}</div></div>
      ${hud()}<div class="stage">${GAME.scene(S, act)}${character(who)}</svg></div>${inner}`;
  }
  function whoTag(id) {
    const c = GAME.characters[id] || GAME.characters.narr;
    return `<span class="who" style="background:${c.color}">${c.name}</span>${c.role ? `<span class="role">${c.role}</span>` : ''}`;
  }
  function applyFx(fx) {
    lastDeltas = [];
    if (!fx) return;
    for (const k in fx) {
      const v = fx[k]; if (!v) continue;
      S[k] += v;
      const g = HUD[k];
      if (g && g.clamp) S[k] = clamp(S[k], 0, 100);
      if (g) lastDeltas.push({ v, t: `${g.label} ${v > 0 ? '+' : '−'}${Math.abs(v).toLocaleString('fr-FR')}${g.unit || ''}` });
    }
  }
  function pushAfter(lines) {
    queue.unshift(...(lines || []).map(l => ({ t: 'say', who: l.who, text: l.text, _after: true })));
  }

  function startGame() {
    S = { flags: {} }; GAME.start(S);
    H = {}; lastDeltas = []; maxAct = 0;
    startAct(0);
  }
  function startAct(i) {
    act = GAME.acts[i]; maxAct = Math.max(maxAct, act.num); lastDeltas = [];
    queue = act.steps.slice();
    app.innerHTML = `<div class="card"><div class="kicker">Acte ${act.num}</div><h2>${act.title}</h2><p class="lead">${act.sub}</p><button class="btn" id="go">Continuer ▸</button></div>`;
    document.getElementById('go').onclick = next;
    window.scrollTo(0, 0);
  }
  function next() {
    const f = !act.final && GAME.fail(S);
    if (f && !(queue[0] && queue[0]._after)) return end(f);
    let st;
    while ((st = queue.shift())) { if (!st.if || st.if(S)) break; }
    if (!st) {
      const i = GAME.acts.indexOf(act);
      return i + 1 < GAME.acts.length ? startAct(i + 1) : end();
    }
    if (st.t === 'say' || st.t === 'event') {
      let text;
      if (st.t === 'event') { if (st.do) st.do(S); text = val(st.text, S); applyFx(val(st.fx, S)); if (st.set) Object.assign(S.flags, st.set); }
      else { if (!st._after) lastDeltas = []; text = val(st.text, S); }
      frame(st.who, `<div class="box">${whoTag(st.who)}<p class="say">${text}</p><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'choice') {
      lastDeltas = [];
      const options = st.options;
      const html = options.map((o, i) => {
        let lock = o.lock ? o.lock(S) : null;
        if (!lock && o.cost) lock = GAME.lock(S, o.cost);
        return `<button class="opt" data-i="${i}" ${lock ? 'disabled' : ''}><div class="opt-t"><span>${o.label}</span>${o.cost ? `<span class="opt-c">− ${o.cost.toLocaleString('fr-FR')}${N}€</span>` : ''}</div><div class="opt-d">${val(o.desc, S) || ''}</div>${lock ? `<div class="opt-lock">${lock}</div>` : ''}</button>`;
      }).join('');
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><div class="opts">${html}</div></div>`);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = options[+b.dataset.i];
        H[st.id] = o.id;
        if (o.set) Object.assign(S.flags, o.set);
        const fx = val(o.fx, S);
        if (o.do) o.do(S);
        applyFx(fx);
        pushAfter(val(o.after, S)); next();
      });
    } else if (st.t === 'qty') {
      lastDeltas = [];
      frame(null, `<div class="box"><div class="prompt">${st.prompt}</div>
        <div class="price"><div class="price-v" id="pv"></div><div class="price-m" id="pm"></div></div>
        <input type="range" id="rng" min="${st.min}" max="${st.max}" step="${st.step || 1}" value="${st.def}" aria-label="${st.prompt}">
        <div class="range-l"><span>${st.show(st.min)}</span><span>${st.show(st.max)}</span></div>
        <div style="text-align:center"><button class="btn" id="go">Valider ▸</button></div></div>`);
      const r = document.getElementById('rng'), upd = () => {
        document.getElementById('pv').textContent = st.show(+r.value);
        document.getElementById('pm').innerHTML = st.info(S, +r.value);
      };
      r.oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        const n = +r.value, res = st.resolve(S, n);
        H[st.id] = res.band || String(n); H[st.id + 'v'] = n;
        if (res.do) res.do(S);
        applyFx(res.fx); pushAfter(res.after); next();
      };
    }
    window.scrollTo(0, 0);
  }

  function end(forced) {
    const e = forced ? GAME.endings.find(x => x.id === forced) : GAME.endings.find(x => x.when(S));
    store.add(e.id);
    const deb = GAME.debrief.filter(d => d.act <= maxAct && !(d.finalOnly && forced) && (d.needs || []).every(k => H[k] !== undefined))
      .map(d => `<div class="deb"><h3>${d.title}</h3><p>${d.text(H, S).replace(/ ([:?!;»])/g, N + '$1').replace(/« /g, '«' + N)}</p></div>`).join('');
    const found = store.get().length;
    app.innerHTML = `<div class="end" data-ending="${e.id}">
      <div class="end-head"><div class="kicker">Fin de partie</div><h2>${e.title}</h2>
        <div class="stamp" style="color:${e.color};border-color:${e.color}">${e.stamp}</div><p class="lead">${val(e.text, S)}</p></div>
      <div class="bilan">${GAME.bilan(S).map(b => `<div><small>${b[0]}</small><b>${b[1]}</b></div>`).join('')}</div>
      ${deb ? `<div class="deb-t">Ce que tu viens de vivre a un nom</div><p class="deb-s">Tu as utilisé ces notions pour diriger. Voici comment on les appelle en économie.</p>${deb}` : ''}
      ${forced ? `<p class="deb-s">Ta partie s'est arrêtée à l'acte ${maxAct}. Rejoue pour aller au bout de l'année.</p>` : ''}
      <div class="vocab">${GAME.vocab.map(v => `<span>${v}</span>`).join('')}</div>
      <div class="end-btns"><button class="btn" id="again">Rejouer ▸</button><a class="btn ghost" href="${GAME.backLink}">Retour au cours</a></div>
      <p class="found">Fins découvertes${N}: ${found} / ${GAME.endings.length}</p>
    </div><div class="foot">© 2026 Prof 4.0 — Romain Pineau · ${GAME.footer}</div>`;
    document.getElementById('again').onclick = startGame;
    window.scrollTo(0, 0);
  }

  function home() {
    const found = store.get().length;
    app.innerHTML = `<div class="card"><div class="kicker">Économie · 1re STMG · Thème 2</div>
      <h1>${GAME.brand.toUpperCase().replace('<SPAN>', '<span>').replace('</SPAN>', '</span>')}</h1>
      <p class="lead">Ton oncle Karim te confie son atelier de perles de tapioca pour un an. Trois salariés, une vieille marmite, et un client qui veut le double. Produire, compter, partager${N}: tout repose sur toi.</p>
      <button class="btn" id="go">Jouer ▸</button>
      <p class="found">4 actes · 15 minutes · ${GAME.endings.length} fins possibles${found ? ` · ${found} découverte${found > 1 ? 's' : ''}` : ''}</p></div>
      <div class="foot">© 2026 Prof 4.0 — Romain Pineau</div>`;
    document.getElementById('go').onclick = startGame;
  }
  home();
})();
</script>
</body>
</html>
