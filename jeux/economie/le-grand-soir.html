<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Grand Soir — Jeu Économie 1ère STMG · PROF 4.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--eco:#4CD97B;--eco-dim:#2A8E4C;--bg:#050806;--panel:#0a120c;--panel2:#0d1710;--line:#173322;--txt:#EEF3EC;--muted:#7C9483;--bad:#FF5C6A;--warn:#FFC64F;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 700px 420px at 15% 0%, rgba(76,217,123,.16), transparent 65%),radial-gradient(ellipse 700px 500px at 90% 100%, rgba(76,217,123,.10), transparent 65%);background-attachment:fixed;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 14px 22px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.brand{font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;}
.brand span{color:var(--eco);}
.act-tag{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--eco);}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px;}
.g{background:var(--panel);border:1px solid var(--line);padding:8px 9px 9px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
.g-l{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g-v{font-family:'Orbitron',sans-serif;font-weight:800;font-size:15px;margin-top:2px;}
.g-b{height:4px;background:#12201a;margin-top:6px;overflow:hidden;}
.g-b i{display:block;height:100%;background:var(--eco);transition:width .6s ease, background .3s;}
.g.low .g-v{color:var(--bad);} .g.low .g-b i{background:var(--bad);}
.deltas{min-height:26px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.d{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:20px;border:1px solid;animation:pop .35s ease;}
.d.up{color:var(--eco);border-color:rgba(76,217,123,.5);background:rgba(76,217,123,.1);}
.d.down{color:var(--bad);border-color:rgba(255,92,106,.5);background:rgba(255,92,106,.1);}
@keyframes pop{from{transform:translateY(6px);opacity:0;}to{transform:none;opacity:1;}}
.stage{border:1px solid var(--line);background:#070c09;margin-bottom:12px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);}
.stage svg{display:block;width:100%;height:auto;}
.box{background:linear-gradient(160deg, rgba(76,217,123,.09), rgba(10,18,12,.96) 55%);border:1px solid color-mix(in srgb, var(--eco) 35%, var(--line));border-left:3px solid var(--eco);padding:16px 16px 18px;animation:pop .3s ease;}
.who{display:inline-block;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:#04160a;padding:3px 10px;margin-bottom:10px;}
.role{font-family:'Rajdhani',sans-serif;font-size:12.5px;color:var(--muted);margin-left:8px;}
.say{font-size:16px;line-height:1.55;}
.prompt{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;line-height:1.3;margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;
  background:var(--eco);color:#04160a;padding:12px 22px;margin-top:14px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .15s, filter .15s;}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
.btn{text-decoration:none;}
.btn.ghost{background:none;color:var(--eco);border:1px solid var(--eco-dim);clip-path:none;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);padding:13px 14px;transition:border-color .15s, transform .15s, background .15s;position:relative;}
.opt:hover:not(:disabled){border-color:var(--eco);transform:translateX(3px);background:#102016;}
.opt:disabled{opacity:.45;cursor:not-allowed;}
.opt-t{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.opt-c{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--warn);white-space:nowrap;}
.opt-d{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:3px;}
.opt-lock{font-size:12px;color:var(--bad);margin-top:5px;font-weight:600;}
.price{text-align:center;padding:6px 0 2px;}
.price-v{font-family:'Orbitron',sans-serif;font-weight:900;font-size:38px;color:var(--eco);line-height:1;}
.price-m{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
.price-m b{color:var(--txt);}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:#12201a;margin:20px 0 4px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;background:var(--eco);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:26px;height:26px;background:var(--eco);border:none;border-radius:4px;cursor:pointer;}
.range-l{display:flex;justify-content:space-between;font-family:'Rajdhani',sans-serif;font-size:12.5px;color:var(--muted);font-weight:600;}
.card{text-align:center;padding:34px 18px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.kicker{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--eco);}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(38px,11vw,64px);line-height:1;margin:12px 0 8px;font-style:italic;}
h1 span{color:var(--eco);}
h2{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(22px,6vw,32px);line-height:1.15;margin:10px 0;}
.lead{color:var(--muted);font-size:15.5px;line-height:1.6;max-width:480px;margin:10px auto 0;}
.found{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;color:var(--muted);margin-top:18px;}
.stamp{display:inline-block;font-family:'Orbitron',sans-serif;font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;border:2px solid;padding:7px 16px;transform:rotate(-4deg);margin:6px 0 4px;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .3s both;}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.2);opacity:0;}to{transform:rotate(-4deg) scale(1);opacity:1;}}
.end{padding:8px 0 20px;}
.end-head{text-align:center;padding:18px 6px 6px;}
.bilan{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0;}
.bilan div{background:var(--panel);border:1px solid var(--line);padding:10px 12px;}
.bilan small{display:block;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.bilan b{font-family:'Orbitron',sans-serif;font-size:18px;}
.deb-t{font-family:'Orbitron',sans-serif;font-weight:800;font-size:17px;margin:26px 0 4px;}
.deb-s{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.5;}
.deb{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--eco);padding:14px 16px;margin-bottom:10px;}
.deb h3{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--eco);margin-bottom:6px;}
.deb p{font-size:15px;line-height:1.6;}
.deb em{font-style:normal;font-weight:600;color:#04160a;background:var(--eco);padding:0 5px;white-space:nowrap;}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.vocab span{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;border:1px solid var(--eco-dim);color:var(--eco);padding:3px 10px;border-radius:20px;}
.end-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px;}
.foot{text-align:center;font-family:'Rajdhani',sans-serif;font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:22px;letter-spacing:.5px;}
@media (max-width:420px){.hud{gap:6px;}.g{padding:7px 7px 8px;}.g-v{font-size:12.5px;}.g-l{font-size:8.8px;letter-spacing:0;}.say{font-size:15px;}.act-tag{font-size:10.5px;letter-spacing:1px;}}
@media (min-width:640px){.stage svg{max-height:290px;}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONTENU DU JEU — tout ce qui se modifie est ici (textes, chiffres, fins).
   Le moteur (partie 2) n'a pas besoin d'être touché.
   Jauges : budget (€), jours, amb (ambiance 0-100), conf (confiance 0-100).
   ===================================================================== */
const N = ' ';
const COCKTAIL_COSTS = [10, 12, 16, 24, 34, 48];   // coût de chaque bac supplémentaire
const COCKTAIL_PRICE = 30;                           // recette par bac vendu
const CREPE_COST = 40, CREPE_AMB = [12, 7, 3, 1];    // ambiance ajoutée par chaque stand
const sum = (a, n) => a.slice(0, n).reduce((x, y) => x + y, 0);

const GAME = {
  title: 'Le Grand Soir',
  storeKey: 'grandSoirFins',
  backLink: '../../matieres/economie-1ere.html',
  overdraft: 150,                                    // découvert maximum toléré avant annulation
  start: s => Object.assign(s, { budget: 500, jours: 15, amb: 30, conf: 50, cap: 300, stands: 0, bacs: 0,
    pref: Math.random() < 0.5 ? 'dj' : 'ft',         // ce que les élèves veulent vraiment (révélé par le sondage)
    rain: Math.random() < 0.4 }),

  characters: {
    okafor:  { name: 'Mme Okafor', role: 'proviseure',            color: '#B9A6FF', body: '#5b4c9a', hair: '#1c1c22', acc: 'clip' },
    sofiane: { name: 'Sofiane',    role: 'ton binôme au CVL',     color: '#4CD97B', body: '#2A8E4C', hair: '#1c1c22', acc: '' },
    tom:     { name: 'Tom',        role: 'élève de Terminale',    color: '#5B8FFF', body: '#3D62B8', hair: '#5a4630', acc: 'cap' },
    roche:   { name: 'Mme Roche',  role: 'adjointe à la mairie',  color: '#FF5C7A', body: '#3a3f4a', hair: '#7a2f2f', acc: 'tie' },
    lin:     { name: 'Mamie Lin',  role: 'stand de bubble tea',   color: '#FFC64F', body: '#B8862B', hair: '#D8DCE0', acc: 'bun' },
    yanis:   { name: 'Yanis',      role: 'snack de la rue',       color: '#FF9D3D', body: '#B86A1F', hair: '#1c1c22', acc: 'box' },
    vasseur: { name: 'M. Vasseur', role: 'banquier du foyer',     color: '#5FB8B0', body: '#2f5b57', hair: '#8a8f96', acc: 'tie' },
    narr:    { name: 'Le Grand Soir', role: '',                   color: '#4CD97B' }
  },

  acts: [
  /* ------------------------------ ACTE 1 ------------------------------ */
  { num: 1, title: 'On ne peut pas tout avoir', sub: 'Une boîte à idées qui déborde, 500 € et 15 jours.',
    steps: [
      { t: 'say', who: 'okafor', text: `Inès, le conseil de la vie lycéenne vous a choisie${N}: la fête de fin d'année, c'est vous. Vous avez 500${N}€ sur le compte du foyer et 15 jours. Pas un de plus.` },
      { t: 'say', who: 'sofiane', text: `J'ai vidé la boîte à idées. Accroche-toi${N}: un DJ, un food truck, un photobooth, un feu d'artifice, un château gonflable… et quelqu'un a écrit «${N}Beyoncé${N}».` },
      { t: 'say', who: 'sofiane', text: `Ils veulent tout. On a 500${N}€. Avant de choisir, on pourrait leur demander ce qu'ils veulent VRAIMENT. Mais un sondage dans toutes les classes, c'est deux jours de perdus.` },
      { t: 'choice', id: 'sondage', prompt: `Faire un sondage${N}?`, options: [
        { id: 'oui', label: 'Oui, on sonde tout le lycée', desc: 'Deux jours de travail, mais on saura.', fx: { jours: -2 }, set: { sondage: true },
          after: s => [{ who: 'sofiane', text: `J'ai les résultats. ${s.pref === 'dj' ? `64${N}% veulent avant tout DANSER. Manger, ça vient loin derrière.` : `61${N}% veulent avant tout bien MANGER, et pas des chips. La musique, ils s'en fichent un peu.`} Et ils seront nombreux${N}: plus de 200 comptent venir.` }] },
        { id: 'non', label: 'Non, on décide au feeling', desc: 'On connaît les élèves, non ?',
          after: [{ who: 'sofiane', text: `OK. On verra bien si on a vu juste.` }] } ] },
      { t: 'say', who: 'sofiane', text: `Maintenant, le lieu. La cour est grande mais à ciel ouvert. La mairie peut prêter le gymnase, plus petit, s'il y a un dossier. Ou alors on loue la salle des fêtes.` },
      { t: 'choice', id: 'lieu', prompt: `Où aura lieu la fête${N}?`, options: [
        { id: 'cour', label: 'La cour du lycée', desc: s => `300 places, gratuit, en plein air.${s.flags.sondage ? ' (Sondage : plus de 200 élèves prévus.)' : ''}`, do: s => { s.cap = 300; },
          after: [{ who: 'okafor', text: `La cour, très bien. Vous avez regardé la météo${N}? Moi non plus.` }] },
        { id: 'gym', label: 'Le gymnase, prêté par la mairie', desc: s => `150 places, gratuit, à l'abri. Un jour pour monter le dossier.${s.flags.sondage ? ' (Sondage : plus de 200 élèves prévus.)' : ''}`, fx: { jours: -1 }, do: s => { s.cap = 150; },
          after: [{ who: 'roche', text: `La commune vous prête le gymnase gratuitement${N}: c'est notre rôle, et ce sont les impôts de tous qui le financent. Rendez-le propre.` }] },
        { id: 'salle', label: 'La salle des fêtes, en location', cost: 200, desc: '250 places, à l\'abri, sono intégrée dans le prix… non, pas la sono.', fx: { budget: -200 }, do: s => { s.cap = 250; },
          after: [{ who: 'narr', text: `Le gérant encaisse les 200${N}€ et te tend les clés. Lui, il vit de ça${N}: il loue sa salle.` }] } ] },
      { t: 'say', who: 'sofiane', text: `Pour le goûter d'accueil, deux pistes${N}: l'association des parents d'élèves propose de faire des gâteaux, gratuitement. Ou Yanis, le snack de la rue, nous fait un buffet.` },
      { t: 'choice', id: 'gouter', prompt: `Le goûter d'accueil${N}?`, options: [
        { id: 'parents', label: 'Les gâteaux des parents d\'élèves', desc: 'Bénévoles, gratuits, faits maison.', fx: { amb: 5 },
          after: [{ who: 'narr', text: `Douze gâteaux arrivent le jour J. L'association ne demande rien${N}: elle n'est pas là pour gagner de l'argent.` }] },
        { id: 'yanis', label: 'Le buffet de Yanis', cost: 80, desc: 'Mini-burgers et beignets, livrés.', fx: { budget: -80, amb: 8 },
          after: [{ who: 'yanis', text: `80${N}€ et vous avez le meilleur buffet du quartier. C'est mon métier${N}: je vends, vous payez, tout le monde est content.` }] } ] },
      { t: 'event', who: 'narr', text: `Les cours, un contrôle de maths, un exposé… trois jours filent sans que tu touches à la fête.`, fx: { jours: -3 } }
    ] },

  /* ------------------------------ ACTE 2 ------------------------------ */
  { num: 2, title: 'Choisir, c\'est renoncer', sub: 'Chaque euro dépensé ici ne le sera pas ailleurs.',
    steps: [
      { t: 'say', who: 'sofiane', text: `Le gros morceau${N}: la tête d'affiche. Un DJ pro, c'est 250${N}€. Un food truck privatisé, c'est 250${N}€ aussi. On n'aura jamais les deux.` },
      { t: 'choice', id: 'tete', prompt: `Ta tête d'affiche${N}?`, options: [
        { id: 'dj', label: 'Le DJ pro', cost: 250, desc: s => `Lumières, platines, piste de danse.${s.flags.sondage ? (s.pref === 'dj' ? ` (Sondage : 64${N}% veulent danser.)` : ` (Sondage : 61${N}% veulent surtout bien manger.)`) : ''}`,
          fx: s => ({ budget: -250, amb: s.pref === 'dj' ? 25 : 12 }),
          after: s => s.pref === 'dj' ? [{ who: 'tom', text: `Un vrai DJ${N}?! Tout le lycée ne parle que de ça.` }] : [{ who: 'tom', text: `Un DJ, cool… Mais franchement, on espérait surtout bien manger, pour une fois.` }] },
        { id: 'ft', label: 'Le food truck', cost: 250, desc: s => `Burgers, frites, options végé pour tous.${s.flags.sondage ? (s.pref === 'ft' ? ` (Sondage : 61${N}% veulent surtout bien manger.)` : ` (Sondage : 64${N}% veulent danser.)`) : ''}`,
          fx: s => ({ budget: -250, amb: s.pref === 'ft' ? 25 : 12, conf: 5 }),
          after: s => s.pref === 'ft' ? [{ who: 'tom', text: `Un food truck rien que pour nous${N}? Là, tu régales. Tout le monde vient.` }] : [{ who: 'tom', text: `Un food truck, sympa… Mais une fête sans vraie musique, c'est une cantine améliorée, non${N}?` }] },
        { id: 'playlist', label: 'Ni l\'un ni l\'autre : playlist maison', desc: 'Tu gardes tes 250 € pour le reste.', fx: { amb: 5 },
          after: [{ who: 'tom', text: `Une playlist… OK. Ça fera l'affaire. J'imagine.` }] } ] },
      { t: 'say', who: 'sofiane', text: `Les stands de crêpes, maintenant. On peut louer des crêpières${N}: 40${N}€ le stand, les parents fournissent la pâte. Tu en veux combien${N}?` },
      { t: 'qty', id: 'crepes', prompt: 'Combien de stands de crêpes ?', min: 0, max: 4, def: 1,
        show: n => n + (n > 1 ? ' stands' : ' stand'),
        info: (s, n) => `Coût${N}: <b>${n * CREPE_COST}${N}€</b> · Budget après achat${N}: <b>${s.budget - n * CREPE_COST}${N}€</b>${s.flags.sondage ? '<br>Sondage : « un ou deux stands, ce serait déjà top ».' : ''}`,
        resolve: (s, n) => ({ fx: { budget: -n * CREPE_COST, amb: sum(CREPE_AMB, n) }, do: st => { st.stands = n; },
          after: n === 0 ? [{ who: 'tom', text: `Pas de crêpes${N}? À une fête de lycée${N}? Audacieux.` }]
               : n === 1 ? [{ who: 'tom', text: `Des crêpes${N}! Enfin une bonne nouvelle. J'espère qu'il n'y aura pas trop la queue.` }]
               : n === 2 ? [{ who: 'tom', text: `Deux stands, parfait${N}: des crêpes et pas d'attente.` }]
               : [{ who: 'sofiane', text: `${n} stands… Le premier a fait plaisir à tout le monde. Le deuxième, un peu. Les suivants${N}? Personne n'a vraiment vu la différence. Et ça nous a coûté ${(n) * CREPE_COST}${N}€.` }] }) },
      { t: 'say', who: 'lin', text: `Petite, j'ai une idée pour remplir ta caisse${N}: un bar à cocktails sans alcool. Je te montre la recette. Chaque bac se vend 30${N}€ au total.` },
      { t: 'say', who: 'lin', text: `Mais attention. Le premier bac, tu le fais seule en dix minutes${N}: 10${N}€ de fruits. Plus tu en fais, plus ça se complique${N}: il faut un deuxième blender, des bras en plus, des fruits achetés au prix fort. Chaque bac coûte plus cher que le précédent.` },
      { t: 'qty', id: 'bacs', prompt: 'Combien de bacs de cocktails préparer ?', min: 1, max: 6, def: 2,
        show: n => n + (n > 1 ? ' bacs' : ' bac'),
        info: (s, n) => `Le ${n === 1 ? '1er' : n + 'e'} bac coûte <b>${COCKTAIL_COSTS[n - 1]}${N}€</b> à préparer · il se vend <b>${COCKTAIL_PRICE}${N}€</b><br>Coût total${N}: <b>${sum(COCKTAIL_COSTS, n)}${N}€</b>`,
        resolve: (s, n) => ({ fx: { budget: -sum(COCKTAIL_COSTS, n) }, do: st => { st.bacs = n; },
          after: [{ who: 'lin', text: n <= 3 ? `${n} bac${n > 1 ? 's' : ''}. Prudent. Tu aurais peut-être pu en faire un de plus${N}: il rapportait encore plus qu'il ne coûtait.`
                : n === 4 ? `Quatre bacs. Tu t'es arrêtée pile au bon moment${N}: le suivant t'aurait coûté plus qu'il ne rapporte.`
                : `${n} bacs… Regarde bien tes derniers${N}: ils coûtent plus de 30${N}€ à préparer et se vendent 30${N}€. Tu travailles pour perdre de l'argent.` }] }) },
      { t: 'event', who: 'narr', text: `Bac blanc de français, sortie scolaire… encore deux jours envolés.`, fx: { jours: -2 } }
    ] },

  /* ------------------------------ ACTE 3 ------------------------------ */
  { num: 3, title: 'Rien ne se fait seul', sub: 'Il reste la déco, le son, la caisse… et peu de temps.',
    steps: [
      { t: 'say', who: 'sofiane', text: `Il reste tout à préparer${N}: la déco, la caisse, le son. On est quatre au CVL. Soit on fait tout nous-mêmes, soit on demande à ceux qui savent faire.` },
      { t: 'choice', id: 'orga', prompt: `Comment t'organises-tu${N}?`, options: [
        { id: 'seuls', label: 'On fait tout à quatre', desc: 'Au moins, on est sûrs que ce sera fait.', fx: { jours: -5, amb: -5 },

  /* ---------- interface ---------- */
  function hud() {
    const g = (k, v, pct, low) => `<div class="g${low ? ' low' : ''}"><div class="g-l" title="${LABELS[k]}">${SHORT[k]}</div><div class="g-v">${v}</div><div class="g-b"><i style="width:${clamp(pct, 0, 100)}%"></i></div></div>`;
    return `<div class="hud">
      ${g('budget', S.budget + N + '€', S.budget / 5, S.budget < 0)}
      ${g('jours', S.jours + N + 'j', S.jours / 15 * 100, S.jours < 3)}
      ${g('amb', Math.round(S.amb), S.amb, S.amb < 45)}
      ${g('conf', Math.round(S.conf), S.conf, S.conf < 35)}
    </div><div class="deltas" aria-live="polite">${lastDeltas.map(d => `<span class="d ${d.v > 0 ? 'up' : 'down'}">${d.t}</span>`).join('')}</div>`;
  }
  function frame(who, inner) {
    app.innerHTML = `<div class="topbar"><div class="brand">LE GRAND <span>SOIR</span></div><div class="act-tag">Acte ${act.num} · ${act.title}</div></div>
      ${hud()}<div class="stage">${stageSVG(who)}</div>${inner}`;
  }
  function whoTag(id) {
    const c = GAME.characters[id] || GAME.characters.narr;
    return `<span class="who" style="background:${c.color}">${c.name}</span>${c.role ? `<span class="role">${c.role}</span>` : ''}`;
  }
  function applyFx(fx) {
    lastDeltas = [];
    if (!fx) return;
    for (const k in fx) {
      const v = fx[k]; if (!v) continue;
      S[k] += v;
      if (k === 'amb' || k === 'conf') S[k] = clamp(S[k], 0, 100);
      if (LABELS[k]) lastDeltas.push({ v, t: `${LABELS[k]} ${v > 0 ? '+' : '−'}${Math.abs(v)}${UNIT[k] || ''}` });
    }
  }
  function pushAfter(lines) {
    queue.unshift(...(lines || []).map(l => ({ t: 'say', who: l.who, text: l.text, _after: true })));
  }
  const failed = () => !act.final && (S.jours < 0 || S.budget < -GAME.overdraft);

  /* ---------- déroulement ---------- */
  function startGame() {
    S = { flags: {} }; GAME.start(S);
    H = {}; lastDeltas = []; maxAct = 0;
    startAct(0);
  }
  function startAct(i) {
    act = GAME.acts[i]; maxAct = Math.max(maxAct, act.num); lastDeltas = [];
    queue = act.steps.slice();
    app.innerHTML = `<div class="card"><div class="kicker">Acte ${act.num}</div><h2>${act.title}</h2><p class="lead">${act.sub}</p><button class="btn" id="go">Continuer ▸</button></div>`;
    document.getElementById('go').onclick = next;
    window.scrollTo(0, 0);
  }
  function next() {
    if (failed() && !(queue[0] && queue[0]._after)) return end('annulee');
    let st;
    while ((st = queue.shift())) { if (!st.if || st.if(S)) break; }
    if (!st) {
      const i = GAME.acts.indexOf(act);
      return i + 1 < GAME.acts.length ? startAct(i + 1) : end();
    }
    if (st.t === 'say' || st.t === 'event') {
      if (st.t === 'event') { if (st.do) st.do(S); applyFx(val(st.fx, S)); if (st.set) Object.assign(S.flags, st.set); }
      else if (!st._after) lastDeltas = [];
      frame(st.who, `<div class="box">${whoTag(st.who)}<p class="say">${val(st.text, S)}</p><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'choice') {
      lastDeltas = [];
      const options = st.options.filter(o => !(st._removed || []).includes(o.id));
      const html = options.map((o, i) => {
        let lock = o.lock ? o.lock(S) : null;
        if (!lock && o.cost && S.budget - o.cost < -GAME.overdraft) lock = 'Budget insuffisant.';
        return `<button class="opt" data-i="${i}" ${lock ? 'disabled' : ''}><div class="opt-t"><span>${o.label}</span>${o.cost ? `<span class="opt-c">− ${o.cost}${N}€</span>` : ''}</div><div class="opt-d">${val(o.desc, S) || ''}</div>${lock ? `<div class="opt-lock">${lock}</div>` : ''}</button>`;
      }).join('');
      frame(null, `<div class="box"><div class="prompt">${st.prompt}</div><div class="opts">${html}</div></div>`);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = options[+b.dataset.i];
        const after = val(o.after, S), fx = val(o.fx, S);
        if (o.again) queue.unshift(Object.assign({}, st, { _removed: (st._removed || []).concat(o.id) }));  // le choix revient, sans cette option
        else H[st.id] = o.id;
        if (o.do) o.do(S);
        if (o.set) Object.assign(S.flags, o.set);
        applyFx(fx); pushAfter(after); next();
      });
    } else if (st.t === 'qty') {
      lastDeltas = [];
      frame(null, `<div class="box"><div class="prompt">${st.prompt}</div>
        <div class="price"><div class="price-v" id="pv"></div><div class="price-m" id="pm"></div></div>
        <input type="range" id="rng" min="${st.min}" max="${st.max}" step="1" value="${st.def}" aria-label="${st.prompt}">
        <div class="range-l"><span>${st.min}</span><span>${st.max}</span></div>
        <div style="text-align:center"><button class="btn" id="go">Valider ▸</button></div></div>`);
      const r = document.getElementById('rng'), upd = () => {
        document.getElementById('pv').textContent = st.show(+r.value);
        document.getElementById('pm').innerHTML = st.info(S, +r.value);
      };
      r.oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        const n = +r.value, res = st.resolve(S, n);
        H[st.id] = String(n); H[st.id + 'v'] = n;
        if (res.do) res.do(S);
        applyFx(res.fx); pushAfter(res.after); next();
      };
    }
    window.scrollTo(0, 0);
  }

  function end(forced) {
    const e = forced ? GAME.endings.find(x => x.id === forced) : GAME.endings.find(x => x.when(S));
    store.add(e.id);
    const deb = GAME.debrief.filter(d => d.act <= maxAct && !(d.finalOnly && forced) && (d.needs || []).every(k => H[k] !== undefined))
      .map(d => `<div class="deb"><h3>${d.title}</h3><p>${d.text(H, S).replace(/ ([:?!»])/g, N + '$1').replace(/« /g, '«' + N)}</p></div>`).join('');
    const found = store.get().length;
    app.innerHTML = `<div class="end" data-ending="${e.id}">
      <div class="end-head"><div class="kicker">Fin de partie</div><h2>${e.title}</h2>
        <div class="stamp" style="color:${e.color};border-color:${e.color}">${e.stamp}</div><p class="lead">${val(e.text, S)}</p></div>
      <div class="bilan"><div><small>Budget final du foyer</small><b>${S.budget}${N}€</b></div><div><small>Élèves présents</small><b>${S.att !== undefined ? S.att : '—'}</b></div>
        <div><small>Ambiance</small><b>${Math.round(S.amb)} / 100</b></div><div><small>Confiance de la proviseure</small><b>${Math.round(S.conf)} / 100</b></div></div>
      ${deb ? `<div class="deb-t">Ce que tu viens de vivre a un nom</div><p class="deb-s">Tu as utilisé ces notions pour organiser ta fête. Voici comment on les appelle en économie.</p>${deb}` : ''}
      ${forced ? `<p class="deb-s">Ta partie s'est arrêtée à l'acte ${maxAct}. Rejoue pour aller jusqu'au grand soir.</p>` : ''}
      <div class="vocab">${GAME.vocab.map(v => `<span>${v}</span>`).join('')}</div>
      <div class="end-btns"><button class="btn" id="again">Rejouer ▸</button><a class="btn ghost" href="${GAME.backLink}">Retour au cours</a></div>
      <p class="found">Fins découvertes${N}: ${found} / ${GAME.endings.length}</p>
    </div><div class="foot">© 2026 Prof 4.0 — Romain Pineau · Économie 1re STMG, thème 1</div>`;
    document.getElementById('again').onclick = startGame;
    window.scrollTo(0, 0);
  }

  function home() {
    const found = store.get().length;
    app.innerHTML = `<div class="card"><div class="kicker">Économie · 1re STMG · Thème 1</div>
      <h1>LE GRAND <span>SOIR</span></h1>
      <p class="lead">Tu es Inès, élue au CVL. La proviseure te confie la fête de fin d'année${N}: 500${N}€, 15 jours, et un lycée entier qui veut tout. À toi de choisir… et de renoncer.</p>
      <button class="btn" id="go">Jouer ▸</button>
      <p class="found">4 actes · 15 minutes · ${GAME.endings.length} fins possibles${found ? ` · ${found} découverte${found > 1 ? 's' : ''}` : ''}</p></div>
      <div class="foot">© 2026 Prof 4.0 — Romain Pineau</div>`;
    document.getElementById('go').onclick = startGame;
  }
  home();
})();
</script>
</body>
</html>
