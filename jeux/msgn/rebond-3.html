<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONTENU DU JEU — Rebond 3 : L'équipe et les clients (MSGN Terminale, thème 2)
   L'entreprise est simulée mois par mois (12 mois).
     Motivation de 4 salariés clés + des 14 autres → climat social
     Climat → départs (6 000 € chacun) et absences (coût de remplacement)
     Site : visites × taux de conversion × marge ; e-réputation → visites
   Jauges : tre (€), climat (0-100), satisf (0-100), erep (note sur 5).
   ===================================================================== */
const N = ' ';
const eur = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + N + '€';
const sg = n => (n >= 0 ? '+' : '−') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + N + '€';
const nb = n => Math.round(n).toLocaleString('fr-FR');
const n1 = n => (Math.round(n * 10) / 10).toLocaleString('fr-FR');
const cl = (n, a, b) => Math.max(a, Math.min(b, n));
const F = s => s.flags;

/* ---- Paramètres ---- */
const BASE = 1500;          // résultat mensuel du reste de l'activité (atelier, boutique, Domus), une fois tout payé
const MASSE = 45000;        // masse salariale mensuelle (18 salariés)
const COUT_DEPART = 6000;   // recruter et former un remplaçant
const VISITES = 20000, MARGE_WEB = 30;  // ce que rapporte une vente en ligne, une fois tout payé
const PERS = ['malik', 'samir', 'lou', 'jade'];

const eff = (s, p, k) => s.m[p] + s.fade[p] * Math.pow(.75, k);          // motivation au mois k après le dernier calcul
function climat(s, k) { const key = PERS.filter(p => !s.parti[p]).map(p => eff(s, p, k)); const a = key.length ? key.reduce((x, y) => x + y, 0) / key.length : 40; return cl(Math.round(.45 * a + .55 * eff(s, 'autres', k)), 0, 100); }
function conv(s, mo) {
  if (F(s).livraison) return 1.9; if (F(s).baisse) return 1.15 + .25; if (F(s).page) return 1.05;
  return Math.max(.9, 1.2 - .05 * mo);
}
function siteMois(s, mo) {
  const v = VISITES * (F(s).pub ? 1.3 : 1) * Math.pow(s.erep / 4.3, 2), ventes = v * conv(s, mo) / 100 * (F(s).segment && mo >= 8 ? 1.15 : 1) + (F(s).fichier && mo === 7 ? 80 : 0);
  const m = MARGE_WEB - (F(s).livraison ? 6 : 0) - (F(s).baisse ? 27 : 0);
  return { v, ventes, marge: ventes * m - (F(s).pub ? 3000 : 0) };
}
function unMois(s, mo, k) {
  const c = climat(s, k), absPct = 2 + Math.max(0, 60 - c) / 8, absCout = absPct / 100 * MASSE * 1.2;
  const dep = 18 * .05 * (1 - c / 100), depCout = dep * COUT_DEPART;
  const site = siteMois(s, mo);
  const levier = (F(s).generale ? 1170 : 0) + (s.choix.malik === 'aug' ? 220 : 0) + (s.choix.samir === 'aug' ? 220 : 0) + (s.choix.lou === 'aug' ? 220 : 0) + (s.choix.jade === 'aug' ? 220 : 0);
  const satEff = (s.satisf - 60) * 90;
  let res = BASE + site.marge - absCout - depCout - levier + satEff;
  const inter = F(s).interess && res > 0 ? res * .05 : 0; res -= inter;
  return { mo, c, absPct, absCout, dep, depCout, site, levier, inter, satEff, res };
}
function periode(s, n) {
  const ms = []; for (let i = 1; i <= n; i++) ms.push(unMois(s, s.mois + i, i));
  const sum = k => ms.reduce((a, m) => a + (typeof k === 'function' ? k(m) : m[k]), 0);
  const L = ms[n - 1];
  const satTarget = 40 + .4 * L.c + (F(s).livraison ? 6 : 0) + (F(s).segment ? 4 : 0);
  return { ms, n, res: sum('res'), dep: sum('dep'), L, dSat: Math.round((satTarget - s.satisf) * .5), dClimat: L.c - s.climat };
}
function fxPer(s) { const R = s.rep; return { tre: Math.round(R.res), climat: R.dClimat, satisf: R.dSat }; }
function commit(s) {
  const R = s.rep; s.mois += R.n; s.departs += R.dep;
  for (const p of PERS.concat('autres')) s.fade[p] *= Math.pow(.75, R.n);
  s.hist.push({ m: s.mois, res: Math.round(R.res) }); s.months = (s.months || []).concat(R.ms);
}
function tableau(s, titre) {
  const R = s.rep, m = R.ms, a = k => m.reduce((x, y) => x + (typeof k === 'function' ? k(y) : y[k]), 0) / m.length;
  const row = (l, v, cls) => `<span${cls ? ` class="${cls}"` : ''}>${l}</span><b${cls ? ` class="${cls}"` : ''}>${v}</b>`;
  return `<b>${titre}</b><span class="pay">${row('Climat social', Math.round(a('c')) + ' / 100')}${row('Absences', n1(a('absPct')) + N + '% des heures')}${row('Départs sur la période', n1(R.dep))}${row('Ventes du site par mois', nb(a(x => x.site.ventes)))}
    ${row('Reste de l\'activité', '+' + eur(BASE))}${row('Marge du site', sg(a(x => x.site.marge)))}${row('Absences (remplacements)', '−' + eur(a('absCout')))}${row('Départs (recruter, former)', '−' + eur(a('depCout')))}${a('levier') > 0 ? row('Augmentations', '−' + eur(a('levier'))) : ''}${a('inter') > 0 ? row('Intéressement', '−' + eur(a('inter'))) : ''}${row('Clients plus ou moins satisfaits', sg(a('satEff')))}
    ${row('Ce qui reste chaque mois', sg(R.res / R.n), 'tot')}${row(`Sur ${R.n} mois`, sg(R.res), 'tot')}</span>`;
}
function equipeHtml(s) {
  const lab = { malik: 'Malik', samir: 'Samir', lou: 'Lou', jade: 'Jade', autres: 'Les 14 autres' };
  return `<span class="pay">${PERS.concat('autres').map(p => `<span>${lab[p]}</span><b${s.parti[p] ? ' style="color:var(--bad)"' : eff(s, p, 0) < 45 ? ' style="color:var(--bad)"' : ''}>${s.parti[p] ? 'parti' : Math.round(eff(s, p, 0)) + ' / 100'}</b>`).join('')}</span>`;
}
const V = (e, c, f) => [{ who: 'yanis', text: e }, { nom: 'Inès, cliente fidèle', text: c }, { who: 'ferhat', text: f }].filter(v => v.text !== '—');
const ch = (good, bad) => ({ good, bad });
const up = (p, lasting, fade) => s => { s.m[p] += lasting || 0; s.fade[p] += fade || 0; };
const budgetLock = c => s => !F(s).indiv ? null : c > s.budget ? 'Budget insuffisant' : null;
const spend = c => s => { s.budget -= c; };

const GAME = {
  title: 'Rebond 3',
  brand: 'REBOND <span>3</span>',
  storeKey: 'rebond3Fins',
  backLink: '../../matieres/msgn-terminale.html',
  footer: 'MSGN Terminale STMG, thème 2',
  kicker: 'MSGN · Terminale STMG · Thème 2',
  debIntro: 'Tu as utilisé ces notions pour diriger des personnes et parler à tes clients. Voici comment on les appelle en management et sciences de gestion.',
  cutText: 'Ta partie s\'est arrêtée avant la fin de l\'année. Rejoue pour aller jusqu\'au bilan.',
  pitch: `Deux ans après sa création, Rebond compte 18 salariés, une boutique, un atelier et un site de vente. Mais un salarié sur trois est parti cette année, les arrêts maladie se multiplient et les ventes en ligne baissent. Tu prends la direction. Tes outils${N}: des gens, des données, et ta façon de parler.`,
  meta: '4 actes · 30 minutes',
  start: s => Object.assign(s, { tre: 30000, climat: 46, satisf: 62, erep: 4.3, mois: 0, departs: 0, hist: [], budget: 15000, choix: {}, parti: {},
    m: { malik: 45, samir: 36, lou: 55, jade: 40, autres: 48 }, fade: { malik: 0, samir: 0, lou: 0, jade: 0, autres: 0 } }),
  hud: [
    { k: 'tre',    label: 'Trésorerie', short: 'Trésorerie', show: s => (s.tre / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + N + 'k€', pct: s => s.tre / 600, low: s => s.tre < 5000, unit: N + '€' },
    { k: 'climat', label: 'Climat social', short: 'Climat', show: s => Math.round(s.climat), pct: s => s.climat, low: s => s.climat < 45, clamp: true },
    { k: 'satisf', label: 'Satisfaction clients', short: 'Clients', show: s => Math.round(s.satisf), pct: s => s.satisf, low: s => s.satisf < 55, clamp: true },
    { k: 'erep',   label: 'Note en ligne', short: 'Note', show: s => n1(s.erep) + N + '★', pct: s => (s.erep - 2.5) * 40, low: s => s.erep < 3.8, unit: N + '★' }
  ],
  fail: s => s.tre < -25000 ? 'faillite' : null,
  lock: () => null,

  acts: [
  /* ------------------------------ ACTE 1 ------------------------------ */
  { num: 1, title: 'Motiver', sub: 'Quinze mille euros pour donner envie de rester. Le même euro ne produit pas le même effet chez tout le monde.',
    steps: [
      { t: 'say', who: 'ferhat', text: `Six départs l'an dernier. Chacun vous a coûté environ 6${N}000${N}€${N}: annonce, entretiens, formation du remplaçant, erreurs des premières semaines. Votre budget pour l'année${N}: 15${N}000${N}€. Mais avant de dépenser, écoutez-les.` },
      { t: 'say', who: 'malik', text: `Moi, je vais être franc. J'ai trois enfants, le loyer a pris 80${N}€. J'aime le boulot, mais un garage m'offre 200${N}€ de plus par mois.` },
      { t: 'say', who: 'samir', text: `Ça fait deux ans que je trie des téléphones. Je connais le poste par cœur, je forme tous les nouveaux… et personne ne l'a jamais remarqué. Je ne sais pas où je serai dans un an.` },
      { t: 'say', who: 'lou', text: `J'ai plein d'idées pour la boutique. La vitrine, l'accueil, le coin conseils. Mais chaque fois que j'en parle, on me dit «${N}plus tard${N}».` },
      { t: 'say', who: 'jade', text: `Huit heures debout à l'emballage, le plan de travail trop bas. J'ai mal au dos tous les soirs. Et je finis à 18${N}h${N}30, la crèche ferme à 18${N}h.` },
      { t: 'say', who: 'ferhat', text: s => `Voici où en est leur motivation, d'après l'entretien annuel.${equipeHtml(s)}Deux façons de faire${N}: une augmentation pour tout le monde, ou une réponse personne par personne.` },
      { t: 'choice', id: 'approche', prompt: `Comment utiliser les 15${N}000${N}€${N}?`, options: [
        { id: 'generale', label: 'Augmenter tout le monde de 2 %', desc: 'Environ 1 170 € par mois, soit 14 000 € sur l\'année. Simple et juste.', set: { generale: true },
          do: s => { for (const p of PERS.concat('autres')) s.fade[p] += 14; },
          chain: ch(['Tout le monde est content le jour de l\'annonce', 'Personne ne se sent oublié'], ['2 % de Malik, c\'est 40 € : pas 200', 'Samir, Lou et Jade n\'ont pas reçu ce qu\'ils demandaient', 'Dans trois mois, l\'augmentation sera devenue normale', 'Le budget est épuisé']),
          voix: V(`Ils étaient contents lundi. Mardi, Jade avait toujours mal au dos.`, `Rien vu changer en boutique.`, `Une augmentation évite qu'on se plaigne du salaire. Elle ne donne pas envie de se lever le matin. Surtout quand la plainte n'était pas le salaire.`) },
        { id: 'indiv', label: 'Répondre à chacun selon ce qu\'il attend', desc: 'Tu décides personne par personne, dans la limite des 15 000 €.', set: { indiv: true },
          chain: ch(['Chaque euro vise un besoin précis', 'Chacun se sent écouté'], ['Il faudra bien écouter', 'Certains compareront ce que les autres ont reçu']),
          voix: V(`Plus de travail pour toi. Mais ils vont sentir la différence.`, `On verra bien.`, `Bien. Relisez ce qu'ils vous ont dit. Tout est là.`) } ] },
      { t: 'choice', id: 'malik', if: s => F(s).indiv, prompt: s => `Pour Malik${N}? (reste ${eur(s.budget)})`, options: [
        { id: 'aug', label: 'Une augmentation de 150 € net par mois', desc: '220 € par mois charges comprises, soit 2 640 € sur l\'année.', lock: budgetLock(2640), do: s => { spend(2640)(s); up('malik', 28)(s); s.choix.malik = 'aug'; },

        { id: 'prime', label: 'Une prime de 1 000 € tout de suite', desc: 'Versée une fois.', lock: budgetLock(1000), fx: { tre: -1000 }, do: s => { spend(1000)(s); up('malik', 0, 18)(s); s.choix.malik = 'prime'; },
          chain: ch(['Un soulagement immédiat'], ['Le loyer, lui, revient chaque mois', 'Dans quelques mois, le problème est le même']), voix: V(`Content. Pour ce mois-ci.`, `—`, `Une prime soulage. Elle ne règle pas un problème qui revient tous les mois.`) },
        { id: 'reco', label: 'Le féliciter pour son travail', desc: 'Gratuit.', do: s => { up('malik', 3)(s); s.choix.malik = 'reco'; },

          chain: ch(['Ce qu\'il faisait déjà est enfin reconnu', 'Il voit un avenir chez Rebond', 'Les nouveaux sont mieux formés'], ['2 500 €']), voix: V(`Il a affiché sa formation au-dessus de son poste.`, `—`, `Vous lui avez donné ce qu'il demandait${N}: une reconnaissance et une perspective.`) },
        { id: 'aug', label: 'Une augmentation de 150 € net par mois', desc: '2 640 € sur l\'année.', lock: budgetLock(2640), do: s => { spend(2640)(s); up('samir', 0, 12)(s); s.choix.samir = 'aug'; },
          chain: ch(['Un peu plus d\'argent'], ['Il n\'avait pas parlé d\'argent', 'Il se demande toujours où il sera dans un an']), voix: V(`Il a dit merci. Il a l'air toujours aussi perdu.`, `—`, `Il vous parlait d'avenir, vous lui répondez salaire.`) },
        { id: 'reco', label: 'Le remercier devant toute l\'équipe', desc: 'Gratuit.', do: s => { up('samir', 12)(s); s.choix.samir = 'reco'; },

      { t: 'choice', id: 'lou', if: s => F(s).indiv, prompt: s => `Pour Lou${N}? (reste ${eur(s.budget)})`, options: [

          chain: ch(['Elle peut enfin agir', 'Son travail a du sens', 'Ses idées vont servir à tous'], ['Il faudra la laisser faire, vraiment']), voix: V(`Elle a passé le week-end à dessiner la nouvelle vitrine.`, `J'ai hâte de voir ça.`, `Vous lui donnez ce qui la motive${N}: de l'autonomie. Ça ne coûte rien, sauf de lâcher un peu prise.`) },
        { id: 'formation', label: 'Lui payer une formation en vente', desc: '1 500 €.', lock: budgetLock(1500), fx: { tre: -1500 }, do: s => { spend(1500)(s); up('lou', 10)(s); s.choix.lou = 'formation'; },
          chain: ch(['Elle progresse'], ['Elle voulait agir, pas apprendre', 'Ses idées restent dans un tiroir']), voix: V(`Elle a aimé la formation. Elle demande quand elle pourra s'en servir.`, `—`, `Utile, mais à côté de sa demande.`) },
        { id: 'aug', label: 'Une augmentation de 150 € net par mois', desc: '2 640 € sur l\'année.', lock: budgetLock(2640), do: s => { spend(2640)(s); up('lou', 0, 10)(s); s.choix.lou = 'aug'; },
          chain: ch(['Un peu plus d\'argent'], ['Ce n\'était pas sa demande']), voix: V(`Elle a dit merci. Puis : «${N}Et pour la boutique${N}?${N}»`, `—`, `L'argent ne remplace pas la confiance.`) } ] },
      { t: 'choice', id: 'jade', if: s => F(s).indiv, prompt: s => `Pour Jade${N}? (reste ${eur(s.budget)})`, options: [
        { id: 'deux', label: 'Un poste réglable et des horaires souples', desc: 'Plan de travail réglable, tapis antifatigue, pauses actives : 3 000 €. Elle finit à 17 h 30.', lock: budgetLock(3000), fx: { tre: -3000 }, set: { ergo: true }, do: s => { spend(3000)(s); up('jade', 30)(s); s.choix.jade = 'deux'; },
          chain: ch(['Plus de douleur le soir', 'Elle récupère son enfant à l\'heure', 'Tu préviens un arrêt maladie'], ['3 000 €']), voix: V(`Elle ne se tient plus le dos en partant.`, `—`, `Vous avez agi sur ses conditions de travail, avant qu'elles ne la cassent.`) },
        { id: 'horaires', label: 'Seulement des horaires souples', desc: 'Gratuit. Elle finit à 17 h 30.', do: s => { up('jade', 14)(s); s.choix.jade = 'horaires'; },
          chain: ch(['La crèche, c\'est réglé'], ['Le plan de travail est toujours trop bas', 'Le dos, lui, continue de souffrir']), voix: V(`Elle part plus tôt. Avec son dos.`, `—`, `La moitié du problème.`) },
        { id: 'aug', label: 'Une augmentation de 150 € net par mois', desc: '2 640 € sur l\'année.', lock: budgetLock(2640), do: s => { spend(2640)(s); up('jade', 0, 10)(s); s.choix.jade = 'aug'; },
          chain: ch(['Un peu plus d\'argent'], ['Toujours mal au dos', 'Toujours en retard à la crèche']), voix: V(`Elle a mal au dos, mais elle est mieux payée pour.`, `—`, `Vous lui payez sa douleur au lieu de la supprimer.`) } ] },
      { t: 'choice', id: 'autres', if: s => F(s).indiv, prompt: s => `Et les 14 autres${N}? (reste ${eur(s.budget)})`, options: [
        { id: 'interess', label: 'Leur donner 5 % des bénéfices chaque mois', desc: 'Tout le monde gagne plus quand Rebond gagne plus.', set: { interess: true }, do: s => { up('autres', 12)(s); },
          chain: ch(['Chacun a intérêt à ce que l\'entreprise réussisse', 'Aucun coût si Rebond perd de l\'argent'], ['5 % des bénéfices partent chaque mois']), voix: V(`Ils regardent les chiffres du mois, maintenant. C'est nouveau.`, `—`, `Vous liez leur intérêt à celui de l'entreprise.`) },
        { id: 'reco', label: 'Un point mensuel pour fêter les réussites', desc: 'Gratuit : chaque mois, on raconte ce qui a bien marché, et qui l\'a fait.', do: s => { up('autres', 7)(s); },
          chain: ch(['Chacun voit que son travail compte'], ['Ça ne change rien au salaire']), voix: V(`Le premier point a duré vingt minutes. Personne n'a regardé son téléphone.`, `—`, `La reconnaissance ne coûte rien. Elle compte pourtant.`) },
        { id: 'prime', label: 'Une prime de 500 € chacun', desc: '7 000 €, versés une fois.', lock: budgetLock(7000), fx: { tre: -7000 }, do: s => { spend(7000)(s); up('autres', 0, 14)(s); },

        { id: 'rien', label: 'Rien de spécial', desc: '', do: s => { up('autres', -6)(s); },

  /* ------------------------------ ACTE 2 ------------------------------ */
  { num: 2, title: 'Diriger', sub: 'Trois situations, trois personnes. Le bon chef n\'a pas un style : il en a plusieurs.',
    steps: [
      { t: 'say', who: 'yanis', text: `Samedi, 11 heures, la boutique est pleine. Malik vient de rendre à une cliente un téléphone dont la batterie chauffe. Elle est furieuse, six personnes attendent derrière elle.` },
      { t: 'choice', id: 'style1', prompt: `Le rush${N}: que fais-tu${N}?`, options: [
        { id: 'directif', label: 'Prendre les choses en main', desc: '« Malik, tu reprends le téléphone, tu changes la batterie maintenant. Lou, tu prends la file. » On débriefera lundi.', do: s => { s.lead = (s.lead || 0) + 2; },
          chain: ch(['Décision immédiate, chacun sait quoi faire', 'La cliente repart avec un téléphone sûr', 'La file avance'], ['Personne n\'a eu son mot à dire, mais ce n\'était pas le moment']), voix: V(`Clair, rapide. C'est ce qu'il fallait.`, `Ils ont réglé ça en dix minutes, bravo.`, `En urgence, avec un risque pour la sécurité, on décide. On discutera après.`) },
        { id: 'participatif', label: 'Réunir l\'équipe pour décider ensemble', desc: 'Tu demandes à chacun son avis sur la meilleure chose à faire.', fx: { satisf: -6, erep: -.05 }, do: s => { s.lead = (s.lead || 0) - 1; },
          chain: ch(['Tout le monde est consulté'], ['Dix minutes de discussion pendant que la cliente attend', 'Six clients s\'impatientent', 'Deux repartent sans rien acheter']), voix: V(`On a fait une réunion au milieu de la boutique. Les clients nous regardaient.`, `J'ai attendu vingt minutes sans savoir pourquoi.`, `Faire participer, c'est précieux. Pas avec une cliente furieuse et une batterie qui chauffe.`) },
        { id: 'delegatif', label: 'Laisser Malik gérer', desc: 'C\'est son erreur, à lui de la réparer.', fx: { satisf: -9, erep: -.1 }, do: s => { s.lead = (s.lead || 0) - 2; up('malik', -6)(s); },
          chain: ch(['Malik est responsabilisé'], ['Il est paniqué, il ne sait pas quoi faire', 'La cliente s\'énerve davantage', 'Elle laisse un avis à une étoile']), voix: V(`Malik était seul au milieu de la tempête. Il s'en veut encore.`, `Personne ne savait qui décidait.`, `Déléguer, c'est confier une décision à quelqu'un capable de la prendre. Pas abandonner quelqu'un en pleine crise.`) } ] },
      { t: 'say', who: 'lou', text: s => F(s).louProjet ? `J'ai fini les plans de la nouvelle boutique. Vitrine thématique chaque mois, un coin conseil pour les seniors, des créneaux de rendez-vous. Je peux commencer lundi${N}?` : `J'ai dessiné des plans pour la boutique, sur mon temps libre. Vitrine thématique, un coin conseil pour les seniors, des créneaux de rendez-vous. Tu veux bien regarder${N}?` },
      { t: 'choice', id: 'style2', prompt: `Le projet de Lou${N}?`, options: [
        { id: 'delegatif', label: 'Lui faire confiance : elle décide et elle mène le projet', desc: 'Tu fixes le budget et la date, elle fait le reste.', set: { boutique: true }, do: s => { s.lead = (s.lead || 0) + 2; up('lou', 15)(s); up('autres', 3)(s); },
          chain: ch(['Lou est compétente et motivée : elle peut décider', 'Elle se sent responsable', 'Les clients découvrent une boutique repensée', 'Les autres voient qu\'on peut proposer des idées ici'], ['Tu ne contrôles pas chaque détail']), voix: V(`La boutique ne ressemble plus à rien de ce qu'on avait. En mieux.`, `Le coin conseil est génial, j'y ai amené ma grand-mère.`, `Lou savait et voulait. Il suffisait de lui laisser la place.`) },
        { id: 'participatif', label: 'En discuter avec elle et l\'équipe, puis décider ensemble', desc: 'Une réunion, chacun donne son avis, Lou garde la main.', set: { boutique: true }, do: s => { s.lead = (s.lead || 0) + 1; up('lou', 8)(s); up('autres', 4)(s); },
          chain: ch(['Le projet est enrichi par l\'équipe', 'Tout le monde s\'y retrouve'], ['Un peu plus lent']), voix: V(`On a ajouté le coin réparation express. Bonne idée de Malik.`, `La nouvelle boutique est sympa.`, `Une bonne façon de faire, ici.`) },
        { id: 'directif', label: 'Garder tes propres idées', desc: '« Merci, mais on va faire comme j\'ai prévu. »', do: s => { s.lead = (s.lead || 0) - 2; up('lou', -22)(s); up('autres', -4)(s); },
          chain: ch(['Tu gardes le contrôle'], ['Lou comprend que ses idées ne comptent pas', 'Les autres aussi', 'La boutique ne change pas']), voix: V(`Elle n'a rien dit. Elle n'a plus rien proposé depuis.`, `Toujours la même boutique.`, `Imposer à quelqu'un de compétent et motivé, c'est le meilleur moyen de le démotiver.`) } ] },
      { t: 'say', who: 'tom', text: `Salut${N}! C'est mon premier jour. Je n'ai jamais vendu de téléphone de ma vie, mais je suis super motivé. Je fais quoi${N}?` },
      { t: 'choice', id: 'style3', prompt: `Tom, premier jour${N}?`, options: [
        { id: 'persuasif', label: 'L\'accompagner : expliquer, montrer, encourager', desc: 'Une semaine en binôme avec Lou, un point chaque soir.', do: s => { s.lead = (s.lead || 0) + 2; },
          chain: ch(['Il apprend les bons gestes', 'Il comprend pourquoi on fait comme ça', 'Sa motivation reste intacte'], ['Une semaine de temps de Lou']), voix: V(`Au bout de dix jours, il vendait seul.`, `Le petit nouveau est très bien, il m'a tout expliqué.`, `Motivé mais débutant${N}: il fallait guider et encourager.`) },
        { id: 'delegatif', label: 'Le laisser se débrouiller', desc: '« Tu es grand, lance-toi. »', fx: { satisf: -5 }, do: s => { s.lead = (s.lead || 0) - 2; s.departs += 1; },
          chain: ch(['Aucune perte de temps pour l\'équipe'], ['Il ne sait rien', 'Il fait des erreurs devant les clients', 'Découragé, il démissionne au bout d\'un mois', 'Un recrutement de plus : 6 000 €']), voix: V(`Il est parti sans dire au revoir.`, `Le jeune vendeur ne savait même pas ce qu'était un reconditionné.`, `On ne délègue pas à quelqu'un qui ne sait pas encore faire.`) },
        { id: 'directif', label: 'Lui donner des consignes précises', desc: 'Une fiche de tâches, des règles strictes, contrôle à chaque vente.', do: s => { s.lead = (s.lead || 0) + 1; },
          chain: ch(['Il sait exactement quoi faire', 'Peu d\'erreurs'], ['Il exécute sans comprendre', 'Il faudra changer de style quand il saura faire']), voix: V(`Carré. Un peu robot, mais carré.`, `Le nouveau suit sa fiche à la lettre.`, `Pour un débutant, c'est acceptable. Encourager en plus aurait été mieux.`) } ] },
      { t: 'event', who: 'ferhat', do: s => { if (F(s).boutique) s.satisf += 4; s.rep = periode(s, 2); }, text: s => tableau(s, 'Mois 4 et 5.'), fx: s => { const f = fxPer(s); if (H.style3 === 'delegatif') f.tre -= COUT_DEPART; return f; } },
      { t: 'event', who: 'narr', do: commit, text: s => `Cinq mois. Le compte affiche ${eur(s.tre)}.` },
      { t: 'say', who: 'lou', if: s => eff(s, 'lou', 0) < 38 && !s.parti.lou, text: `J'ai accepté un poste dans une autre boutique. Là-bas, on m'a promis de m'écouter.` },
      { t: 'event', who: 'ferhat', if: s => eff(s, 'lou', 0) < 38 && !s.parti.lou, do: s => { s.parti.lou = true; }, text: `Lou part. Coût du remplacement${N}: 6${N}000${N}€.`, fx: { tre: -6000, climat: -3 } }
    ] },

  /* ------------------------------ ACTE 3 ------------------------------ */
  { num: 3, title: 'Connaître ses clients', sub: 'Ce que les clients disent et ce qu\'ils font ne racontent pas toujours la même histoire.',
    steps: [

      { t: 'say', who: 'ferhat', text: `<span class="pay"><span><b>1. Questionnaire (300 clients)</b></span><b></b><span>«${N}Vos téléphones sont trop chers${N}»</span><b>48${N}%</b><span>«${N}Les délais sont longs${N}»</span><b>19${N}%</b><span>«${N}Pas assez de choix${N}»</span><b>14${N}%</b></span>` },

        { id: 'attendre', label: 'Attendre d\'en savoir plus avant de parler', desc: 'Pas de déclaration tant que l\'enquête n\'est pas finie.', fx: { erep: -.3, satisf: -4 },

  debrief: [
    { act: 1, needs: ['approche'], title: 'Acte 1 — Motiver', text: (h, s) => {
        const g = h.approche === 'generale' ? 'En augmentant tout le monde, tu as agi sur un <em>facteur d\'hygiène</em> : le salaire évite le mécontentement, mais il ne motive pas durablement (c\'est l\'idée de Herzberg). Au bout de quelques mois, l\'augmentation est devenue normale.' : 'En répondant à chacun selon son besoin, tu as appliqué une idée clé : la <em>motivation</em> est individuelle. Malik avait un besoin d\'argent ; Samir, de <em>reconnaissance</em> et d\'évolution ; Lou, d\'<em>autonomie</em> ; Jade, de meilleures <em>conditions de travail</em>.';
        return `${g} On distingue la <em>motivation extrinsèque</em> (ce qui vient de l\'extérieur : salaire, primes) et la <em>motivation intrinsèque</em> (ce que le travail apporte en lui-même : sens, autonomie, fierté). Le poste de Jade relève de la <em>qualité de vie et des conditions de travail</em> (<em>QVCT</em>) : ${F(s).ergo ? 'en aménageant son poste, tu as fait de la <em>prévention</em>.' : 'faute d\'aménagement, la douleur est devenue un arrêt maladie, plus cher que la prévention.'} Les départs et les absences (<em>turnover</em>, <em>absentéisme</em>) sont les <em>indicateurs</em> d\'un climat social dégradé : ils ont un coût réel, même s\'il ne figure sur aucune facture.`; },
      chain: () => ({ good: ['Identifier le besoin de chacun', 'Choisir le bon levier', 'Motivation durable', 'Moins de départs et d\'absences'], bad: ['Même réponse pour tous', 'Besoins non satisfaits', 'Départs et arrêts', 'Coûts cachés'] }) },
    { act: 2, needs: ['style1', 'style2', 'style3'], title: 'Acte 2 — Diriger', text: (h, s) => `Tu as utilisé plusieurs <em>styles de direction</em> (de <em>leadership</em>). Le style <em>directif</em> : le chef décide seul et donne des ordres. Le style <em>persuasif</em> : il explique et convainc. Le style <em>participatif</em> : il fait décider avec l\'équipe. Le style <em>délégatif</em> : il confie la décision. Aucun n\'est bon partout : c\'est le <em>leadership situationnel</em>. En urgence, il faut décider (${h.style1 === 'directif' ? 'ce que tu as fait' : 'ce que tu n\'as pas fait'}). Face à quelqu\'un de compétent et motivé comme Lou, déléguer libère son énergie (${h.style2 === 'directif' ? 'tu l\'as au contraire bridée' : 'tu l\'as laissée faire'}). Face à un débutant motivé comme Tom, il faut guider et encourager (${h.style3 === 'persuasif' ? 'ce que tu as fait' : h.style3 === 'directif' ? 'tu l\'as guidé, sans l\'encourager' : 'tu l\'as laissé seul'}). Un bon <em>leader</em> n\'est pas seulement un chef : c\'est quelqu\'un que l\'équipe a envie de suivre.`,
      chain: () => ({ good: ['Lire la situation', 'Adapter le style', 'Équipe efficace et motivée'], bad: ['Toujours le même style', 'Mauvais style au mauvais moment', 'Erreurs ou démotivation'] }) },
    { act: 3, needs: ['diag'], title: 'Acte 3 — Connaître ses clients', text: (h, s) => `Pour connaître tes clients, tu disposais de plusieurs sources. Le questionnaire est une <em>étude</em> de ce que les clients <em>déclarent</em>. Les statistiques du site sont des <em>traces numériques</em> : elles montrent ce qu\'ils <em>font</em>. Le fichier clients est une <em>base de données</em> interne (souvent gérée par un logiciel de <em>gestion de la relation client</em>, ou <em>CRM</em>). Les avis en ligne sont la voix des clients. ${h.diag === 'livraison' ? 'Tu as fait confiance aux comportements observés : c\'était la vraie cause.' : 'Tu as suivi ce que disaient les clients, alors que leurs comportements racontaient autre chose : les paniers étaient abandonnés à la page des frais de livraison.'} Utiliser des données personnelles est encadré par le <em>RGPD</em> : pour envoyer de la publicité, il faut le <em>consentement</em> de la personne, et la <em>CNIL</em> peut sanctionner. ${h.fichier === 'acheter' ? 'Le fichier acheté à DataPlus en était la violation directe.' : ''} Découper sa clientèle en groupes aux besoins proches, c\'est la <em>segmentation</em> ; adapter le message à chacun, c\'est la <em>personnalisation</em>.`,
      chain: () => ({ good: ['Croiser les sources', 'Comprendre le comportement', 'Bonne décision', 'Ventes'], bad: ['Une seule source', 'Mauvaise cause', 'Argent dépensé pour rien'] }) },
    { act: 4, needs: ['premier', 'message'], title: 'Acte 4 — Communiquer', text: (h, s) => `Face au <em>bad buzz</em>, tu as fait de la <em>communication de crise</em>. ${h.premier === 'equipe' ? 'En prévenant d\'abord tes salariés, tu as soigné la <em>communication interne</em> : ils sont devenus des relais fiables.' : 'Sans prévenir d\'abord tes salariés, tu as négligé la <em>communication interne</em> : chacun a improvisé sa version.'} ${h.message === 'reconnaitre' ? 'En reconnaissant le problème et en rappelant le lot, tu as choisi la transparence.' : h.message === 'nier' ? 'En niant, tu as fait durer la crise.' : 'En te taisant, tu as laissé les autres parler à ta place.'} Une bonne communication choisit un <em>message</em>, des <em>cibles</em> (clients, salariés, presse, internautes) et des <em>canaux</em> (SMS, réseaux, presse). Ce qu\'on dit de toi sur internet forme ton <em>e-réputation</em>. Enfin, vanter un produit, c\'est la <em>communication commerciale</em> ; montrer ce qu\'est l\'entreprise et ses valeurs, c\'est la <em>communication institutionnelle</em>${h.image === 'portes' ? ' : c\'est elle qui a reconstruit la confiance.' : '.'}`,
      chain: () => ({ good: ['Prévenir l\'équipe', 'Dire la vérité vite', 'Le bon canal pour chaque public', 'La confiance revient'], bad: ['Nier ou se taire', 'Laisser les autres raconter', 'L\'e-réputation s\'effondre'] }) }
  ],
  vocab: ['Motivation intrinsèque', 'Motivation extrinsèque', 'Facteurs d\'hygiène (Herzberg)', 'Reconnaissance', 'Autonomie', 'QVCT', 'Prévention', 'Turnover', 'Absentéisme', 'Climat social', 'Leadership', 'Style directif', 'Style persuasif', 'Style participatif', 'Style délégatif', 'Leadership situationnel', 'Étude (déclaratif)', 'Traces numériques', 'Base de données / CRM', 'RGPD', 'Consentement', 'CNIL', 'Segmentation', 'Personnalisation', 'Communication interne', 'Communication externe', 'Communication de crise', 'Cible', 'Canal', 'E-réputation', 'Communication commerciale', 'Communication institutionnelle']
};
let H = {};

/* =====================================================================
   2. DÉCOR — l'équipe (couleur = motivation) et le compteur du site.
   ===================================================================== */
GAME.scene = (S, act) => {
  const V1 = '#7C6FFF', lab = { malik: 'Malik', samir: 'Samir', lou: 'Lou', jade: 'Jade' }, X = [140, 192, 244, 296];
  let ppl = '';
  PERS.forEach((p, i) => {
    const gone = S.parti && S.parti[p], m = gone ? 0 : eff(S, p, 0), col = gone ? '#3a3550' : m >= 60 ? '#4CD97B' : m >= 45 ? '#FFC64F' : '#FF5C6A';
    ppl += `<g transform="translate(${X[i]},0)" opacity="${gone ? .45 : 1}"><circle cx="0" cy="62" r="11" fill="#E8B58A"/><rect x="-13" y="75" width="26" height="30" rx="7" fill="${col}"/>
      <text x="0" y="122" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700" font-size="11" fill="#EEF3EC">${lab[p]}</text>
      <text x="0" y="136" text-anchor="middle" font-family="Rajdhani,sans-serif" font-size="10" fill="${col}">${gone ? 'parti' : Math.round(m)}</text></g>`;
  });
  const crise = act.num >= 4 ? `<g><rect x="270" y="8" width="84" height="28" rx="4" fill="#1a0b0f" stroke="#FF5C6A"/><text x="312" y="27" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="10" fill="#FF5C6A">▶ 400k vues</text></g>` : '';
  return `<svg viewBox="0 0 360 200" role="img" aria-label="L'équipe de Rebond">
    <rect width="360" height="200" fill="#08070f"/><rect x="0" y="0" width="360" height="162" fill="#0b0918"/>
    <text x="218" y="28" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="9" fill="#8B86A8">MOTIVATION</text>
    ${ppl}${crise}
    <text x="218" y="154" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700" font-size="11" fill="${V1}">+ 14 autres : ${Math.round(eff(S, 'autres', 0))}</text>
    <rect x="0" y="162" width="360" height="38" fill="#0a0814"/><line x1="0" y1="162" x2="360" y2="162" stroke="#241f3d" stroke-width="1.5"/>`;
};
/* =====================================================================
   3. MOTEUR — générique, lit GAME et ne contient aucun texte de scénario.
   ===================================================================== */
(function () {
  const app = document.getElementById('app');
  let S, queue, act, lastDeltas = [], maxAct = 0;
  const HUD = {}; GAME.hud.forEach(g => HUD[g.k] = g);

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(GAME.storeKey) || '[]'); } catch (e) { return []; } },
    add(id) { try { const a = store.get(); if (!a.includes(id)) { a.push(id); localStorage.setItem(GAME.storeKey, JSON.stringify(a)); } } catch (e) {} }
  };
  const val = (v, ...a) => typeof v === 'function' ? v(...a) : v;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  function character(id) {
    const c = GAME.characters[id];
    if (!c || !c.body) return '';
    const acc = {
      bun: `<circle cx="-2" cy="-88" r="7" fill="${c.hair}"/>`,
      cap: `<path d="M-15,-72 Q0,-92 15,-72 Z" fill="${c.color}"/><rect x="6" y="-74" width="16" height="4" rx="2" fill="${c.color}"/>`,
      box: `<rect x="14" y="-44" width="22" height="18" rx="3" fill="#8a5a22" stroke="${c.color}" stroke-width="1.5"/>`,
      tie: `<path d="M0,-52 L4,-44 L0,-26 L-4,-44 Z" fill="${c.color}"/>`,
      clip: `<rect x="14" y="-46" width="16" height="22" rx="2" fill="#EEF3EC"/><rect x="18" y="-49" width="8" height="5" rx="1" fill="${c.color}"/><rect x="2" y="-73" width="12" height="6" rx="3" fill="none" stroke="#EEF3EC" stroke-width="1.5"/>`
    }[c.acc] || '';
    return `<g transform="translate(76,186)">
      <ellipse cx="0" cy="2" rx="26" ry="5" fill="#000" opacity=".5"/>
      <rect x="-13" y="-22" width="11" height="24" rx="5" fill="#1b2420"/><rect x="2" y="-22" width="11" height="24" rx="5" fill="#1b2420"/>
      <rect x="-25" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(8 -20 -50)"/>
      <rect x="-18" y="-56" width="36" height="40" rx="12" fill="${c.body}"/>
      <rect x="15" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(-18 20 -50)"/>
      <circle cx="0" cy="-70" r="15" fill="#E8B58A"/>
      <path d="M-15,-72 Q-14,-88 0,-87 Q15,-88 15,-72 Q8,-80 -15,-72 Z" fill="${c.hair}"/>
      <circle cx="4" cy="-70" r="1.8" fill="#151515"/><circle cx="11" cy="-70" r="1.8" fill="#151515"/>
      <path d="M4,-63 Q8,-60 12,-63" stroke="#151515" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      ${acc}
      <path d="M12,-82 Q19,-70 12,-58 M17,-52 Q21,-36 17,-20" stroke="${c.color}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    </g>`;
  }

  function hud() {
    return `<div class="hud">${GAME.hud.map(g => `<div class="g${g.low(S) ? ' low' : ''}"><div class="g-l" title="${g.label}">${g.short}</div><div class="g-v">${g.show(S)}</div><div class="g-b"><i style="width:${clamp(g.pct(S), 0, 100)}%"></i></div></div>`).join('')}</div>
      <div class="deltas" aria-live="polite">${lastDeltas.map(d => `<span class="d ${d.v > 0 ? 'up' : 'down'}">${d.t}</span>`).join('')}</div>`;
  }
  function frame(who, inner) {
    app.innerHTML = `<div class="topbar"><div class="brand">${GAME.brand}</div><div class="act-tag">Acte ${act.num} · ${act.title}</div></div>
      ${hud()}<div class="stage">${GAME.scene(S, act)}${character(who)}</svg></div>${inner}`;
  }
  function whoTag(id) {
    const c = GAME.characters[id] || GAME.characters.narr;
    return `<span class="who" style="background:${c.color}">${c.name}</span>${c.role ? `<span class="role">${c.role}</span>` : ''}`;
  }
  function applyFx(fx) {
    lastDeltas = [];
    if (!fx) return;
    for (const k in fx) {
      const v = fx[k]; if (!v) continue;
      S[k] = Math.round((S[k] + v) * 10) / 10;
      const g = HUD[k];
      if (g && g.clamp) S[k] = clamp(S[k], 0, 100);
      if (g) lastDeltas.push({ v: g.inv ? -v : v, t: `${g.label} ${v > 0 ? '+' : '−'}${Math.abs(v).toLocaleString('fr-FR')}${g.unit || ''}` });
    }
    if (GAME.norm) GAME.norm(S);
  }
  function pushAfter(lines) {
    queue.unshift(...(lines || []).map(l => l.t ? Object.assign({}, l, { _after: true }) : ({ t: 'say', who: l.who, text: l.text, _after: true })));
  }

  function chainHtml(ch, anim) {
    let k = 0;
    const row = (items, tone) => items && items.length ? `<div class="ch-row ${tone}">${items.map((it, i) => `${i ? `<span class="ch-a"${anim ? ` style="animation-delay:${(k * 0.45).toFixed(2)}s"` : ''}>→</span>` : ''}<span class="ch-p"${anim ? ` style="animation-delay:${(k++ * 0.45).toFixed(2)}s"` : ''}>${it}</span>`).join('')}</div>` : '';
    return `<div class="chain${anim ? ' anim' : ''}">${row(ch.good, 'good')}${row(ch.bad, 'bad')}</div>`;
  }
  function startGame() {
    S = { flags: {} }; GAME.start(S);
    H = {}; lastDeltas = []; maxAct = 0;
    startAct(0);
  }
  function startAct(i) {
    act = GAME.acts[i]; maxAct = Math.max(maxAct, act.num); lastDeltas = [];
    queue = act.steps.slice();
    app.innerHTML = `<div class="card"><div class="kicker">Acte ${act.num}</div><h2>${act.title}</h2><p class="lead">${act.sub}</p><button class="btn" id="go">Continuer ▸</button></div>`;
    document.getElementById('go').onclick = next;
    window.scrollTo(0, 0);
  }
  function next() {
    const f = !act.final && GAME.fail(S);
    if (f && !(queue[0] && queue[0]._after)) return end(f);
    let st;
    while ((st = queue.shift())) { if (!st.if || st.if(S)) break; }
    if (!st) {
      const i = GAME.acts.indexOf(act);
      return i + 1 < GAME.acts.length ? startAct(i + 1) : end();
    }
    if (st.t === 'say' || st.t === 'event') {
      let text;
      if (st.t === 'event') { if (st.do) st.do(S); text = val(st.text, S); applyFx(val(st.fx, S)); if (st.set) Object.assign(S.flags, st.set); }
      else { if (!st._after) lastDeltas = []; text = val(st.text, S); }
      const w = val(st.who, S); frame(w, `<div class="box">${whoTag(w)}<p class="say">${text}</p><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'choice') {
      lastDeltas = [];
      const options = st.options;
      const html = options.map((o, i) => {
        let lock = o.lock ? o.lock(S) : null;
        if (!lock && o.cost) lock = GAME.lock(S, o.cost);
        return `<button class="opt" data-i="${i}" ${lock ? 'disabled' : ''}><div class="opt-t"><span>${val(o.label, S)}</span>${o.cost ? `<span class="opt-c">− ${o.cost.toLocaleString('fr-FR')}${N}€</span>` : ''}</div><div class="opt-d">${val(o.desc, S) || ''}</div>${lock ? `<div class="opt-lock">${lock}</div>` : ''}</button>`;
      }).join('');
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><div class="opts">${html}</div></div>`);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = options[+b.dataset.i];
        H[st.id] = o.id;
        if (o.set) Object.assign(S.flags, o.set);
        const fx = val(o.fx, S);
        if (o.do) o.do(S);
        const suite = (val(o.after, S) || []).slice();
        if (o.voix) suite.unshift({ t: 'voix', voix: val(o.voix, S) });
        if (o.chain) suite.unshift({ t: 'chain', chain: val(o.chain, S), fx });   // les jauges ne bougent qu'après la chaîne
        else applyFx(fx);
        pushAfter(suite); next();
      });
    } else if (st.t === 'chain') {
      lastDeltas = [];
      frame(null, `<div class="box"><div class="prompt">Ce que ta décision déclenche</div>${chainHtml(st.chain, true)}<button class="btn" id="go">${st.solo ? 'Continuer' : 'Voir les réactions'} ▸</button></div>`);
      document.getElementById('go').onclick = () => { applyFx(st.fx); next(); };
    } else if (st.t === 'voix') {
      frame(null, `<div class="box"><div class="voix">${st.voix.map(v => { const c = GAME.characters[v.who] || {}; return `<div class="vx"><span class="who" style="background:${c.color || '#EEF3EC'}">${v.nom || c.name}</span>${!v.nom && c.role ? `<span class="role">${c.role}</span>` : ''}<p>${v.text}</p></div>`; }).join('')}</div><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'qty') {
      lastDeltas = [];
      const mn = val(st.min, S), mx = val(st.max, S), pr = val(st.prompt, S);
      frame(null, `<div class="box"><div class="prompt">${pr}</div>
        <div class="price"><div class="price-v" id="pv"></div><div class="price-m" id="pm"></div></div>
        <input type="range" id="rng" min="${mn}" max="${mx}" step="${st.step || 1}" value="${val(st.def, S)}" aria-label="${pr}">
        <div class="range-l"><span>${st.show(mn)}</span><span>${st.show(mx)}</span></div>
        <div style="text-align:center"><button class="btn" id="go">Valider ▸</button></div></div>`);
      const r = document.getElementById('rng'), upd = () => {
        document.getElementById('pv').textContent = st.show(+r.value);
        document.getElementById('pm').innerHTML = st.info(S, +r.value);
      };
      r.oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        const n = +r.value, res = st.resolve(S, n);
        H[st.id] = res.band || String(n); H[st.id + 'v'] = n;
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    }
    window.scrollTo(0, 0);
  }

  function end(forced) {
    const e = forced ? GAME.endings.find(x => x.id === forced) : GAME.endings.find(x => x.when(S));
    store.add(e.id);
    const deb = GAME.debrief.filter(d => d.act <= maxAct && !(d.finalOnly && forced) && (d.needs || []).every(k => H[k] !== undefined))
      .map(d => `<div class="deb"><h3>${d.title}</h3><p>${d.text(H, S).replace(/ ([:?!;»])/g, N + '$1').replace(/« /g, '«' + N)}</p>${d.chain ? chainHtml(d.chain(H, S), false) : ''}</div>`).join('');
    const found = store.get().length;
    app.innerHTML = `<div class="end" data-ending="${e.id}">
      <div class="end-head"><div class="kicker">Fin de partie</div><h2>${val(e.title, S)}</h2>
        <div class="stamp" style="color:${e.color};border-color:${e.color}">${e.stamp}</div><p class="lead">${val(e.text, S)}</p></div>
      <div class="bilan">${GAME.bilan(S).map(b => `<div><small>${b[0]}</small><b>${b[1]}</b></div>`).join('')}</div>
      ${deb ? `<div class="deb-t">Ce que tu viens de vivre a un nom</div><p class="deb-s">${GAME.debIntro}</p>${deb}` : ''}
      ${forced ? `<p class="deb-s">${GAME.cutText}</p>` : ''}
      <div class="vocab">${GAME.vocab.map(v => `<span>${v}</span>`).join('')}</div>
      <div class="end-btns"><button class="btn" id="again">Rejouer ▸</button><a class="btn ghost" href="${GAME.backLink}">Retour au cours</a></div>
      <p class="found">Fins découvertes${N}: ${found} / ${GAME.endings.length}</p>
    </div><div class="foot">© 2026 Prof 4.0 — Romain Pineau · ${GAME.footer}</div>`;
    document.getElementById('again').onclick = startGame;
    window.scrollTo(0, 0);
  }

  function home() {
    const found = store.get().length;
    app.innerHTML = `<div class="card"><div class="kicker">${GAME.kicker}</div>
      <h1>${GAME.brand}</h1>
      <p class="lead">${GAME.pitch}</p>
      <button class="btn" id="go">Jouer ▸</button>
      <p class="found">${GAME.meta} · ${GAME.endings.length} fins possibles${found ? ` · ${found} découverte${found > 1 ? 's' : ''}` : ''}</p></div>
      <div class="foot">© 2026 Prof 4.0 — Romain Pineau</div>`;
    document.getElementById('go').onclick = startGame;
  }
  home();
})();
</script>
</body>
</html>
