<style>
:root{--eco:#E8564B;--eco-dim:#9A3A31;--good:#4CD97B;--bg:#080404;--panel:#110909;--panel2:#160c0c;--line:#3a1c1a;--txt:#EEF3EC;--muted:#A89391;--bad:#FF5C6A;--warn:#FFC64F;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 700px 420px at 15% 0%, rgba(232,86,75,.16), transparent 65%),radial-gradient(ellipse 700px 500px at 90% 100%, rgba(232,86,75,.10), transparent 65%);background-attachment:fixed;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 14px 22px;}

.pyr{display:block;margin:2px 0 12px;padding:10px 6px;background:#0c0606;border:1px solid var(--line);}
.pyr svg{display:block;width:100%;max-width:340px;margin:0 auto;}
.brand{flex:none;}.act-tag{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chain{margin:12px 0 16px;display:flex;flex-direction:column;gap:12px;}
.ch-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;padding:10px;border:1px solid var(--line);background:#0c0606;border-left:3px solid var(--eco);}
.ch-row.bad{border-left-color:var(--bad);}
.ch-p{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14.5px;line-height:1.2;padding:6px 9px;border:1px solid var(--eco);color:var(--txt);background:rgba(232,86,75,.1);}
.ch-row.bad .ch-p{border-color:var(--bad);background:rgba(255,92,106,.1);}
.ch-a{color:var(--eco);font-weight:700;padding:0 2px;}
.ch-row.bad .ch-a{color:var(--bad);}
.chain.anim .ch-p,.chain.anim .ch-a{opacity:0;animation:chin .4s ease forwards;}
@keyframes chin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.chain.anim .ch-p,.chain.anim .ch-a{animation:none;opacity:1;}}
.voix{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.vx{padding:10px 12px;background:#0c0606;border:1px solid var(--line);}
.vx p{margin-top:8px;font-size:15px;line-height:1.5;}
.deb .chain{margin:10px 0 2px;}.deb .ch-p{font-size:13px;padding:4px 7px;}
@media (max-width:420px){.act-tag{font-size:9.5px;letter-spacing:.5px;}}
.d.up{color:var(--good);border-color:rgba(76,217,123,.5);background:rgba(76,217,123,.1);}
.ch-row.good{border-left-color:var(--good);}.ch-row.good .ch-p{border-color:var(--good);background:rgba(76,217,123,.08);}.ch-row.good .ch-a{color:var(--good);}
.pay small{color:var(--bad);font-weight:600;font-size:12px;}
.pay.tick span b{color:var(--eco);}
.pick-h{text-align:center;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:15px;margin:0 0 10px;}.pick-h b{color:var(--eco);font-size:18px;}
.opt.pick[aria-pressed="true"]{border-color:var(--eco);background:rgba(232,86,75,.09);box-shadow:inset 3px 0 0 var(--eco);}
.opt.pick:disabled{opacity:.4;}.pick-c{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--eco);white-space:nowrap;margin-left:8px;}
.opt-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
</style>

<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONTENU DU JEU — L'offre (Mercatique, Terminale STMG, thème 1)
   Pulpe, jeune marque nantaise de smoothies frais. L'élève construit l'offre : cible, produit, emballage,
   prix, expérience client, puis réagit à l'arrivée d'un géant à 1,99 €.
   Modèle mensuel : ventes = taille du segment × 35 % × attrait du prix × adéquation produit × emballage
                    × image × fidélité × expérience × concurrence ; résultat = ventes × (prix − coût) − charges fixes.
   Jauges : ventes (bouteilles/mois), res (résultat mensuel, k€), fid (fidélité, 0-100), image (0-100).
   ===================================================================== */
const N = ' ';
const r1 = n => Math.round(n * 10) / 10;
const ke = n => (n < 0 ? '−' : '') + r1(Math.abs(n)).toLocaleString('fr-FR') + N + 'k€';
const eu = n => n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + N + '€';
const bt = n => Math.round(n).toLocaleString('fr-FR');
const F = s => s.flags;
const ch = (good, bad) => ({ good, bad });
const V = (...a) => a;
const tab = rows => `<span class="pay">${rows.map(([l, v, t]) => `<span${t ? ' class="tot"' : ''}>${l}</span><b${t ? ' class="tot"' : ''}>${v}</b>`).join('')}</span>`;

const SEG = {
  etudiants: { nom: 'les étudiants', size: 20000, low: 1.6, ideal: 2.2, high: 2.9, recette: 'classique', sens: 1.4 },
  sportifs:  { nom: 'les sportifs', size: 12000, low: 2.6, ideal: 3.5, high: 4.3, recette: 'proteine', sens: 0.9 },
  familles:  { nom: 'les familles', size: 15000, low: 2.2, ideal: 3.0, high: 3.7, recette: 'sanssucre', sens: 1.0 },
  urbains:   { nom: 'les urbains aisés', size: 10000, low: 3.0, ideal: 4.0, high: 4.9, recette: 'bio', sens: 0.7 }
};
const RECETTE = { classique: 0, proteine: 0.30, sanssucre: 0.10, bio: 0.45 };
const EMB = { verre: 0.35, plastique: 0.12, brique: 0.18 };
const attrait = (g, p) => p >= g.ideal ? Math.max(0, 1 - ((p - g.ideal) / (g.high - g.ideal)) ** 2)
  : p >= g.low ? 1 + 0.25 * (g.ideal - p) / (g.ideal - g.low) : Math.max(0.15, 1.25 - 1.5 * (g.low - p));
const cout = s => 1.20 + (RECETTE[F(s).recette] || 0) + (EMB[F(s).emb] || 0);
const model = s => {
  const g = SEG[F(s).seg]; if (!g) return { ventes: 0, res: 0 };
  const fit = !F(s).recette ? 1 : F(s).recette === g.recette ? 1.25 : 0.85;
  const emb = !F(s).emb ? 1 : F(s).emb === 'verre' ? (F(s).seg === 'urbains' || F(s).seg === 'familles' ? 1.1 : 1) : F(s).emb === 'plastique' ? (F(s).seg === 'urbains' ? 0.85 : F(s).seg === 'etudiants' ? 1.05 : 0.95) : 1;
  const conc = s.conc ? Math.max(0.3, 1 - s.conc / 100 * g.sens) : 1;
  const q = g.size * 0.35 * attrait(g, s.prix) * fit * emb * (0.6 + 0.8 * s.image / 100) * (0.8 + 0.4 * s.fid / 100) * (1 + s.xp / 100) * conc;
  return { ventes: Math.round(q / 10) * 10, res: r1(q * (s.prix - cout(s)) / 1000 - s.fixe) };
};
/* applique des changements à une copie de l'état, renvoie les écarts à afficher */
const M = (s, extra) => { const c = Object.assign({}, s, { flags: Object.assign({}, s.flags) }); for (const k in extra || {}) c[k] = (c[k] || 0) + extra[k];
  const m = model(c); return Object.assign({}, extra, { ventes: m.ventes - s.ventes, res: r1(m.res - s.res) }); };

const GAME = {
  title: 'L\'offre',
  brand: '<span>PULPE</span>',
  storeKey: 'mcOffreFins',
  backLink: '../../matieres/mercatique-terminale.html',
  footer: 'Mercatique, Terminale STMG, thème 1',
  kicker: 'Mercatique · Terminale STMG · Thème 1',
  debIntro: 'Tu as construit une offre de A à Z, du client au prix et à l\'expérience. Voici comment on appelle ce que tu as fait.',
  cutText: 'Ta partie s\'est arrêtée avant l\'arrivée du concurrent. Rejoue pour aller au bout.',
  pitch: `Lina a créé Pulpe à Nantes${N}: des smoothies pressés le matin même, avec des fruits de producteurs de la région. Elle a une petite cuisine, deux salariés, 5${N}000${N}€ de charges fixes par mois, et une question${N}: à qui vendre, quoi, à quel prix, et comment donner envie de revenir${N}? Tu es son responsable mercatique.`,
  meta: '4 actes · 20 minutes',
  start: s => Object.assign(s, { ventes: 0, res: -5, fid: 40, image: 50, prix: 3, fixe: 5, xp: 0, conc: 0 }),
  hud: [
    { k: 'ventes', label: 'Ventes', short: 'Ventes/mois', show: s => bt(s.ventes), pct: s => s.ventes / 100, low: s => s.ventes < 2500, unit: ' bouteilles' },
    { k: 'res',    label: 'Résultat mensuel', short: 'Résultat', show: s => ke(s.res), pct: s => 30 + s.res * 7, low: s => s.res < 0, unit: N + 'k€' },
    { k: 'fid',    label: 'Fidélité', short: 'Fidélité', show: s => Math.round(s.fid), pct: s => s.fid, low: s => s.fid < 35, clamp: true },
    { k: 'image',  label: 'Image de marque', short: 'Image', show: s => Math.round(s.image), pct: s => s.image, low: s => s.image < 35, clamp: true }
  ],
  fail: () => null,
  lock: () => null,
  bilan: s => [['Ventes par mois', bt(s.ventes) + ' bouteilles'], ['Prix', eu(s.prix)], ['Résultat mensuel', ke(s.res)], ['Fidélité', Math.round(s.fid) + ' / 100'], ['Image de marque', Math.round(s.image) + ' / 100']],

  characters: {
    lina:   { name: 'Lina', role: 'fondatrice de Pulpe', color: '#FFC64F', body: '#b8452f', hair: '#2a1a12', acc: 'clip' },
    hugo:   { name: 'Hugo', role: 'cuisine et production', color: '#4CD97B', body: '#2f7a4a', hair: '#c9a060', acc: 'box' },
    data:   { name: 'Sami', role: 'développeur de l\'appli', color: '#5B8FFF', body: '#2b3a5a', hair: '#1c1c22', acc: 'tie' },
    conso:  { name: 'Clients', role: '', color: '#EEF3EC' },
    narr:   { name: 'Toi', role: '', color: '#E8564B' }
  },

  acts: [
  /* ------------------------------ ACTE 1 ------------------------------ */
  { num: 1, title: 'Le client', sub: 'On ne vend pas un smoothie. On répond à un besoin.',
    steps: [
      { t: 'say', who: 'lina', text: `Mes smoothies plaisent à tout le monde, donc je veux vendre à tout le monde${N}! Supermarchés, facs, salles de sport, crèches…` },
      { t: 'say', who: 'narr', text: `Tu lances une étude de marché${N}: 600 questionnaires dans Nantes et sa banlieue, puis des entretiens. Quatre groupes de clients se dessinent, avec des attentes différentes. Pour chacun, tu as demandé${N}: «${N}à partir de quel prix ne l'achèteriez-vous plus${N}?» et «${N}en dessous de quel prix douteriez-vous de la qualité${N}?»${tab([['Étudiants : pas chers, pratiques', '20 000 clients · 1,60 € à 2,90 €'], ['Sportifs : protéines, récupération', '12 000 clients · 2,60 € à 4,30 €'], ['Familles : sans sucre ajouté, pour les enfants', '15 000 clients · 2,20 € à 3,70 €'], ['Urbains aisés : bio, local, beau', '10 000 clients · 3,00 € à 4,90 €']])}` },
      { t: 'choice', id: 'seg', prompt: `À qui Pulpe s'adresse-t-elle en priorité${N}?`, options: [
        { id: 'etudiants', label: 'Les étudiants', desc: 'Le groupe le plus nombreux, mais le plus sensible au prix.', set: { seg: 'etudiants' }, fx: s => M(s, {}),
          chain: ch(['20 000 clients potentiels', 'Des volumes importants'], ['Ils comparent les prix au centime près', 'Une marge forcément faible par bouteille']), voix: V({ who: 'conso', nom: 'Jade, 20 ans', text: `Si c'est plus de 2,50${N}€, je prends un jus en brique au supermarché.` }) },
        { id: 'sportifs', label: 'Les sportifs', desc: 'Ils cherchent un produit utile : récupération, protéines.', set: { seg: 'sportifs' }, fx: s => M(s, {}),

  /* ------------------------------ ACTE 2 ------------------------------ */
  { num: 2, title: 'Le prix', sub: 'Le bon prix couvre les coûts, respecte ce que le client accepte de payer, et tient compte des concurrents.',
    steps: [
      { t: 'say', who: 'hugo', text: s => `J'ai fait le calcul${N}: fruits, emballage, main-d'œuvre directe, une bouteille nous coûte ${eu(cout(s))}. Et il y a les 5${N}000${N}€ de charges fixes par mois.` },
      { t: 'say', who: 'lina', text: s => `Les concurrents en grande surface sont à 2,50${N}€. Les bars à jus du centre-ville à 4,50${N}€. Ta cible accepte de payer entre ${eu(SEG[F(s).seg].low)} et ${eu(SEG[F(s).seg].high)}.` },
      { t: 'qty', id: 'prix', min: 1.5, max: 5, step: 0.1, def: 2.5, show: n => eu(n),
        prompt: `Prix de vente de la bouteille${N}?`,
        info: (s, p) => { const c = Object.assign({}, s, { prix: p }), m = model(c), g = SEG[F(s).seg];
          return `Ventes estimées${N}: <b>${bt(m.ventes)}</b> bouteilles par mois · marge par bouteille${N}: <b>${eu(r1((p - cout(s)) * 100) / 100)}</b><br>Résultat mensuel${N}: <b>${ke(m.res)}</b>${p < g.low ? `<br><span style="color:var(--bad)">Trop bas${N}: ta cible doute de la qualité</span>` : p > g.high ? `<br><span style="color:var(--bad)">Au-dessus du prix maximum accepté</span>` : ''}`; },
        resolve: (s, p) => { const g = SEG[F(s).seg], c = Object.assign({}, s, { prix: p }), m = model(c), fx = { ventes: m.ventes - s.ventes, res: r1(m.res - s.res) };
          const marge = p - cout(s);
          const band = p < g.low ? 'doute' : p > g.high ? 'cher' : p < g.ideal - 0.2 ? 'penetration' : p > g.ideal + 0.4 ? 'ecremage' : 'juste';
          s.prix = r1(p * 100) / 100;
          return { band, fx,
            chain: band === 'doute' ? ch([], [`Moins de ${eu(g.low)} : ta cible pense que ce n'est pas un vrai produit frais`, 'Un prix trop bas abîme la valeur perçue', `Marge de ${eu(r1(marge * 100) / 100)} seulement`]) :
                   band === 'cher' ? ch([`${eu(r1(marge * 100) / 100)} de marge par bouteille`], [`Au-dessus de ${eu(g.high)}, la plupart des clients renoncent`, 'Les ventes s\'effondrent']) :
                   band === 'penetration' ? ch(['Un prix d\'attaque pour gagner vite des clients', 'Plus de volume'], ['Une marge plus faible sur chaque bouteille', 'Difficile de remonter le prix ensuite']) :
                   band === 'ecremage' ? ch(['Une forte marge par bouteille', 'Une image haut de gamme'], ['Moins de clients']) :
                   ch(['Un prix dans la zone acceptée par ta cible', `${eu(r1(marge * 100) / 100)} de marge par bouteille`, 'Le prix est cohérent avec le positionnement'], []) }; } },
      { t: 'say', who: 'data', text: `L'appli de commande est prête. Elle peut faire varier les prix automatiquement. Deux idées${N}:` },
      { t: 'choice', id: 'dyn', prompt: `Faire varier les prix${N}?`, options: [
        { id: 'antigaspi', label: 'Après 18 h, −30 % sur les smoothies du jour', desc: 'Les bouteilles pressées le matin sont écoulées au lieu d\'être jetées.', fx: s => M(s, { image: 6, fixe: -0.5 }),
          chain: ch(['Moins de smoothies jetés : 500 € d\'économies par mois', 'Un argument anti-gaspillage apprécié', 'De nouveaux clients découvrent Pulpe moins cher'], ['Certains clients attendront 18 h']),
          voix: V({ who: 'conso', nom: 'Un avis Google', text: `Le bon plan du soir, et en plus rien n'est jeté. Bravo.` }) },
        { id: 'profil', label: 'Un prix personnalisé selon le profil : +15 % pour ceux qui ont un iPhone et habitent les beaux quartiers', desc: 'Ils paieront de toute façon.', set: { profil: true }, fx: s => M(s, { prix: 0.3 }), do: s => {},
          chain: ch(['Plus de marge sur les clients aisés'], ['Les clients ne savent pas qu\'ils paient plus cher que les autres', 'Une pratique très risquée pour la confiance', 'L\'information circule vite']) },
        { id: 'fixe', label: 'Un prix unique pour tous', desc: 'Simple et transparent.', fx: s => M(s, {}),
          chain: ch(['Tous les clients paient le même prix', 'Aucun risque de malentendu'], ['Des invendus jetés chaque soir']) } ] },
      { t: 'event', who: 'conso', if: s => F(s).profil, text: `Trois semaines plus tard, un étudiant en informatique compare les prix sur deux téléphones. Son fil sur les réseaux sociaux${N}: «${N}Pulpe fait payer plus cher les gens qui ont un iPhone.${N}» 40${N}000 partages. Un journal local reprend l'histoire.`,
        fx: s => M(s, { image: -35, fid: -25, prix: -0.3 }) }
    ] },

          chain: ch(['Les clients savent ce qui est fait de leurs données', 'Conforme au RGPD', 'La confiance se renforce'], ['800 € par mois de moins']) },
        { id: 'vendre', label: 'Revendre les données', desc: 'Une ligne en petits caractères dans les conditions d\'utilisation.', fx: s => M(s, { fixe: -0.8, fid: -20, image: -20 }),
          chain: ch(['800 € de recettes par mois'], ['Les clients reçoivent des publicités pour des compléments alimentaires', 'Ils comprennent d\'où vient la fuite', 'Un consentement caché n\'est pas un consentement valable : la CNIL peut sanctionner']),
          voix: V({ who: 'conso', nom: 'Un client', text: `Comment cette marque connaît-elle mon adresse et mes goûts${N}? Ah. Pulpe.` }) } ] }

  endings: [
    { id: 'scandale', when: s => s.verdict === 'scandale', title: 'Le prix de trop', stamp: 'Bad buzz', color: '#FF5C6A',

  debrief: [
    { act: 1, needs: ['seg'], title: 'Acte 1 — Le client', text: h => `La <em>segmentation</em> découpe le marché en groupes de consommateurs aux attentes proches. Le <em>ciblage</em> consiste à choisir le ou les segments visés, et le <em>positionnement</em> à définir la place que la marque veut occuper dans leur esprit. L\'<em>offre</em> se compose du produit (recette), de son <em>conditionnement</em> (emballage) et des services associés. ${h.recette ? 'La cohérence entre la cible et la recette a pesé sur les ventes.' : ''} L\'emballage communique aussi des valeurs : le verre consigné répond aux attentes écologiques.`,
      chain: () => ({ good: ['Étude de marché', 'Segmentation', 'Ciblage', 'Positionnement', 'Offre cohérente'], bad: ['Vendre à tout le monde', 'Offre floue', 'Personne ne se sent concerné'] }) },
    { act: 2, needs: ['prix'], title: 'Acte 2 — Le prix', text: h => `Un prix se fixe en regardant trois choses : les <em>coûts</em> (il doit les couvrir), la <em>demande</em> (le <em>prix d\'acceptabilité</em> : au-dessus, le client renonce ; en dessous, il doute de la qualité) et la <em>concurrence</em>. Un prix bas pour conquérir vite le marché est une stratégie de <em>pénétration</em> ; un prix élevé pour une clientèle prête à payer, une stratégie d\'<em>écrémage</em>. ${h.dyn === 'profil' ? 'La <em>tarification personnalisée</em> cachée, fondée sur le profil, est une pratique risquée et souvent jugée déloyale.' : h.dyn === 'antigaspi' ? 'Une <em>tarification dynamique</em> transparente, comme le prix du soir, peut servir à la fois le client et l\'entreprise.' : ''}`,
      chain: () => ({ good: ['Coûts couverts', 'Prix accepté par la cible', 'Face à la concurrence', 'Bonne marge'], bad: ['Prix trop bas', 'Doute sur la qualité', 'Ou prix trop haut', 'Clients perdus'] }) },
    { act: 3, needs: ['xp'], title: 'Acte 3 — L\'expérience', text: h => `L\'<em>expérience client</em> désigne tout ce que vit le client avec la marque, au-delà du produit. La <em>personnalisation</em> adapte l\'offre à chacun, l\'<em>abonnement</em> installe une relation durable, le lieu physique crée un moment partagé. Ces dispositifs visent la <em>fidélisation</em>. Ils reposent souvent sur des <em>données personnelles</em>, que le <em>RGPD</em> protège : consentement explicite, usage limité. ${h.donnees === 'vendre' ? 'Les revendre en cachette a trahi les clients.' : ''}`,
      chain: () => ({ good: ['Expérience', 'Personnalisation', 'Relation', 'Fidélité'], bad: ['Produit seul', 'Achat unique', 'Clients volatils'] }) },
    { act: 4, needs: ['riposte'], finalOnly: true, title: 'Acte 4 — Le géant', text: h => `Face à un concurrent plus puissant, s\'aligner sur son prix est rarement tenable : il a des coûts plus bas. La <em>différenciation</em> repose sur ce qui fait la <em>valeur perçue</em> de l\'offre : origine des produits, fraîcheur, expérience, relation. ${h.riposte === 'differencier' ? 'Tu as joué la carte de la différenciation.' : h.riposte === 'aligner' ? 'Tu as choisi la guerre des prix, que seul le plus gros peut gagner.' : ''} Une offre est solide quand tous ses éléments sont cohérents entre eux et avec la cible.`,
      chain: () => ({ good: ['Valeur perçue', 'Différenciation', 'Clients fidèles', 'Offre difficile à copier'], bad: ['Guerre des prix', 'Marge détruite', 'Marque banalisée'] }) }
  ],
  vocab: ['Étude de marché', 'Segmentation', 'Cible', 'Positionnement', 'Offre', 'Conditionnement', 'Gamme', 'Coût de revient', 'Prix d\'acceptabilité', 'Stratégie de pénétration', 'Stratégie d\'écrémage', 'Tarification dynamique', 'Expérience client', 'Personnalisation', 'Fidélisation', 'Données personnelles', 'RGPD', 'Différenciation', 'Valeur perçue']
};
let H = {};

/* =====================================================================
   2. DÉCOR — la bouteille Pulpe et son étiquette de prix.
   ===================================================================== */
GAME.scene = (S, act) => {
  const R = '#E8564B', em = F(S).emb, col = em === 'verre' ? '#9fd8c8' : em === 'brique' ? '#c9b48a' : em === 'plastique' ? '#cfd6e0' : '#8a8a8a';
  const fruit = { classique: '#FF6B8A', proteine: '#C79A5B', sanssucre: '#FFB347', bio: '#7BC96F' }[F(S).recette] || '#E8564B';
  const g = SEG[F(S).seg];
  return `<svg viewBox="0 0 360 200" role="img" aria-label="La bouteille Pulpe">
    <rect width="360" height="200" fill="#0a0505"/><rect x="0" y="0" width="360" height="162" fill="#110909"/>
    <text x="240" y="20" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="9" fill="#A89391">PULPE · NANTES</text>
    <g transform="translate(206,40)">${em === 'brique' ? `<rect x="-18" y="10" width="36" height="96" rx="3" fill="${col}"/><rect x="-18" y="40" width="36" height="40" fill="${fruit}" opacity=".9"/>` :
      `<path d="M-8,0 h16 v14 q14,8 14,26 v62 q0,6 -6,6 h-32 q-6,0 -6,-6 v-62 q0,-18 14,-26 z" fill="${col}" opacity=".35" stroke="${col}" stroke-width="1.5"/><path d="M-20,46 h40 v56 q0,6 -6,6 h-28 q-6,0 -6,-6 z" fill="${fruit}" opacity=".9"/>`}
      <text x="0" y="78" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="900" font-size="8" fill="#fff">PULPE</text></g>
    <g transform="translate(300,64)"><rect x="-32" y="-14" width="64" height="28" rx="4" fill="${R}"/><text x="0" y="5" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="11" fill="#fff">${eu(S.prix)}</text></g>
    <text x="300" y="100" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700" font-size="10" fill="#A89391">${g ? 'cible : ' + g.nom : 'cible à choisir'}</text>
    ${S.conc ? `<g transform="translate(300,130)"><rect x="-34" y="-11" width="68" height="22" rx="3" fill="#2b2b2b" stroke="#FF5C6A"/><text x="0" y="4" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700" font-size="10" fill="#FF5C6A">Fruitissimo 1,99 €</text></g>` : ''}
    <rect x="0" y="162" width="360" height="38" fill="#0a0606"/><line x1="0" y1="162" x2="360" y2="162" stroke="#3a1c1a" stroke-width="1.5"/>`;
};
/* =====================================================================
   3. MOTEUR — générique, lit GAME et ne contient aucun texte de scénario.
   ===================================================================== */
(function () {
  const app = document.getElementById('app');
  let S, queue, act, lastDeltas = [], maxAct = 0;
  const HUD = {}; GAME.hud.forEach(g => HUD[g.k] = g);

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(GAME.storeKey) || '[]'); } catch (e) { return []; } },
    add(id) { try { const a = store.get(); if (!a.includes(id)) { a.push(id); localStorage.setItem(GAME.storeKey, JSON.stringify(a)); } } catch (e) {} }
  };
  const val = (v, ...a) => typeof v === 'function' ? v(...a) : v;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  function character(id) {
    const c = GAME.characters[id];
    if (!c || !c.body) return '';
    const acc = {
      bun: `<circle cx="-2" cy="-88" r="7" fill="${c.hair}"/>`,
      cap: `<path d="M-15,-72 Q0,-92 15,-72 Z" fill="${c.color}"/><rect x="6" y="-74" width="16" height="4" rx="2" fill="${c.color}"/>`,
      box: `<rect x="14" y="-44" width="22" height="18" rx="3" fill="#8a5a22" stroke="${c.color}" stroke-width="1.5"/>`,
      tie: `<path d="M0,-52 L4,-44 L0,-26 L-4,-44 Z" fill="${c.color}"/>`,
      clip: `<rect x="14" y="-46" width="16" height="22" rx="2" fill="#EEF3EC"/><rect x="18" y="-49" width="8" height="5" rx="1" fill="${c.color}"/><rect x="2" y="-73" width="12" height="6" rx="3" fill="none" stroke="#EEF3EC" stroke-width="1.5"/>`
    }[c.acc] || '';
    return `<g transform="translate(76,186)">
      <ellipse cx="0" cy="2" rx="26" ry="5" fill="#000" opacity=".5"/>
      <rect x="-13" y="-22" width="11" height="24" rx="5" fill="#1b2420"/><rect x="2" y="-22" width="11" height="24" rx="5" fill="#1b2420"/>
      <rect x="-25" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(8 -20 -50)"/>
      <rect x="-18" y="-56" width="36" height="40" rx="12" fill="${c.body}"/>
      <rect x="15" y="-52" width="10" height="28" rx="5" fill="${c.body}" transform="rotate(-18 20 -50)"/>
      <circle cx="0" cy="-70" r="15" fill="#E8B58A"/>
      <path d="M-15,-72 Q-14,-88 0,-87 Q15,-88 15,-72 Q8,-80 -15,-72 Z" fill="${c.hair}"/>
      <circle cx="4" cy="-70" r="1.8" fill="#151515"/><circle cx="11" cy="-70" r="1.8" fill="#151515"/>
      <path d="M4,-63 Q8,-60 12,-63" stroke="#151515" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      ${acc}
      <path d="M12,-82 Q19,-70 12,-58 M17,-52 Q21,-36 17,-20" stroke="${c.color}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    </g>`;
  }

  function hud() {
    return `<div class="hud">${GAME.hud.map(g => `<div class="g${g.low(S) ? ' low' : ''}"><div class="g-l" title="${g.label}">${g.short}</div><div class="g-v">${g.show(S)}</div><div class="g-b"><i style="width:${clamp(g.pct(S), 0, 100)}%"></i></div></div>`).join('')}</div>
      <div class="deltas" aria-live="polite">${lastDeltas.map(d => `<span class="d ${d.v > 0 ? 'up' : 'down'}">${d.t}</span>`).join('')}</div>`;
  }
  function frame(who, inner) {
    app.innerHTML = `<div class="topbar"><div class="brand">${GAME.brand}</div><div class="act-tag">Acte ${act.num} · ${act.title}</div></div>
      ${hud()}<div class="stage">${GAME.scene(S, act)}${character(who)}</svg></div>${inner}`;
  }
  function whoTag(id) {
    const c = GAME.characters[id] || GAME.characters.narr;
    return `<span class="who" style="background:${c.color}">${c.name}</span>${c.role ? `<span class="role">${c.role}</span>` : ''}`;
  }
  function applyFx(fx) {
    lastDeltas = [];
    if (!fx) return;
    for (const k in fx) {
      const v = fx[k]; if (!v) continue;
      S[k] = Math.round((S[k] + v) * 10) / 10;
      const g = HUD[k];
      if (g && g.clamp) S[k] = clamp(S[k], 0, 100);
      if (g) lastDeltas.push({ v: g.inv ? -v : v, t: `${g.label} ${v > 0 ? '+' : '−'}${Math.abs(v).toLocaleString('fr-FR')}${g.unit || ''}` });
    }
    if (GAME.norm) GAME.norm(S);
  }
  function pushAfter(lines) {
    queue.unshift(...(lines || []).map(l => l.t ? Object.assign({}, l, { _after: true }) : ({ t: 'say', who: l.who, text: l.text, _after: true })));
  }

  function chainHtml(ch, anim) {
    let k = 0;
    const row = (items, tone) => items && items.length ? `<div class="ch-row ${tone}">${items.map((it, i) => `${i ? `<span class="ch-a"${anim ? ` style="animation-delay:${(k * 0.45).toFixed(2)}s"` : ''}>→</span>` : ''}<span class="ch-p"${anim ? ` style="animation-delay:${(k++ * 0.45).toFixed(2)}s"` : ''}>${it}</span>`).join('')}</div>` : '';
    return `<div class="chain${anim ? ' anim' : ''}">${row(ch.good, 'good')}${row(ch.bad, 'bad')}</div>`;
  }
  function startGame() {
    S = { flags: {} }; GAME.start(S);
    H = {}; lastDeltas = []; maxAct = 0;
    startAct(0);
  }
  function startAct(i) {
    act = GAME.acts[i]; maxAct = Math.max(maxAct, act.num); lastDeltas = [];
    queue = act.steps.slice();
    app.innerHTML = `<div class="card"><div class="kicker">Acte ${act.num}</div><h2>${act.title}</h2><p class="lead">${act.sub}</p><button class="btn" id="go">Continuer ▸</button></div>`;
    document.getElementById('go').onclick = next;
    window.scrollTo(0, 0);
  }
  function next() {
    const f = !act.final && GAME.fail(S);
    if (f && !(queue[0] && queue[0]._after)) return end(f);
    let st;
    while ((st = queue.shift())) { if (!st.if || st.if(S)) break; }
    if (!st) {
      const i = GAME.acts.indexOf(act);
      return i + 1 < GAME.acts.length ? startAct(i + 1) : end();
    }
    if (st.t === 'say' || st.t === 'event') {
      let text;
      if (st.t === 'event') { if (st.do) st.do(S); text = val(st.text, S); applyFx(val(st.fx, S)); if (st.set) Object.assign(S.flags, st.set); }
      else { if (!st._after) lastDeltas = []; text = val(st.text, S); }
      const w = val(st.who, S); frame(w, `<div class="box">${whoTag(w)}<p class="say">${text}</p><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'choice') {
      lastDeltas = [];
      const options = st.options;
      const html = options.map((o, i) => {
        let lock = o.lock ? o.lock(S) : null;
        if (!lock && o.cost) lock = GAME.lock(S, o.cost);
        return `<button class="opt" data-i="${i}" ${lock ? 'disabled' : ''}><div class="opt-t"><span>${val(o.label, S)}</span>${o.cost ? `<span class="opt-c">− ${o.cost.toLocaleString('fr-FR')}${N}€</span>` : ''}</div><div class="opt-d">${val(o.desc, S) || ''}</div>${lock ? `<div class="opt-lock">${lock}</div>` : ''}</button>`;
      }).join('');
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><div class="opts">${html}</div></div>`);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = options[+b.dataset.i];
        H[st.id] = o.id;
        if (o.set) Object.assign(S.flags, o.set);
        const fx = val(o.fx, S);
        if (o.do) o.do(S);
        const suite = (val(o.after, S) || []).slice();
        if (o.voix) suite.unshift({ t: 'voix', voix: val(o.voix, S) });
        if (o.chain) suite.unshift({ t: 'chain', chain: val(o.chain, S), fx });   // les jauges ne bougent qu'après la chaîne
        else applyFx(fx);
        pushAfter(suite); next();
      });
    } else if (st.t === 'chain') {
      lastDeltas = [];
      frame(null, `<div class="box"><div class="prompt">Ce que ta décision déclenche</div>${chainHtml(st.chain, true)}<button class="btn" id="go">${st.solo ? 'Continuer' : 'Voir les réactions'} ▸</button></div>`);
      document.getElementById('go').onclick = () => { applyFx(st.fx); next(); };
    } else if (st.t === 'voix') {
      frame(null, `<div class="box"><div class="voix">${st.voix.map(v => { const c = GAME.characters[v.who] || {}; return `<div class="vx"><span class="who" style="background:${c.color || '#EEF3EC'}">${v.nom || c.name}</span>${!v.nom && c.role ? `<span class="role">${c.role}</span>` : ''}<p>${v.text}</p></div>`; }).join('')}</div><button class="btn" id="go">Continuer ▸</button></div>`);
      document.getElementById('go').onclick = next;
    } else if (st.t === 'pick') {
      lastDeltas = [];
      const opts = val(st.options, S), budget = val(st.budget, S), sel = new Set();
      frame(null, `<div class="box"><div class="prompt">${val(st.prompt, S)}</div><p class="pick-h" id="pk"></p><div class="opts">${opts.map((o, i) => `<button class="opt pick" data-i="${i}" aria-pressed="false"><div class="opt-t"><span>${o.label}</span><span class="pick-c">${o.cost} ${st.unit || ''}</span></div><div class="opt-d">${val(o.desc, S) || ''}</div></button>`).join('')}</div><div style="text-align:center"><button class="btn" id="go">${st.go || 'Valider ▸'}</button></div></div>`);
      const used = () => [...sel].reduce((a, i) => a + opts[i].cost, 0);
      const upd = () => {
        const u = used();
        document.getElementById('pk').innerHTML = `${st.unitLabel || 'Budget'} : <b>${budget - u}</b> ${st.unit || ''} restant${budget - u > 1 ? 's' : ''} sur ${budget}`;
        app.querySelectorAll('.pick').forEach(b => { const i = +b.dataset.i; b.disabled = !sel.has(i) && opts[i].cost > budget - u; b.setAttribute('aria-pressed', sel.has(i)); });
        document.getElementById('go').disabled = st.min ? sel.size < st.min : false;
      };
      app.querySelectorAll('.pick').forEach(b => b.onclick = () => { const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); upd(); });
      upd();
      document.getElementById('go').onclick = () => {
        const ids = [...sel].sort((x, y) => x - y).map(i => opts[i].id);
        H[st.id] = ids.join(',') || 'aucun';
        const res = st.resolve(S, ids) || {};
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    } else if (st.t === 'qty') {
      lastDeltas = [];
      const mn = val(st.min, S), mx = val(st.max, S), pr = val(st.prompt, S);
      frame(null, `<div class="box"><div class="prompt">${pr}</div>
        <div class="price"><div class="price-v" id="pv"></div><div class="price-m" id="pm"></div></div>
        <input type="range" id="rng" min="${mn}" max="${mx}" step="${st.step || 1}" value="${val(st.def, S)}" aria-label="${pr}">
        <div class="range-l"><span>${st.show(mn)}</span><span>${st.show(mx)}</span></div>
        <div style="text-align:center"><button class="btn" id="go">Valider ▸</button></div></div>`);
      const r = document.getElementById('rng'), upd = () => {
        document.getElementById('pv').textContent = st.show(+r.value);
        document.getElementById('pm').innerHTML = st.info(S, +r.value);
      };
      r.oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        const n = +r.value, res = st.resolve(S, n);
        H[st.id] = res.band || String(n); H[st.id + 'v'] = n;
        if (res.do) res.do(S);
        const suite = (res.after || []).slice();
        if (res.voix) suite.unshift({ t: 'voix', voix: res.voix });
        if (res.chain) suite.unshift({ t: 'chain', chain: res.chain, fx: res.fx });
        else applyFx(res.fx);
        pushAfter(suite); next();
      };
    }
    window.scrollTo(0, 0);
  }

  function end(forced) {
    const e = forced ? GAME.endings.find(x => x.id === forced) : GAME.endings.find(x => x.when(S));
    store.add(e.id);
    const deb = GAME.debrief.filter(d => d.act <= maxAct && !(d.finalOnly && forced) && (d.needs || []).every(k => H[k] !== undefined))
      .map(d => `<div class="deb"><h3>${d.title}</h3><p>${d.text(H, S).replace(/ ([:?!;»])/g, N + '$1').replace(/« /g, '«' + N)}</p>${d.chain ? chainHtml(d.chain(H, S), false) : ''}</div>`).join('');
    const found = store.get().length;
    app.innerHTML = `<div class="end" data-ending="${e.id}">
      <div class="end-head"><div class="kicker">Fin de partie</div><h2>${val(e.title, S)}</h2>
        <div class="stamp" style="color:${e.color};border-color:${e.color}">${e.stamp}</div><p class="lead">${val(e.text, S)}</p></div>
      <div class="bilan">${GAME.bilan(S).map(b => `<div><small>${b[0]}</small><b>${b[1]}</b></div>`).join('')}</div>
      ${deb ? `<div class="deb-t">Ce que tu viens de vivre a un nom</div><p class="deb-s">${GAME.debIntro}</p>${deb}` : ''}
      ${forced ? `<p class="deb-s">${GAME.cutText}</p>` : ''}
      <div class="vocab">${GAME.vocab.map(v => `<span>${v}</span>`).join('')}</div>
      <div class="end-btns"><button class="btn" id="again">Rejouer ▸</button><a class="btn ghost" href="${GAME.backLink}">Retour au cours</a></div>
      <p class="found">Fins découvertes${N}: ${found} / ${GAME.endings.length}</p>
    </div><div class="foot">© 2026 Prof 4.0 — Romain Pineau · ${GAME.footer}</div>`;
    document.getElementById('again').onclick = startGame;
    window.scrollTo(0, 0);
  }

  function home() {
    const found = store.get().length;
    app.innerHTML = `<div class="card"><div class="kicker">${GAME.kicker}</div>
      <h1>${GAME.brand}</h1>
      <p class="lead">${GAME.pitch}</p>
      <button class="btn" id="go">Jouer ▸</button>
      <p class="found">${GAME.meta} · ${GAME.endings.length} fins possibles${found ? ` · ${found} découverte${found > 1 ? 's' : ''}` : ''}</p></div>
      <div class="foot">© 2026 Prof 4.0 — Romain Pineau</div>`;
    document.getElementById('go').onclick = startGame;
  }
  home();
})();
</script>
</body>
</html>
